<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Notícias | Henrique Behrens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#0147ab;--p2:#D2E8FF;--p3:#E2E6ED;--p4:#FAB58F;--p5:#DF570B;
  --bg:#f6f8fb;--panel:#ffffff;--ink:#0d1530;--ink2:#3f4a63;--ink3:#6b7489;--line:var(--p3);
  --brand:var(--p1);--brand2:var(--p1);--accent:var(--p5);--chip:var(--p3);--chipink:#1b2440;--soft:var(--p2);
  --br:var(--p1);--intl:var(--p5);--emp:var(--p4);--warn:#a33f06;--warnbg:#fde3d3;--ok:var(--p1);--okbg:var(--p2);
  --shadow:0 1px 2px rgba(1,71,171,.05),0 1px 3px rgba(1,71,171,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand2);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--brand);color:#fff;padding:18px 16px 0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;margin:0;letter-spacing:.2px}
h1 span{color:var(--p2);font-weight:500}
.meta{font-size:12.5px;color:var(--p2);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;width:220px;font:inherit;font-size:13.5px}
.tools input::placeholder{color:#c4d2e4}
.tools select,.tools button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.tools select option{color:#111}
nav.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:transparent;border:0;color:var(--p2);padding:10px 14px;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs .n{font-size:11px;background:#ffffff1f;border-radius:10px;padding:1px 7px;margin-left:6px}
main{padding:20px 0 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.kicker{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
h2{font:600 19px/1.3 "IBM Plex Serif",Georgia,serif;margin:0 0 10px}
h3{font:600 16px/1.3 "IBM Plex Sans",sans-serif;margin:0}
.summary p{margin:0 0 10px;color:var(--ink)}
.summary p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
ol.top10{list-style:none;padding:0;margin:0;counter-reset:t}
ol.top10 li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
ol.top10 li:first-child{border-top:0;padding-top:4px}
ol.top10 li::before{content:counter(t);font:600 20px/1 "IBM Plex Serif",serif;color:var(--accent);padding-top:2px}
.t10t{font-weight:600;margin-bottom:3px}
.t10d{color:var(--ink2);font-size:14px}
.why{font-size:13px;color:var(--ink);background:var(--soft);border-radius:6px;padding:5px 8px;margin-top:6px}
.why b{color:var(--ink2);font-weight:600}
.src{font-size:12.5px;color:var(--ink3);margin-top:5px}
.src a{margin-right:8px}
.sechead{border-left:4px solid var(--br);padding-left:12px}
.sec-intl .sechead{border-color:var(--intl)}.sec-emp .sechead{border-color:var(--emp)}
.themes-nav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.themes-nav a{font-size:12.5px;background:var(--soft);color:var(--chipink);padding:4px 10px;border-radius:999px}
.themes-nav a b{font-weight:600;margin-left:4px;color:var(--ink3)}
.theme{scroll-margin-top:12px}
.theme .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.theme .cnt{font-size:12px;color:var(--ink3)}
.tsum{font-size:14px;color:var(--ink2);margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.items{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.card .ct{font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
.card .ct:hover{color:var(--brand2)}
.card .cd{font-size:13.5px;color:var(--ink2)}
.card .cm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3);margin-top:auto;padding-top:4px}
.tag{background:var(--chip);color:var(--chipink);border-radius:4px;padding:1px 6px;font-weight:500}
.est{color:var(--warn)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:1px 6px}
.empty{color:var(--ink3);font-size:13.5px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600}
td.d{white-space:nowrap;font-weight:600}
.st{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.st.c{color:var(--ok);background:var(--okbg)}.st.e{color:var(--warn);background:var(--warnbg)}.st.r{color:var(--ink2);background:var(--chip)}
.tbl{overflow-x:auto}
.daysep td{background:var(--chip);font-weight:600;color:var(--ink2);font-size:12.5px}
.log li{margin-bottom:4px;font-size:13.5px}
.okc{color:var(--ok);font-weight:600}.wc{color:var(--warn);font-weight:600}
.hidden{display:none!important}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:10px 16px 30px}
.note{font-size:12.5px;color:var(--ink3)}
mark{background:#ffe58f;color:#111;border-radius:2px}
.gsec{display:grid;gap:14px}
.gblk h3{font:600 14px/1.3 "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2);margin:0 0 4px}
.gblk p{margin:0}
a.t10t{display:block;font-weight:600;margin-bottom:3px;color:var(--ink)}
a.t10t:hover{color:var(--brand2)}
.intro{margin:0 0 12px;font-weight:500}
.tsums p{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--p4);color:var(--ink)}
.tsums p:last-child{margin-bottom:0}
.tsums a{color:var(--ink)}.tsums a b{color:var(--brand2)}
.ag{display:grid;gap:10px}
.agwrap .ag{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.agh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--brand2);border-bottom:2px solid var(--p5);padding-bottom:3px;margin-bottom:4px}
.agr{display:grid;grid-template-columns:48px 44px 1fr 10px;gap:8px;align-items:baseline;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.agr:last-child{border-bottom:0}
.agt{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12.5px}
.agg{font-size:11px;font-weight:600;color:var(--chipink);background:var(--chip);border-radius:4px;padding:0 5px;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;align-self:center}
.dot.r{background:var(--p3);border:1px solid var(--ink3)}.dot.c{background:var(--p1)}.dot.e{background:var(--p5)}
:root[data-theme="dark"] .dot.c{background:var(--p2)}
.aglg{margin-top:10px}.aglg .dot{margin:0 3px 0 8px}.aglg .dot:first-child{margin-left:0}
.sumbox{position:relative}
.tog{position:absolute;top:14px;right:16px;background:var(--soft);color:var(--brand2);border:1px solid var(--line);border-radius:6px;font:500 12px "IBM Plex Sans",sans-serif;padding:3px 9px;cursor:pointer}
.sumbox.collapsed .gsec,.sumbox.collapsed .intro,.sumbox.collapsed .tsums{display:none}
.sumbox.collapsed h2{margin-bottom:0}
.sumbox .kicker{padding-right:150px}
.agdest{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.agdest li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.fl{font-size:18px;line-height:1.2}
.agnx{margin:10px 0 0}
.agc{margin-bottom:16px}
.agcn{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.agcn .fl{font-size:22px}
table.cal{table-layout:fixed;min-width:760px;border:1px solid var(--p1)}
table.cal th{background:var(--p1);color:#fff;text-align:center;font-size:12px;text-transform:none;letter-spacing:0;padding:4px;border-right:1px solid #ffffff40}
table.cal th span{display:block;font-weight:400;font-size:11px;color:var(--p2)}
table.cal td{border-right:1px solid var(--line);padding:4px 6px;height:58px;vertical-align:top}
.ce{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3;padding:2px 4px;border-radius:3px}
.ce .cn em{display:block;font-style:italic;color:var(--ink3);font-size:11px}
.ce .ch{white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.ce.hl{background:var(--p4);font-weight:600;color:#3a1400}
.ce.hl .ch,.ce.hl em{color:#5a2200}
.hlk{display:inline-block;width:12px;height:10px;background:var(--p4);border-radius:2px;margin-right:4px;vertical-align:middle}
.agtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dl{background:var(--p1);color:#fff;border:0;border-radius:6px;font:500 12.5px "IBM Plex Sans",sans-serif;padding:6px 12px;cursor:pointer}
.dl:hover{filter:brightness(1.1)}
.agx{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:18px 22px}
@media (max-width:600px){.agx{grid-template-columns:1fr}}
.agc{margin:0}
table.cal{table-layout:auto;min-width:0;border:0;width:100%;font-size:12.5px}
table.cal th{background:none;color:var(--ink3);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px;border:0;border-bottom:1.5px solid var(--p1)}
table.cal th.n,table.cal td.n{text-align:right;white-space:nowrap}
table.cal td{border:0;border-bottom:1px solid var(--line);padding:4px 6px;height:auto;vertical-align:baseline}
table.cal td.cd{white-space:nowrap;color:var(--ink2);font-weight:500}
table.cal td.ct2{white-space:nowrap;color:var(--ink3);font-variant-numeric:tabular-nums}
table.cal td.at{font-weight:600;color:var(--ink)}
table.cal tr.hi td{background:rgba(250,181,143,.22)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p5);margin-right:6px;vertical-align:middle}
@media (max-width:600px){table.cal td.ct2,table.cal th:nth-child(2){display:none}}
.pngbox{position:fixed;left:-10000px;top:0;padding:0;background:var(--panel);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.pngbox .agx{grid-template-columns:1fr 1fr}
.pnghead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--p1);padding-bottom:10px;margin-bottom:14px}
.pngk{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.pngt{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;color:var(--p1)}
.pngb{font-size:12px;color:var(--ink3)}
.pngbox .agdest{margin-bottom:16px}
.mtx{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.mtx thead th{background:var(--p1);color:#fff;text-align:left;font-size:11px;text-transform:none;letter-spacing:0;padding:4px 6px;font-weight:600}
.mtx thead th span{font-weight:400;color:var(--p2);margin-left:2px}
.mtx th.pc{width:46px;text-align:center}
.mtx tbody th.pc{background:var(--soft);color:var(--ink3);text-transform:none;letter-spacing:0;font-size:10px;font-weight:600;vertical-align:middle;padding:2px;border-bottom:1px solid var(--line);text-align:center}
.mtx tbody th.pc .fl{display:block;font-size:16px;line-height:1}
.mtx td{vertical-align:top;padding:2px 3px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.mx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:6px;padding:1px 4px;border-radius:3px;margin-bottom:1px;line-height:1.25}
.mx:last-child{margin-bottom:0}
.mx.hi{background:rgba(250,181,143,.28)}
.mxh{color:var(--ink3);font-size:11px}
.mxv{font-size:11px;white-space:nowrap;margin-left:auto}.mxv b{color:var(--ink)}
.vs{color:var(--ink3)}
.pngbox{width:1600px;padding:0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Painel de Notícias <span>| Henrique Behrens</span></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar notícias…" aria-label="Buscar">
        <select id="fv" aria-label="Filtrar por veículo"><option value="">Todos os veículos</option></select>
        <button id="theme" title="Alternar tema">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>Painel gerado automaticamente a partir de páginas públicas, sem login. Resumos de notícias baseados em título, linha-fina e descrição pública de cada matéria. Horários em BRT (UTC−3); “≈” indica horário estimado a partir de indicação relativa (“há 2 horas”).</footer>

function S(k){return VNAME[k]||k}

const DATA={"meta": {"edicao": "Quarta-feira, 11 de novembro de 2026", "gerado": "11/11/2026 ≈06h15 (2ª execução agendada; atualização da edição das ≈05h com coleta entre ≈06h00 e ≈06h10)", "janela": "10/11 11h00 → 11/11 ≈06h10"}, "geral": [{"h": "Política: crise na PF, Mendonça herda casos e a disputa pelo Senado esquenta", "p": "O dia político girou em torno da Polícia Federal. O afastamento de delegados das investigações do Master e do INSS aprofundou o racha na corporação: a associação dos delegados (ADPF) falou em interferência do diretor-geral, Andrei Rodrigues, que se desfiliou da entidade, e a Transparência Internacional viu “contornos de extrema gravidade” (Valor, Folha, Poder360, Veja). Na leitura de aliados de Lula, a insatisfação pode forçar a troca de Andrei no quarto mandato (O Globo), e a PF deve incluir mais três ministros do STF nos relatórios refeitos sobre o celular de Vorcaro (Valor). No Supremo, André Mendonça passou a relatar o caso de vazamento de dados de ministros, desdobramento do extinto inquérito das fake news, e deve prorrogar a apuração sobre Lulinha (O Globo, Poder360, Folha); Alcolumbre viu o fim do inquérito como positivo e acenou com reforma do Judiciário (Folha). O TSE multou a Meta em R$ 7,5 milhões por descumprir decisões de isonomia entre Lula e Flávio, sem ver interferência deliberada (Valor, Estadão, Poder360). Na madrugada, O Globo relatou que Marinho planeja abrir impeachment de Moraes se presidir o Senado e que o governo manteve o sigilo de 100 anos sobre as visitas de Vorcaro à PF; o PL decide hoje se compõe com Motta na Câmara (Veja). Na sucessão do Senado, a oposição se divide entre Marinho e Tereza Cristina, e Lula quer ministros de volta à Casa para conter o PL (CNN, O Globo, Folha, Metrópoles)."}, {"h": "Mercado doméstico: dólar no maior nível desde julho de 2025 e ata do Copom pesa na curva", "p": "O CPI americano acima do esperado e a leitura de um BC brasileiro menos duro que o necessário levaram o dólar a R$ 5,58 (+1,36%), maior fechamento desde julho de 2025 e máxima do ano, com a PTAX a R$ 5,5840 (Valor, O Globo, Poder360, BCB). O Ibovespa caiu 0,52%, para 171.337 pontos, pressionado por Vale e pela aversão a risco (Valor, Veja, Investing). Os juros curtos fecharam em queda e os longos subiram depois da ata do Copom, que citou o fim da escala 6x1, a depreciação do câmbio, o petróleo e o El Niño entre os fatores que pioraram as expectativas de inflação (Valor, Estadão). Galípolo disse que os efeitos colaterais dos juros são menores que deixar a inflação correr e alertou que a perda de confiança pode manter os juros altos por anos (O Globo, Veja, Poder360). Leitura analítica: a Bloomberg viu um BC cauteloso com alta de preços e desaceleração, e a Franklin Templeton cortou risco por ver continuidade no Lula 4 (Bloomberg, Valor). Hoje sai a PMS de setembro, às 9h."}, {"h": "Fiscal, tributário e inflação: o desenho do ajuste ainda tem números diferentes", "p": "O governo começou a sinalizar o tamanho do ajuste fiscal, mas os números variam por veículo <span class=\"flag\">Divergência</span>: economia de R$ 70 bilhões em 2027 com foco em corte de incentivos (Valor), ajuste de 0,5% do PIB (Metrópoles), projeto de R$ 50 bilhões para bloquear gastos, cortar isenções e mudar pisos (Estadão), cancelamento extra de R$ 12,8 bilhões de despesas para cumprir a meta (Folha) superávit de 1,75% do PIB em 2030 por um PLP de Jaques Wagner (CNN) e, na atualização da madrugada, ajuste de até R$ 80 bi ensaiado pela base (Valor), com um gatilho que reduz o crescimento real da despesa de 2,5% para 2% (O Globo). Leitura: os números podem medir coisas distintas (efeito total, corte de gasto, meta de longo prazo). Alcolumbre disse ter compromisso de analisar o projeto e prevê as primeiras medidas na próxima semana (Valor, CNN). Na reforma tributária, deputados descartaram adiar a implementação após reunião com Durigan, que diz que o imposto seletivo não encarecerá a cerveja (Valor, Metrópoles); bancos dizem que a tarifa de R$ 0,39 por operação do split payment não cobre o custo (Valor, Poder360). A Câmara aprovou a MP que libera até R$ 13,5 bi a empresas afetadas pelo tarifaço e a MP das dívidas rurais; o Senado deve votar hoje (O Globo, CNN, Folha). A cesta básica subiu nas 27 capitais pelo 2º mês (Poder360). O IPCA de outubro sai amanhã (anterior: 0,82%)."}, {"h": "Internacional: CPI quente e o Fed a caminho de subir juros em dezembro", "p": "O CPI de outubro dos EUA subiu 0,4% no mês (consenso de 0,3%), com núcleo de 0,3% (consenso de 0,2%) (Investing, Valor, Poder360). O mercado ampliou as apostas de alta do Fed em dezembro e passou a considerar um ajuste maior (Valor, FT); o Treasury de 2 anos subiu ≈20 bps e o de 10 anos ≈12 bps (Investing). Bowman disse que “ainda há trabalho a ser feito” e Lorie Logan defendeu ao menos mais duas altas (Valor); o WSJ avalia que o Fed terá de enfrentar o caso de altas maiores e mais rápidas. Fora dos EUA, o economista-chefe do BCE, Philip Lane, considerou prudente subir juros em dezembro, e a vice do BoE, Clare Lombardelli, disse que os juros provavelmente subirão mais (Valor). Na política americana, os republicanos barraram na Câmara o pedido de impeachment de Pete Hegseth apresentado por Thomas Massie (NYT, WSJ, FT, Reuters), e Jim Jordan, próximo de Eduardo e Flávio Bolsonaro, será o líder da minoria (Valor, Folha). A Suprema Corte autorizou o muro de Trump no Texas (Folha) e a Justiça manteve o processo de US$ 10 bi de Trump contra a BBC (Bloomberg, Estadão)."}, {"h": "Geopolítica e empresas: Irã sem negociação, Paraguai em crise e Nvidia sob escrutínio", "p": "O principal responsável pela segurança do Irã disse que não há negociação em curso com os EUA, enquanto Rubio prometeu ao G7 manter a pressão econômica “devastadora” (Valor); o Irã declarou a Marinha e a Força Aérea da Argentina “organizações terroristas” (Reuters), e Bessent foi levado a uma base militar após ameaças iranianas (NYT). Na madrugada, Rússia e Ucrânia retomaram em Abu Dhabi as primeiras negociações diretas em nove meses, mediadas pelos EUA (Bloomberg, Reuters). Um militar americano foi preso no Reino Unido por suspeita de espionagem para a Rússia, e Moscou prendeu dois supostos espiões poloneses (FT, Reuters, Bloomberg). No Paraguai, o BC diz ter reembolsado 93% a 95% dos clientes do Ueno Bank <span class=\"flag\">Divergência</span> (O Globo e Poder360 × Valor e Bloomberg), e o cofre secreto na casa de Santiago Peña estava vazio (Valor, Folha). No corporativo, a Petrobras lucrou R$ 39,8 bi no 3º tri (+21,5% a/a) e elevou a projeção de produção (Folha, Valor), mas ficou abaixo das estimativas (Bloomberg); a JBS teve Ebitda 35,6% menor (CNN). A Nvidia chegou a perder quase US$ 400 bi em valor em dois dias (O Globo), com a apuração de que a relação de Jensen Huang com Alice Huang facilitou US$ 7,5 bi em chips à China (Reuters, Valor); o conselho contratou a Wachtell (FT, Bloomberg). A Anthropic busca até US$ 64,4 bi no IPO, com avaliação de US$ 1,3 a 1,5 tri <span class=\"flag\">Divergência</span> (Bloomberg, WSJ, FT, Valor)."}, {"h": "Fechamento dos mercados (10/11; Ásia em 11/11)", "p": "Bolsas: Ibovespa −0,52% (171.337); S&P 500 −0,38% (7.520,93); Nasdaq −0,74% (25.065,87); Dow −0,30% (52.231,89); Stoxx 600 +0,27% (658,32); DAX +0,31% (26.347,45); FTSE 100 −0,29% (10.751,59). Ásia em 11/11: Nikkei +1,67% (61.316), Xangai +0,46% (3.680,64); Hang Seng −0,98% (24.315,92). Juros de 10 anos: Brasil 15,23% (+7 bps); EUA 4,98% (+12 bps) e 2 anos 4,75% (+20 bps); Alemanha 3,31% (+4 bps); Reino Unido 5,23% (+10 bps); Japão 2,79% (+12 bps, em 11/11); China 1,59% (+1 bp, em 11/11). Moedas: USD/BRL 5,5833 (+1,36%; PTAX 5,5840); DXY 102,23 (+0,57%); EUR/USD 1,1164 (−0,53%); USD/JPY 158,76 (+0,54%); USD/CNY 6,6704 (−0,04%). Commodities: Brent US$ 91,49 (−1,17%); WTI US$ 86,21 (−0,74%); ouro US$ 4.046 (−1,66%); cobre US$ 6,27/lb (−1,12%); soja 1.226,50 c/bu (+3,22%); minério de ferro US$ 92,54 (−0,18%). Fonte: histórico do Investing; linhas intradiárias de 11/11 de Europa, Américas e commodities ficaram de fora (às ≈06h05, Stoxx 600 +0,57% e Brent US$ 92,08, ambos em pregão)."}], "top10": [{"t": "CPI dos EUA vem acima do esperado e reforça alta do Fed em dezembro", "d": "A inflação ao consumidor subiu 0,4% em outubro (consenso de 0,3%), com núcleo de 0,3% (consenso de 0,2%). Bowman e Logan reforçaram o tom duro, e os Treasuries de 2 e 10 anos subiram ≈20 e ≈12 bps.", "w": "Um Fed mais agressivo encarece o dólar e o crédito global e tira espaço de bancos centrais emergentes, inclusive o BC brasileiro.", "s": [["v", "v:/mundo/noticia/2026/11/10/indice-de-precos-dos-eua-sobe-04percent-em-outubro-acima-do-previsto.ghtml"], ["ft", "ft:8b564134-dea6-4272-8ede-e0b12ef5aebd"], ["WSJ", "https://www.wsj.com/economy/central-banking/fed-forced-to-confront-case-for-bigger-and-faster-rate-rises-ac181706"], ["p", "p:/poder-economia/inflacao-nos-eua-sobe-04-em-outubro-e-supera-expectativas/"]]}, {"t": "Dólar vai a R$ 5,58, maior nível desde julho de 2025, e ata do Copom pesa nos juros longos", "d": "O dólar subiu 1,36% e o Ibovespa caiu 0,52%. A ata citou a 6x1, o câmbio, o petróleo e o El Niño entre os fatores que pioraram as expectativas; juros curtos caíram e longos subiram.", "w": "O mercado lê o BC como menos duro do que o cenário exige justamente quando o Fed aperta, o que pressiona câmbio e inflação esperada.", "s": [["v", "v:/financas/noticia/2026/11/10/dolar-a-vista-vai-ao-maior-patamar-desde-julho-de-2025-com-misto-de-risco-local-e-externo.ghtml"], ["v", "v:/financas/noticia/2026/11/10/bc-cita-fim-da-escala-6x1-e-depreciao-do-cmbio-entre-fatores-que-pioraram-expectativas-de-inflao.ghtml"], ["og", "og:/economia/financas/noticia/2026/11/10/dolar-hoje-maior-valor-2026-rs-5-58.ghtml"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-10/brazil-central-bank-sees-economy-slowing-as-inflation-rises"]]}, {"t": "Governo prepara ajuste fiscal; Alcolumbre prevê primeiras medidas na próxima semana", "d": "A proposta deve vir por projeto de lei de senadores da base, com corte de incentivos e bloqueio de gastos. Os valores divulgados vão de R$ 12,8 bi a R$ 70 bi em 2027 (até R$ 80 bi na versão da madrugada, no Valor), além de meta de superávit de 1,75% em 2030. <span class=\"flag\">Divergência</span> O Globo relata um gatilho que reduz o crescimento real da despesa de 2,5% para 2% ao ano.", "w": "É a primeira sinalização concreta de ajuste do Lula 4; o tamanho e a composição (gasto × receita) devem definir a reação de câmbio e juros.", "s": [["v", "v:/politica/noticia/2026/11/10/governo-sinaliza-ao-congresso-economia-de-r-70-bi-em-2027-e-foco-em-corte-de-incentivos.ghtml"], ["e", "e:/economia/governo-prepara-projeto-para-bloquear-gasto-cortar-isencoes-e-mudar-piso-em-ajuste-de-r-50-bi/"], ["f", "f:/mercado/2026/11/governo-sinaliza-ao-mercado-cancelamento-extra-de-r-128-bi-em-gastos-em-2027-para-cumprir-meta.shtml"], ["c", "c:/blogs/daniel-rittner/economia/money/macroeconomia/governo-quer-175-de-superavit-em-2030-e-menos-excecoes-ao-arcabouco/"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-11/lula-team-readies-brazil-fiscal-plan-in-bid-to-calm-market-jitters"], ["v", "v:/brasil/noticia/2026/11/11/base-governista-ensaia-ajuste-fiscal-de-ate-r-80-bi.ghtml"]]}, {"t": "Afastamento de delegados do caso Master aprofunda crise na PF", "d": "A ADPF acusou Andrei Rodrigues de interferência, ele se desfiliou da entidade e a Transparência Internacional criticou a medida. O ministro da Justiça pediu informações à PF, e aliados de Lula já cogitam trocar o diretor-geral.", "w": "A crise atinge a credibilidade da investigação que envolve ministros do STF e pode antecipar uma mudança no comando da PF no novo mandato.", "s": [["f", "f:/poder/2026/11/afastamento-de-delegados-aprofunda-racha-e-pf-enfrenta-rompimento-e-criticas.shtml"], ["v", "v:/politica/noticia/2026/11/10/associacao-critica-afastamento-de-delegados-e-fala-em-interferencia-de-andrei-rodrigues-na-pf.ghtml"], ["og", "og:/politica/noticia/2026/11/11/insatisfacao-com-gestao-da-pf-pode-forcar-troca-de-andrei-no-quarto-mandato-avaliam-aliados-de-lula.ghtml"], ["c", "c:/blogs/elijonasmaia/politica/ministro-da-justica-pede-informacoes-a-pf-sobre-mudanca-de-equipe-no-master/"]]}, {"t": "Petrobras lucra R$ 39,8 bi no 3º tri e eleva projeção de produção", "d": "O lucro cresceu 21,5% sobre um ano antes, com petróleo mais caro e recordes de produção e exportação; a estatal anunciou R$ 15,3 bi em proventos. Na comparação com o 2º tri, o lucro caiu quase R$ 13 bi (Estadão).", "w": "Reforça o caixa da União via dividendos num momento de aperto fiscal; o plano 2027–2031 pode chegar a US$ 120 bi (Estadão).", "s": [["fc", "fc:/negocios/2026/11/lucro-da-petrobras-cresce-215-no-terceiro-trimestre-para-r-397-bilhoes.shtml"], ["v", "v:/empresas/noticia/2026/11/10/petrobras-eleva-projees-de-produo-para-2026.ghtml"], ["e", "e:/einvestidor/cenarios-e-mercado/petrobras-bate-recordes-de-producao-mas-ve-lucro-despencar-quase-r-13-bilhoes-em-tres-meses/"], ["e", "e:/einvestidor/cenarios-e-mercado/petrobras-anuncia-pagamento-de-r-153-bilhoes-em-proventos-veja-valor-por-acao/"]]}, {"t": "Rússia e Ucrânia retomam negociações de paz mediadas pelos EUA em Abu Dhabi", "d": "É a primeira rodada direta em nove meses; o segundo dia de conversas começou nesta quarta, depois de Zelensky chamar o primeiro de “construtivo e bastante substantivo”. Na véspera, a Câmara dos EUA barrou o impeachment de Hegseth.", "w": "Um avanço na Ucrânia mexe com energia, defesa e prêmio de risco europeu; o tema concorre com o Irã pela atenção de Washington.", "s": [["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-11/russia-and-ukraine-resume-push-for-peace-deal-in-us-led-talks"], ["r", "r:/world/europe/russia-ukraine-meet-us-backed-talks-after-trump-says-broad-deal-possible-2026-11-10/"], ["NYT", "https://www.nytimes.com/2026/11/10/us/politics/house-hegseth-impeachment-vote.html"]]}, {"t": "Escândalo da Nvidia: chips de US$ 7,5 bi para a China e pressão no Congresso", "d": "Reportagem diz que a relação de Jensen Huang com Alice Huang facilitou o envio de US$ 7,5 bi em chips à China; uma universidade ligada ao Exército chinês comprou H200 apesar da lista negra. A empresa contratou a Wachtell, e Schumer cobrou Trump.", "w": "Pode levar a novas restrições de exportação de chips e pesa sobre a empresa mais valiosa do ciclo de IA; O Globo fala em perda de quase US$ 400 bi em dois dias.", "s": [["r", "r:/world/china/nvidia-ceos-affair-aided-75-billion-chip-shipments-china-information-reports-2026-11-10/"], ["r", "r:/world/pla-linked-chinese-university-bought-nvidia-h200-chips-despite-us-blacklist-2026-11-11/"], ["WSJ", "https://www.wsj.com/politics/policy/jensen-huang-affair-revives-push-for-chip-restrictions-on-capitol-hill-b0500089"], ["og", "og:/economia/noticia/2026/11/10/acoes-da-nvida-ampliam-queda-e-empresa-ja-perde-quase-us-400-bi-em-valor-de-mercado-em-dois-dias.ghtml"]]}, {"t": "Anthropic prepara IPO de até US$ 64,4 bi, perto do recorde", "d": "A dona do Claude mira avaliação de US$ 1,3 tri (WSJ) a US$ 1,4 tri (Valor, FT), e bancos já falam em elevar para US$ 1,5 tri ou mais (FT). Um rascunho de quase US$ 70 bi circulou entre bancos e foi retirado (Valor). <span class=\"flag\">Divergência</span>", "w": "Seria uma das maiores ofertas da história e um teste do apetite por IA após o choque da Nvidia.", "s": [["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-10/anthropic-targets-64-4-billion-ipo-nearing-spacex-s-record"], ["WSJ", "https://www.wsj.com/finance/stocks/anthropic-ipo-valuation-8337b669"], ["ft", "ft:68bcba57-0575-44ee-80f4-2e5ea23a431e"], ["v", "v:/financas/noticia/2026/11/10/anthropic-busca-captar-ate-us-644-bilhoes-e-avaliacao-de-us-1-trilhao-em-mega-ipo.ghtml"]]}, {"t": "Câmara aprova até R$ 13,5 bi para empresas do tarifaço e MP das dívidas rurais", "d": "A MP Brasil Soberano 3 amplia o crédito a empresas afetadas pelas tarifas dos EUA e pela crise no Oriente Médio; a MP de renegociação rural foi aprovada a um dia de caducar. O Senado deve votar hoje.", "w": "São gastos e renúncias aprovados no mesmo dia em que o governo fala em ajuste, o que alimenta a dúvida do mercado sobre o fiscal.", "s": [["og", "og:/economia/noticia/2026/11/10/camara-aprova-medida-que-socorre-empresas-afetadas-pelo-crise-no-oriente-medio-e-tarifaco-de-trump.ghtml"], ["c", "c:/politica/senado-deve-analisar-hoje-credito-a-empresas-afetadas-por-tarifaco-de-trump/"], ["p", "p:/poder-congresso/camara-aprova-mp-da-renegociacao-de-dividas-rurais/"]]}, {"t": "Mendonça assume caso de vazamento de dados de ministros e deve prorrogar apuração sobre Lulinha", "d": "Desdobramento do inquérito das fake news, a investigação sobre o vazamento de dados de ministros do STF saiu de Moraes e foi para Mendonça. Ele também deve atender a pedido da PF para prorrogar a apuração sobre o filho de Lula.", "w": "Desloca para Mendonça casos sensíveis que estavam com Moraes e mantém o caso Lulinha vivo no início do Lula 4.", "s": [["p", "p:/poder-justica/mendonca-assume-caso-que-investiga-vazamento-de-dados-de-ministros/"], ["og", "og:/politica/noticia/2026/11/11/mendonca-deve-prorrogar-investigacoes-sobre-lulinha-apos-pedido-da-pf.ghtml"], ["f", "f:/poder/2026/11/caso-ligado-ao-inquerito-das-fake-news-sobre-vazamento-de-dados-de-ministros-e-distribuido-a-mendonca.shtml"]]}], "secoes": [{"id": "brasil", "nome": "Brasil", "cls": "sec-br", "resumo": "O noticiário brasileiro combinou três frentes de pressão: a crise na PF em torno do caso Master, a disparada do dólar após a ata do Copom e o CPI americano, e a primeira sinalização do ajuste fiscal do Lula 4, ainda com números divergentes (de R$ 50 bi a até R$ 80 bi, conforme o veículo). No Congresso, a Câmara aprovou MPs de socorro a empresas e produtores, e a sucessão de Alcolumbre e Motta já organiza a oposição. Hoje saem a PMS e, amanhã, o IPCA de outubro.", "temas": [{"n": "Destaques", "r": "Cinco fatos organizam o dia: o dólar no maior nível desde julho de 2025; a ata do Copom; a sinalização do ajuste fiscal; a crise na PF; e o lucro da Petrobras.", "i": [["≈18h (10/11)", "v", "Dólar à vista vai ao maior patamar desde julho de 2025 com misto de risco local e externo", "Inflação americana acima do esperado e declarações duras do Fed somaram-se ao risco local; PTAX de R$ 5,5840 (BCB).", "v:/financas/noticia/2026/11/10/dolar-a-vista-vai-ao-maior-patamar-desde-julho-de-2025-com-misto-de-risco-local-e-externo.ghtml"], ["≈11h (10/11)", "v", "BC cita fim da escala 6x1 e depreciação do câmbio entre fatores que pioraram expectativas de inflação", "Ata do Copom também menciona alta do petróleo e efeitos do El Niño.", "v:/financas/noticia/2026/11/10/bc-cita-fim-da-escala-6x1-e-depreciao-do-cmbio-entre-fatores-que-pioraram-expectativas-de-inflao.ghtml"], ["≈19h (10/11)", "v", "Governo sinaliza ao Congresso economia de R$ 70 bi em 2027 e foco em corte de incentivos", "Primeira parte das medidas deve entrar num projeto de lei de senadores governistas.", "v:/politica/noticia/2026/11/10/governo-sinaliza-ao-congresso-economia-de-r-70-bi-em-2027-e-foco-em-corte-de-incentivos.ghtml"], ["23h00 (10/11)", "f", "Afastamento de delegados aprofunda racha, e PF enfrenta rompimento e críticas", "Diretor-geral deixa associação nacional, que prega respeito à autonomia das investigações.", "f:/poder/2026/11/afastamento-de-delegados-aprofunda-racha-e-pf-enfrenta-rompimento-e-criticas.shtml"], ["20h32 (10/11)", "fc", "Lucro da Petrobras cresce 21,5% no terceiro trimestre, para R$ 39,8 bilhões", "Resultado reflete petróleo mais caro e recordes de produção e exportação.", "fc:/negocios/2026/11/lucro-da-petrobras-cresce-215-no-terceiro-trimestre-para-r-397-bilhoes.shtml"]]}, {"n": "Política e Congresso", "r": "Com Lula na COP31, o Congresso fechou a semana de MPs: a Câmara aprovou o socorro de até R$ 13,5 bi a empresas do tarifaço e a renegociação de dívidas rurais, e o Senado aprovou mais poder de fiscalização à ANP. A reforma eleitoral travou por falta de acordo entre PT e PL. Na disputa pelo Senado, Efraim Filho coordena a campanha de Marinho, mas uma ala do PL prefere Tereza Cristina; Marinho diz que não travará a agenda do governo e que a oposição “não vai se omitir” sobre impeachment de ministros do STF. Lula quer ministros de volta ao Senado para conter o PL, e PT e Centrão disputam pastas do Lula 4. Alcolumbre deve promulgar a PEC da Segurança após a volta de Lula. Leitura: Tarcísio evitou o atrito com o bolsonarismo e disse que Flávio tem direito de concorrer em 2030. Atualização das ≈06h: o PL decide hoje se compõe com Motta na eleição da Câmara (Veja); o futuro Ministério da Segurança deve absorver a PF, mas não o Coaf nem a Abin (Valor); e Alcolumbre prorrogou por 60 dias a MP que proíbe as bets (Metrópoles). O Poder360 aponta um “jabuti” na MP das dívidas rurais que libera a venda de vapes. Bastidores sobre a montagem do Lula 4 e os cotados para a Fazenda circulam nas colunas de O Globo.", "i": [["06h01 (11/11)", "vj", "A reunião decisiva do PL sobre composição com Motta em eleição do comando da Câmara", "Bancada do PL decide se compõe com Hugo Motta na disputa pelo comando da Câmara.", "vj:/politica/a-reuniao-decisiva-do-pl-sobre-composicao-com-motta-em-eleicao-do-comando-da-camara/"], ["≈05h55 (11/11)", "og", "O novo ministério de Lula e os favoritos para a Fazenda", "Bastidor (Lauro Jardim) sobre a montagem do ministério do Lula 4 e os cotados para a Fazenda.", "og:/blogs/lauro-jardim/post/2026/11/o-novo-ministerio-de-lula-e-os-favoritos-para-a-fazenda.ghtml"], ["05h44 (11/11)", "p", "MP de dívidas rurais tem “jabuti” que libera venda de vapes", "Trecho incluído na MP contraria resolução da Anvisa que proíbe venda, fabricação e importação de cigarros eletrônicos.", "p:/poder-congresso/mp-de-dividas-rurais-tem-jabuti-que-libera-venda-de-vapes/"], ["05h38 (11/11)", "m", "Alcolumbre prorroga por 60 dias a MP que proíbe as bets", "Texto passa a valer até março; precisa ser aprovado pelo Congresso para virar definitivo.", "m:/brasil/alcolumbre-prorroga-por-60-dias-a-mp-que-proibe-as-bets"], ["≈05h30 (11/11)", "v", "Coaf e Abin não deverão ficar vinculados ao Ministério da Segurança Pública", "Futura pasta deve incorporar a Polícia Federal e duas das oito secretarias da Justiça.", "v:/politica/noticia/2026/11/11/coaf-e-abin-nao-deverao-ficar-vinculados-ao-ministerio-da-seguranca-publica.ghtml"], ["≈05h00 (11/11)", "og", "As missões que Lula deu a aliados para ajudá-lo a montar o próximo governo", "Bastidor (Malu Gaspar) sobre as tarefas distribuídas a aliados na transição para o Lula 4.", "og:/blogs/malu-gaspar/post/2026/11/as-missoes-que-lula-deu-a-aliados-para-ajuda-lo-a-montar-o-proximo-governo.ghtml"], ["04h15 (11/11)", "c", "Tarcísio é pressionado a intervir em disputa que racha PL na Alesp", "Movimentação de André do Prado para emplacar sucessor incomoda parlamentares do partido.", "c:/politica/tarcisio-e-pressionado-a-intervir-em-disputa-que-racha-pl-na-alesp/"], ["≈20h (10/11)", "og", "Câmara aprova medida que amplia em até R$ 13,5 bilhões socorro a empresas afetadas por tarifaço de Trump", "Texto perde validade na semana que vem e precisa ser votado pelo Senado.", "og:/economia/noticia/2026/11/10/camara-aprova-medida-que-socorre-empresas-afetadas-pelo-crise-no-oriente-medio-e-tarifaco-de-trump.ghtml"], ["04h00 (11/11)", "c", "Senado deve analisar hoje crédito a empresas afetadas por tarifaço de Trump", "Crédito especial de R$ 13,5 bilhões foi aprovado pela Câmara na terça.", "c:/politica/senado-deve-analisar-hoje-credito-a-empresas-afetadas-por-tarifaco-de-trump/"], ["18h36 (10/11)", "p", "Câmara aprova MP da renegociação de dívidas rurais", "Votação simbólica; texto amplia benefício a produtores afetados.", "p:/poder-congresso/camara-aprova-mp-da-renegociacao-de-dividas-rurais/"], ["18h18 (10/11)", "f", "Senado aprova projeto que amplia fiscalização da ANP após Carbono Oculto", "Agência terá acesso a notas fiscais eletrônicas para cruzar informações.", "f:/mercado/2026/11/senado-aprova-projeto-que-amplia-fiscalizacao-da-anp-apos-carbono-oculto.shtml"], ["≈18h (10/11)", "og", "Reforma eleitoral trava após presidentes de partidos comunicarem falta de acordo a Motta", "PT e PL não concordaram com as mudanças sugeridas.", "og:/politica/noticia/2026/11/10/reforma-eleitoral-trava-apos-presidentes-de-partidos-comunicarem-falta-de-acordo-a-motta.ghtml"], ["04h10 (11/11)", "c", "Lula quer ministros de volta ao Senado já para conter força do PL", "Wellington Dias, Renan Filho e até Rui Costa podem voltar à Casa no atual mandato.", "c:/politica/lula-quer-ministros-de-volta-ao-senado-ja-para-conter-forca-do-pl/"], ["04h05 (11/11)", "c", "Alas do PT disputam 7 ministérios de Lula 4 enquanto Centrão negocia cargos", "Partido mira pastas com projeção, recursos e capilaridade.", "c:/politica/alas-do-pt-disputam-7-ministerios-de-lula-4-enquanto-centrao-negocia-cargos/"], ["04h00 (11/11)", "f", "Tereza traça estratégia para furar bolha do bolsonarismo e tirar votos de Alcolumbre no Senado", "Senadora defende mudar o regimento interno se for eleita.", "f:/poder/2026/11/tereza-traca-estrategia-para-furar-bolha-do-bolsonarismo-e-tirar-votos-de-alcolumbre-no-senado.shtml"], ["04h30 (11/11)", "m", "PL teme dissidências na eleição do Senado, e ala defende apostar em Tereza", "Grupo avalia que um acordo antes da eleição pode garantir espaço ao partido.", "m:/brasil/pl-teme-dissidencias-na-eleicao-do-senado-e-ala-defende-apostar-em-tereza"], ["≈14h (10/11)", "v", "Efraim Filho será coordenador da campanha de Marinho à presidência do Senado", "Senador é próximo de Alcolumbre, que concorrerá à reeleição.", "v:/politica/noticia/2026/11/10/efraim-filho-sera-coordenador-da-campanha-de-marinho-a-presidencia-do-senado.ghtml"], ["22h25 (10/11)", "c", "À CNN, Marinho diz que não vai impedir agenda do governo no Senado", "Senador defendeu uma “democracia liberal”.", "c:/politica/a-cnn-marinho-diz-que-nao-vai-impedir-agenda-do-governo-no-senado/"], ["04h30 (11/11)", "m", "Sem consenso, PL reúne bancada eleita da Câmara para discutir apoio a Motta", "Partido ouvirá os eleitos antes de decidir sobre a reeleição de Motta.", "m:/brasil/sem-consenso-pl-reune-bancada-eleita-da-camara-para-discutir-apoio-a-motta"], ["≈19h (10/11)", "v", "Alcolumbre deve aguardar retorno de Lula ao Brasil para promulgar PEC da Segurança", "O Globo informa prazo de 15 dias para a promulgação.", "v:/politica/noticia/2026/11/10/alcolumbre-deve-aguardar-retorno-de-lula-ao-brasil-para-promulgar-pec-da-seguranca.ghtml"], ["04h15 (11/11)", "f", "Redução da maioridade penal, defendida por Lula, tem oposição ampla dentro do governo", "Ministérios da Justiça, Direitos Humanos e Igualdade Racial se opõem; relator promete parecer até o fim do mês (Valor).", "f:/cotidiano/2026/11/reducao-da-maioridade-penal-defendida-por-lula-tem-oposicao-ampla-dentro-do-governo.shtml"], ["≈18h (10/11)", "v", "Projeto sobre regulação concorrencial das big techs deve ser votado na próxima semana, diz relator", "Proposta está entre as prioridades do governo.", "v:/politica/noticia/2026/11/10/projeto-sobre-regulacao-concorrencial-das-big-techs-deve-ser-votado-na-proxima-semana-diz-relator.ghtml"], ["17h03 (10/11)", "p", "Lula corre para aprovar 5 propostas antes de novo Congresso", "Planalto prioriza bets, Desenrola e big techs.", "p:/poder-governo/lula-corre-para-aprovar-5-propostas-antes-de-novo-congresso/"], ["≈14h (10/11)", "v", "Tarcísio desvia de atrito e diz que Flávio Bolsonaro tem direito de concorrer em 2030", "Governador defende unidade da direita e foco em SP.", "v:/politica/noticia/2026/11/10/tarcsio-diz-que-flvio-tem-direito-de-concorrer-em-2030-e-minimiza-racha-na-direita.ghtml"], ["≈19h (10/11)", "og", "Cleitinho busca se aproximar de Lula e do PT em Minas após apoio a Flávio Bolsonaro na campanha", "Governador eleito quer discutir a dívida do estado.", "og:/politica/noticia/2026/11/10/cleitinho-busca-se-aproximar-de-lula-e-do-pt-em-minas-apos-apoio-a-flavio-bolsonaro-na-campanha.ghtml"], ["20h41 (10/11)", "f", "PSD indica deputado para comandar a Pesca e quer manter atual ministro da Agricultura", "Sidney Leite (PSD-AM) será recomendado ao novo governo.", "f:/blogs/brasilia-hoje/2026/11/psd-indica-deputado-para-comandar-a-pesca-e-quer-manter-atual-ministro-da-agricultura.shtml"]]}, {"n": "STF", "r": "Depois do fim do inquérito das fake news, o STF redistribuiu os desdobramentos: o caso do vazamento de dados de ministros foi para André Mendonça, e cada apuração derivada só seguirá com “objeto próprio e determinado”. Alcolumbre viu o fim do inquérito como redutor de tensão e acenou com reforma do Judiciário. Mendonça deve prorrogar a apuração sobre Lulinha. Na 6x1, Dino quer reduzir controvérsias, mas os relatos divergem sobre o próximo passo <span class=\"flag\">Divergência</span>: decidir nesta semana o pedido de adiamento (Valor) ou levar o tema ao plenário na próxima (Poder360). Zanin recebeu a defesa de Paes, que pede 2º turno no Rio; o governador eleito Douglas Ruas ironizou o pedido. Fora do STF, o STJ aumentou penas de sócios da boate Kiss e a Justiça mandou devolver à OAS R$ 2,4 mi do leilão do tríplex. Nas primeiras horas de quarta, o Estadão reconstituiu como Moraes concentrou o inquérito das fake news no gabinete, sob cobranças da PGR, e O Globo relata que Marinho planeja abrir impeachment de Moraes, poupando Nunes Marques, se presidir o Senado.", "i": [["05h30 (11/11)", "e", "Moraes concentrou inquérito das fake news no gabinete e enfrentou cobranças de acesso da PGR", "Reconstituição do Blog do Fausto Macedo sobre a condução do inquérito encerrado.", "e:/politica/blog-do-fausto-macedo/moraes-concentrou-inquerito-das-fake-news-no-gabinete-e-enfrentou-cobrancas-de-acesso-da-pgr/"], ["≈05h30 (11/11)", "og", "O plano de Marinho para abrir impeachment de Moraes e poupar Nunes Marques se for presidente do Senado", "Bastidor (Bela Megale) sobre a estratégia de Rogério Marinho em relação ao STF.", "og:/blogs/bela-megale/post/2026/11/o-plano-de-marinho-para-abrir-impeachment-de-moraes-e-poupar-nunes-marques-se-for-presidente-do-senado.ghtml"], ["23h14 (10/11)", "p", "Mendonça assume caso que investiga vazamento de dados de ministros", "Operação Exfil começou em dezembro de 2025.", "p:/poder-justica/mendonca-assume-caso-que-investiga-vazamento-de-dados-de-ministros/"], ["≈14h (10/11)", "v", "STF fará análise individual de apurações ligadas ao inquérito das 'fake news'", "Procedimentos só prosseguem com “objeto próprio e determinado”, por ordem de Fachin.", "v:/politica/noticia/2026/11/10/apuracoes-ligadas-ao-inquerito-das-fake-news-terao-que-ser-analisadas-individualmente.ghtml"], ["23h00 (10/11)", "f", "Alcolumbre vê como positivo fim do inquérito das fake news e acena com reforma do Judiciário", "Decisão reduz tensão entre Poderes e pode ajudá-lo na disputa pelo Senado (Painel).", "f:/colunas/painel/2026/11/alcolumbre-ve-como-positivo-fim-do-inquerito-das-fake-news-e-acena-com-reforma-do-judiciario.shtml"], ["17h56 (10/11)", "c", "Caso Master acelerou decisão de Fachin de dar fim a inquérito das fake news", "Presidente do STF tentou convencer Moraes a encerrar a investigação (blog).", "c:/blogs/luisa-martins/politica/caso-master-acelerou-decisao-de-fachin-de-dar-fim-a-inquerito-das-fake-news/"], ["≈03h (11/11)", "og", "Mendonça deve prorrogar investigações sobre Lulinha após pedido da PF", "Apuração envolve suspeitas de tráfico de influência.", "og:/politica/noticia/2026/11/11/mendonca-deve-prorrogar-investigacoes-sobre-lulinha-apos-pedido-da-pf.ghtml"], ["18h43 (10/11)", "p", "Dino diz que enviará 6 X 1 ao plenário do STF na próxima semana", "Ministro é relator das ações da CNC e da CNI.", "p:/poder-justica/dino-diz-que-enviara-6-x-1-ao-plenario-do-stf-na-proxima-semana/"], ["≈19h (10/11)", "v", "Ministro Flávio Dino pretende decidir nesta semana pedido para postergar 6x1", "Afirmação veio em audiência pública sobre as ações da CNI e da CNC.", "v:/legislacao/noticia/2026/11/10/ministro-flvio-dino-pretende-decidir-nesta-semana-pedido-para-postergar-6x1.ghtml"], ["18h02 (10/11)", "f", "Advogados de Paes se reúnem com Zanin e reforçam pedido por 2º turno no RJ", "Zanin aguarda manifestações da AGU e da PGR.", "f:/poder/2026/11/advogados-de-paes-se-reunem-com-zanin-e-reforcam-pedido-por-2o-turno-no-rj.shtml"], ["23h06 (10/11)", "c", "“Não vamos nos omitir”, diz Marinho sobre impeachment de ministros do STF", "Líder da oposição promete analisar os pedidos.", "c:/politica/nao-vamos-nos-omitir-diz-marinho-sobre-impeachment-de-ministros-do-stf/"], ["19h39 (10/11)", "vj", "Decisão do STJ aumenta penas de dois condenados pela tragédia da boate Kiss", "Elissandro Callegaro passa a 14 anos de prisão (Metrópoles).", "vj:/brasil/decisao-do-stj-aumenta-penas-de-dois-condenados-pela-tragedia-da-boate-kiss/"], ["18h23 (10/11)", "f", "Justiça manda entregar ao grupo OAS R$ 2,4 mi do leilão de tríplex atribuído a Lula pela Lava Jato", "Valor estava depositado em conta judicial na Caixa.", "f:/poder/2026/11/justica-manda-devolver-a-oas-r-24-mi-do-leilao-de-triplex-atribuido-a-lula-pela-lava-jato.shtml"]]}, {"n": "Fiscal", "r": "O ajuste do Lula 4 começou a ganhar forma, mas com números diferentes conforme a fonte <span class=\"flag\">Divergência</span>: R$ 70 bi em 2027 com corte de incentivos (Valor), 0,5% do PIB (Metrópoles), projeto de R$ 50 bi com bloqueio de gastos, corte de isenções e mudança de pisos (Estadão), R$ 12,8 bi de cancelamento extra de despesas (Folha) e superávit de 1,75% em 2030 com menos exceções ao arcabouço (CNN). Alcolumbre se comprometeu a analisar o texto e prevê as primeiras medidas na próxima semana. Na reforma tributária, a Câmara descartou adiar a implementação; a Receita discutiu o tema com as frentes parlamentares; e os bancos dizem que a tarifa de R$ 0,39 do split payment não cobre o custo de R$ 3,5 bi do sistema. Leitura analítica: Vinicius Torres Freire (Folha) vê o Lula 4 num “caminho do meio”, e executivos dizem que o fiscal é o “calcanhar de Aquiles” do país (Valor). Atualização das ≈06h: o Valor fala agora em ajuste de até R$ 80 bi ensaiado pela base, mantendo a meta de 2027 <span class=\"flag\">Divergência</span>, e O Globo (Fábio Graner) relata um gatilho que reduziria o crescimento real da despesa de 2,5% para 2% ao ano; a Bloomberg diz que as propostas chegam ao Congresso até a próxima semana. O corte de benefícios deve mirar o “andar de cima” num gasto tributário de quase R$ 1 tri (Valor), e o CNJ reservou R$ 2 bi para o reajuste vetado do Judiciário (O Globo).", "i": [["≈05h45 (11/11)", "v", "Base governista ensaia ajuste fiscal de até R$ 80 bi", "Ideia é manter a meta de primário de 2027 e sinalizar melhora até 2030.", "v:/brasil/noticia/2026/11/11/base-governista-ensaia-ajuste-fiscal-de-ate-r-80-bi.ghtml"], ["≈05h45 (11/11)", "v", "Redução de benefícios fiscais mira ‘andar de cima’ e ataca distorções", "Gasto tributário do país chega perto de R$ 1 tri neste ano; mais de 60% é federal.", "v:/brasil/noticia/2026/11/11/reducao-de-beneficios-fiscais-mira-andar-de-cima-e-ataca-distorcoes.ghtml"], ["≈05h30 (11/11)", "og", "Judiciário reserva R$ 2 bilhões para reajuste vetado por Lula e reconhece dificuldade para bancar aumento", "Parecer do CNJ admite que aumento de 8% a servidores esbarra no limite de gastos com pessoal.", "og:/economia/noticia/2026/11/11/judiciario-reserva-r-2-bilhoes-para-reajuste-vetado-por-lula-e-reconhece-dificuldade-para-bancar-aumento-nos-proximos-anos.ghtml"], ["≈05h10 (11/11)", "og", "Projeto com medidas de ajuste deve ter gatilho para reduzir teto das despesas ao longo da execução do Orçamento", "Crescimento real da despesa passaria de 2,5% para 2% acima da inflação (coluna de Fábio Graner).", "og:/economia/fabio-graner/post/2026/11/projeto-com-medidas-de-ajuste-deve-ter-gatilho-para-reduzir-teto-das-despesas-ao-longo-da-execucao-do-orcamento.ghtml"], ["23h05 (10/11)", "Bloo lendário do FGV IBRE.", "fgv:/"]]}]}, {"id": "internacional", "nome": "Internacional", "cls": "sec-int", "resumo": "O CPI americano acima do esperado dominou o dia: reforçou a aposta numa alta do Fed em dezembro, levou o Treasury de 2 anos ao maior salto em semanas e ecoou nos discursos duros de BCE e BoE. Na política americana, Trump ainda segurou a bancada para barrar o impeachment de Hegseth. Na madrugada, Rússia e Ucrânia retomaram negociações de paz mediadas pelos EUA em Abu Dhabi. No Oriente Médio, o Irã nega negociações e amplia ameaças, enquanto Israel tenta formar governo. Na América do Sul, o colapso do Ueno Bank segue abalando o Paraguai.", "temas": [{"n": "Guerra e Conflitos", "r": "O Irã disse que não há negociação em curso com os EUA e insiste em sete condições do acordo provisório de junho; Rubio prometeu ao G7 pressão econômica “devastadora”. Teerã declarou a Marinha e a Força Aérea argentinas “organizações terroristas”, e Bessent foi levado a uma base militar após ameaças iranianas. Na Europa, um militar americano foi preso no Reino Unido por suspeita de espionar para a Rússia, Moscou prendeu dois supostos espiões poloneses, e a França pressiona a Alemanha sobre o risco nuclear de mísseis de longo alcance. Ataques ucranianos já reduziram em 30% a capacidade de refino russa. Em Gaza, enchentes agravam a crise humanitária, e o Conselho da Paz de Trump pressiona Israel. Na atualização das ≈06h, o fato novo é diplomático: Rússia e Ucrânia retomaram, em Abu Dhabi, as primeiras negociações diretas em nove meses, mediadas pelos EUA, e Zelensky chamou a rodada inicial de “construtiva e bastante substantiva” (Reuters, Bloomberg). Ao mesmo tempo, drones ucranianos no espaço aéreo báltico elevam a tensão com a Otan (CNN).", "i": [["≈05h47 (11/11)", "Bloomberg", "Russia and Ukraine Resume Push for Peace Deal in US-Led Talks", "Rússia e Ucrânia retomam negociações de paz mediadas pelos EUA: segundo dia em Abu Dhabi, após Zelensky chamar a 1ª rodada de “construtiva”.", "https://www.bloomberg.com/news/articles/2026-11-11/russia-and-ukraine-resume-push-for-peace-deal-in-us-led-talks"], ["10/11", "r", "US attempts new peace push at first Russia-Ukraine talks in nine months", "EUA tentam novo impulso de paz na primeira rodada entre Rússia e Ucrânia em nove meses.", "r:/world/europe/russia-ukraine-meet-us-backed-talks-after-trump-says-broad-deal-possible-2026-11-10/"], ["05h48 (11/11)", "c", "Drones ucranianos no espaço aéreo báltico elevam tensão com a Otan", "Desvios de rota de aeronaves não identificadas alimentam receio de expansão do conflito.", "c:/internacional/drones-ucranianos-no-espaco-aereo-baltico-elevam-tensao-com-a-otan/"], ["≈14h (10/11)", "v", "Principal autoridade de segurança do Irã diz que não há negociação em andamento com os EUA", "Teerã exige o cumprimento de sete condições do acordo provisório de junho.", "v:/mundo/noticia/2026/11/10/principal-autoridade-de-segurana-do-ir-diz-que-no-h-negociao-em-andamento-com-os-eua.ghtml"], ["11/11", "r", "Iran designates Argentina's navy and air force as 'terrorist organizations'", "Irã classifica a Marinha e a Força Aérea da Argentina como “organizações terroristas”.", "r:/world/americas/iran-designates-argentinas-navy-air-force-terrorist-organizations-2026-11-11/"], ["10/11", "NYT", "Bessent Is Moved From D.C.-Area Home to Military Base After Iranian Threats", "Secretário do Tesouro é transferido para base militar após ameaças do Irã.", "https://www.nytimes.com/2026/11/10/us/politics/bessent-moved-base-iran-threats.html"], ["—", "ft", "Senior US soldier arrested in UK on suspicion of spying for Russia", "Militar graduado dos EUA é preso no Reino Unido sob suspeita de espionar para a Rússia.", "ft:94aa4846-58c6-4c17-b25a-095f122b4809"], ["11/11", "r", "Russia arrests two suspected Polish spies in Kaliningrad, Interfax reports", "Rússia prende dois supostos espiões poloneses em Kaliningrado.", "r:/world/russia-arrests-two-suspected-polish-spies-kaliningrad-interfax-repo /* ---------- render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={tab:'geral',q:'',v:'',col:false};
try{const t=localStorage.getItem('pn_theme');if(t)document.documentElement.dataset.theme=t;const tb=localStorage.getItem('pn_tab');state.col=!!localStorage.getItem('pn_col');if(tb)state.tab=tb}catch(e){}

function card(it,sec,tema){
  const [h,v,t,d,u]=it;
  const est=h.startsWith('≈')||h==='—';
  return `<article class="card" data-v="${v}" data-s="${esc((t+' '+d.replace(/<[^>]+>/g,'')).toLowerCase())}">
  <a class="ct" href="${esc(U(u))}" target="_blank" rel="noopener">${esc(t)}</a>
  ${d?`<div class="cd">${d}</div>`:''}
  <div class="cm"><span class="tag">${esc(S(v))}</span><span class="${est?'est':''}">${esc(h)}</span></div></article>`;
}
function countAll(){let n=0;DATA.secoes.forEach(s=>s.temas.forEach(t=>n+=t.i.length));return n}
function srcLinks(arr){return arr.map(([v,u])=>`<a href="${esc(U(u))}" target="_blank" rel="noopener">${esc(S(v))}</a>`).join('')}

function agendaDestaques(){
  return `<ul class="agdest">${DATA.agenda.destaques.map(([f,t])=>`<li><span class="fl">${f}</span>${esc(t)}</li>`).join('')}</ul><p class="note agnx">${esc(DATA.agenda.proxima)}</p>`;
}
function agendaGrid(){
  const D=DATA.agenda.dias;
  const cell=(p,d)=>p.ev.filter(e=>e[0].startsWith(d)).map(([dd,h,imp,n,at,co,an])=>{
    const v=at?`<b>${esc(at)}</b>${co?` <span class="vs">vs ${esc(co)}</span>`:''}`:(co||an?`<span class="vs">${co?'cons. '+esc(co):''}${co&&an?' · ':''}${an?'ant. '+esc(an):''}</span>`:'');
    return `<div class="mx${imp>=3?' hi':''}"><span class="mxt">${imp>=3?'<span class="imp"></span>':''}${h&&h!=='—'?`<span class="mxh">${esc(h)}</span> `:''}${esc(n)}</span>${v?`<span class="mxv">${v}</span>`:''}</div>`}).join('');
  return `<div class="tbl"><table class="mtx"><thead><tr><th class="pc"></th>${D.map(([d,n])=>`<th>${d} <span>${n}</span></th>`).join('')}</tr></thead><tbody>${DATA.agenda.paises.map(p=>`<tr><th class="pc" title="${esc(p.n)}"><span class="fl">${p.f}</span><span class="pn">(${esc(p.c)})</span></th>${D.map(([d])=>`<td>${cell(p,d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note aglg"><span class="imp"></span> alta importância · em negrito, o resultado divulgado (vs consenso) · horários em BRT; “≈” = estimado · fontes: Investing.com, FGV, BCB, Tesouro e imprensa</p>`;
}
function loadH2C(){return window.html2canvas?Promise.resolve():new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('Não foi possível carregar o gerador de imagem (verifique a conexão).'));document.head.appendChild(sc)})}
async function dlPNG(btn){
  const old=btn.textContent;btn.textContent='Gerando…';btn.disabled=true;
  const box=document.createElement('div');box.className='pngbox';
  const g=document.createElement('div');g.innerHTML=agendaGrid();box.appendChild(g.querySelector('table.mtx'));
  document.body.appendChild(box);
  try{await loadH2C();const bg=getComputedStyle(document.body).backgroundColor;
    const c=await html2canvas(box.firstElementChild,{scale:2,backgroundColor:getComputedStyle(document.querySelector('.panel')||document.body).backgroundColor||'#fff',useCORS:true,logging:false});
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='calendario_semana_'+DATA.agenda.semana.replace(/[^0-9a-z]+/gi,'_')+'.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert(e.message)}finally{box.remove();btn.textContent=old;btn.disabled=false}
}
function renderGeral(){
  return `<section class="panel summary sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><p class="kicker">Resumo global do noticiário · ${esc(DATA.meta.edicao)}</p><h2>O dia em perspectiva</h2><div class="gsec">${DATA.geral.map(g=>`<div class="gblk"><h3>${esc(g.h)}</h3><p>${esc(g.p)}</p></div>`).join('')}</div></section>
  <div class="grid2">
  <section class="panel"><p class="kicker">Top 10 do dia</p><ol class="top10">${DATA.top10.map(x=>`<li><div><a class="t10t" href="${esc(U(x.s[0][1]))}" target="_blank" rel="noopener">${esc(x.t)} ↗</a><div class="t10d">${esc(x.d)}</div><div class="why"><b>Por que importa:</b> ${esc(x.w)}</div><div class="src">${srcLinks(x.s)}</div></div></li>`).join('')}</ol></section>
  <section class="panel"><div class="agtop"><div><p class="kicker">Calendário da semana · ${esc(DATA.agenda.semana)}</p><h2>Destaques</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}<p class="note" style="margin-top:8px">Calendário completo por país na aba “Agenda da Semana”.</p></section>
  </div>
  <section class="panel"><p class="kicker">Log de coleta</p><ul class="log">${DATA.log.map(([s,f,t])=>`<li><span class="${s==='ok'?'okc':'wc'}">${s==='ok'?'✓':'!'}</span> <b>${esc(f)}</b> — ${esc(t)}</li>`).join('')}</ul></section>`;
}
function renderSec(s){
  const nav=s.temas.map((t,k)=>`<a href="#${s.id}-${k}">${esc(t.n)}<b>${t.i.length}</b></a>`).join('');
  const body=s.temas.map((t,k)=>`<section class="panel theme" id="${s.id}-${k}"><div class="th"><h3>${esc(t.n)}${t.pm?` <span class="note">· País do Momento — ${esc(t.pm)}</span>`:''}</h3><span class="cnt"><span class="vis">${t.i.length}</span> notícias</span></div><div class="items">${t.i.map(it=>card(it)).join('')}</div><p class="empty hidden">Nenhuma notícia corresponde ao filtro.</p></section>`).join('');
  return `<div class="${s.cls}"><section class="panel sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><div class="sechead"><p class="kicker">Resumo da sessão por classificação</p><h2>${esc(s.nome)}</h2></div><p class="intro">${esc(s.resumo)}</p><div class="tsums">${s.temas.map((t,k)=>`<p><a href="#${s.id}-${k}"><b>${esc(t.n)}${t.pm?' ('+esc(t.pm)+')':''}.</b></a> ${esc(t.r)}</p>`).join('')}</div></section><div class="themes-nav">${nav}</div>${body}</div>`;
}
function renderAgenda(){return `<section class="panel"><div class="agtop"><div><p class="kicker">Agenda da Semana</p><h2>${esc(DATA.agenda.semana)}</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}</section><section class="panel">${agendaGrid()}</section>`}

function tabs(){
  const t=[['geral','Visão Geral',''],...DATA.secoes.map(s=>[s.id,s.nome,s.temas.reduce((a,b)=>a+b.i.length,0)]),['agenda','Agenda da Semana','']];
  $('#tabs').innerHTML=t.map(([id,n,c])=>`<button data-t="${id}" class="${state.tab===id?'on':''}">${esc(n)}${c!==''?`<span class="n">${c}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;try{localStorage.setItem('pn_tab',state.tab)}catch(e){}render();window.scrollTo(0,0)});
}
function render(){
  tabs();
  const app=$('#app');
  if(state.tab==='geral')app.innerHTML=renderGeral();
  else if(state.tab==='agenda')app.innerHTML=renderAgenda();
  else app.innerHTML=renderSec(DATA.secoes.find(s=>s.id===state.tab));
  filter();
  applyCollapse();
  document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{state.col=!state.col;try{localStorage.setItem('pn_col',state.col?'1':'')}catch(e){}applyCollapse()});
}
function applyCollapse(){document.querySelectorAll('.sumbox').forEach(p=>p.classList.toggle('collapsed',!!state.col));document.querySelectorAll('.tog').forEach(b=>b.textContent=state.col?'＋ Expandir resumo':'－ Minimizar resumo')}
function filter(){
  const q=state.q.trim().toLowerCase(),v=state.v;
  if((q||v)&&(state.tab==='geral'||state.tab==='agenda')){
    // global search: show results across sections
    const res=[];DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>{const txt=(it[2]+' '+it[3].replace(/<[^>]+>/g,'')).toLowerCase();if((!q||txt.includes(q))&&(!v||S(it[1])===v))res.push([s.nome+' · '+t.n,it])})));
    $('#app').innerHTML=`<section class="panel"><p class="kicker">Resultados da busca</p><h2>${res.length} notícia(s)</h2><div class="items">${res.map(([w,it])=>card(it).replace('<div class="cm">',`<div class="cm"><span class="note">${esc(w)}</span>`)).join('')||'<p class="empty">Nada encontrado.</p>'}</div></section>`;
    return;
  }
  document.querySelectorAll('.theme').forEach(th=>{let n=0;th.querySelectorAll('.card').forEach(c=>{const ok=(!q||c.dataset.s.includes(q))&&(!v||S(c.dataset.v)===v);c.classList.toggle('hidden',!ok);if(ok)n++});const vis=th.querySelector('.vis');if(vis)vis.textContent=n;th.querySelector('.empty').classList.toggle('hidden',n>0)});
}
function init(){
  $('#meta').textContent=`${DATA.meta.edicao} · Janela: ${DATA.meta.janela} · ${countAll()} notícias classificadas`;
  const vs=new Set();DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>vs.add(S(it[1])))));
  $('#fv').innerHTML+= [...vs].sort().map(v=>`<option>${esc(v)}</option>`).join('');
  $('#q').oninput=e=>{state.q=e.target.value;if(state.tab==='geral'||state.tab==='agenda'){if(!state.q&&!state.v)render();else filter()}else filter()};
  $('#fv').onchange=e=>{state.v=e.target.value;if((state.tab==='geral'||state.tab==='agenda')&&!state.q&&!state.v)render();else filter()};
  $('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pn_theme',n)}catch(e){}};
  render();
}
init();
