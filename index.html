<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Notícias | Henrique Behrens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#0147ab;--p2:#D2E8FF;--p3:#E2E6ED;--p4:#FAB58F;--p5:#DF570B;
  --bg:#f6f8fb;--panel:#ffffff;--ink:#0d1530;--ink2:#3f4a63;--ink3:#6b7489;--line:var(--p3);
  --brand:var(--p1);--brand2:var(--p1);--accent:var(--p5);--chip:var(--p3);--chipink:#1b2440;--soft:var(--p2);
  --br:var(--p1);--intl:var(--p5);--emp:var(--p4);--warn:#a33f06;--warnbg:#fde3d3;--ok:var(--p1);--okbg:var(--p2);
  --shadow:0 1px 2px rgba(1,71,171,.05),0 1px 3px rgba(1,71,171,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand2);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--brand);color:#fff;padding:18px 16px 0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;margin:0;letter-spacing:.2px}
h1 span{color:var(--p2);font-weight:500}
.meta{font-size:12.5px;color:var(--p2);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;width:220px;font:inherit;font-size:13.5px}
.tools input::placeholder{color:#c4d2e4}
.tools select,.tools button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.tools select option{color:#111}
nav.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:transparent;border:0;color:var(--p2);padding:10px 14px;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs .n{font-size:11px;background:#ffffff1f;border-radius:10px;padding:1px 7px;margin-left:6px}
main{padding:20px 0 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.kicker{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
h2{font:600 19px/1.3 "IBM Plex Serif",Georgia,serif;margin:0 0 10px}
h3{font:600 16px/1.3 "IBM Plex Sans",sans-serif;margin:0}
.summary p{margin:0 0 10px;color:var(--ink)}
.summary p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
ol.top10{list-style:none;padding:0;margin:0;counter-reset:t}
ol.top10 li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
ol.top10 li:first-child{border-top:0;padding-top:4px}
ol.top10 li::before{content:counter(t);font:600 20px/1 "IBM Plex Serif",serif;color:var(--accent);padding-top:2px}
.t10t{font-weight:600;margin-bottom:3px}
.t10d{color:var(--ink2);font-size:14px}
.why{font-size:13px;color:var(--ink);background:var(--soft);border-radius:6px;padding:5px 8px;margin-top:6px}
.why b{color:var(--ink2);font-weight:600}
.src{font-size:12.5px;color:var(--ink3);margin-top:5px}
.src a{margin-right:8px}
.sechead{border-left:4px solid var(--br);padding-left:12px}
.sec-intl .sechead{border-color:var(--intl)}.sec-emp .sechead{border-color:var(--emp)}
.themes-nav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.themes-nav a{font-size:12.5px;background:var(--soft);color:var(--chipink);padding:4px 10px;border-radius:999px}
.themes-nav a b{font-weight:600;margin-left:4px;color:var(--ink3)}
.theme{scroll-margin-top:12px}
.theme .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.theme .cnt{font-size:12px;color:var(--ink3)}
.tsum{font-size:14px;color:var(--ink2);margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.items{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.card .ct{font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
.card .ct:hover{color:var(--brand2)}
.card .cd{font-size:13.5px;color:var(--ink2)}
.card .cm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3);margin-top:auto;padding-top:4px}
.tag{background:var(--chip);color:var(--chipink);border-radius:4px;padding:1px 6px;font-weight:500}
.est{color:var(--warn)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:1px 6px}
.empty{color:var(--ink3);font-size:13.5px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600}
td.d{white-space:nowrap;font-weight:600}
.st{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.st.c{color:var(--ok);background:var(--okbg)}.st.e{color:var(--warn);background:var(--warnbg)}.st.r{color:var(--ink2);background:var(--chip)}
.tbl{overflow-x:auto}
.daysep td{background:var(--chip);font-weight:600;color:var(--ink2);font-size:12.5px}
.log li{margin-bottom:4px;font-size:13.5px}
.okc{color:var(--ok);font-weight:600}.wc{color:var(--warn);font-weight:600}
.hidden{display:none!important}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:10px 16px 30px}
.note{font-size:12.5px;color:var(--ink3)}
mark{background:#ffe58f;color:#111;border-radius:2px}
.gsec{display:grid;gap:14px}
.gblk h3{font:600 14px/1.3 "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2);margin:0 0 4px}
.gblk p{margin:0}
a.t10t{display:block;font-weight:600;margin-bottom:3px;color:var(--ink)}
a.t10t:hover{color:var(--brand2)}
.intro{margin:0 0 12px;font-weight:500}
.tsums p{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--p4);color:var(--ink)}
.tsums p:last-child{margin-bottom:0}
.tsums a{color:var(--ink)}.tsums a b{color:var(--brand2)}
.ag{display:grid;gap:10px}
.agwrap .ag{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.agh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--brand2);border-bottom:2px solid var(--p5);padding-bottom:3px;margin-bottom:4px}
.agr{display:grid;grid-template-columns:48px 44px 1fr 10px;gap:8px;align-items:baseline;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.agr:last-child{border-bottom:0}
.agt{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12.5px}
.agg{font-size:11px;font-weight:600;color:var(--chipink);background:var(--chip);border-radius:4px;padding:0 5px;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;align-self:center}
.dot.r{background:var(--p3);border:1px solid var(--ink3)}.dot.c{background:var(--p1)}.dot.e{background:var(--p5)}
:root[data-theme="dark"] .dot.c{background:var(--p2)}
.aglg{margin-top:10px}.aglg .dot{margin:0 3px 0 8px}.aglg .dot:first-child{margin-left:0}
.sumbox{position:relative}
.tog{position:absolute;top:14px;right:16px;background:var(--soft);color:var(--brand2);border:1px solid var(--line);border-radius:6px;font:500 12px "IBM Plex Sans",sans-serif;padding:3px 9px;cursor:pointer}
.sumbox.collapsed .gsec,.sumbox.collapsed .intro,.sumbox.collapsed .tsums{display:none}
.sumbox.collapsed h2{margin-bottom:0}
.sumbox .kicker{padding-right:150px}
.agdest{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.agdest li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.fl{font-size:18px;line-height:1.2}
.agnx{margin:10px 0 0}
.agc{margin-bottom:16px}
.agcn{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.agcn .fl{font-size:22px}
table.cal{table-layout:fixed;min-width:760px;border:1px solid var(--p1)}
table.cal th{background:var(--p1);color:#fff;text-align:center;font-size:12px;text-transform:none;letter-spacing:0;padding:4px;border-right:1px solid #ffffff40}
table.cal th span{display:block;font-weight:400;font-size:11px;color:var(--p2)}
table.cal td{border-right:1px solid var(--line);padding:4px 6px;height:58px;vertical-align:top}
.ce{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3;padding:2px 4px;border-radius:3px}
.ce .cn em{display:block;font-style:italic;color:var(--ink3);font-size:11px}
.ce .ch{white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.ce.hl{background:var(--p4);font-weight:600;color:#3a1400}
.ce.hl .ch,.ce.hl em{color:#5a2200}
.hlk{display:inline-block;width:12px;height:10px;background:var(--p4);border-radius:2px;margin-right:4px;vertical-align:middle}
.agtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dl{background:var(--p1);color:#fff;border:0;border-radius:6px;font:500 12.5px "IBM Plex Sans",sans-serif;padding:6px 12px;cursor:pointer}
.dl:hover{filter:brightness(1.1)}
.agx{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:18px 22px}
@media (max-width:600px){.agx{grid-template-columns:1fr}}
.agc{margin:0}
table.cal{table-layout:auto;min-width:0;border:0;width:100%;font-size:12.5px}
table.cal th{background:none;color:var(--ink3);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px;border:0;border-bottom:1.5px solid var(--p1)}
table.cal th.n,table.cal td.n{text-align:right;white-space:nowrap}
table.cal td{border:0;border-bottom:1px solid var(--line);padding:4px 6px;height:auto;vertical-align:baseline}
table.cal td.cd{white-space:nowrap;color:var(--ink2);font-weight:500}
table.cal td.ct2{white-space:nowrap;color:var(--ink3);font-variant-numeric:tabular-nums}
table.cal td.at{font-weight:600;color:var(--ink)}
table.cal tr.hi td{background:rgba(250,181,143,.22)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p5);margin-right:6px;vertical-align:middle}
@media (max-width:600px){table.cal td.ct2,table.cal th:nth-child(2){display:none}}
.pngbox{position:fixed;left:-10000px;top:0;padding:0;background:var(--panel);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.pngbox .agx{grid-template-columns:1fr 1fr}
.pnghead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--p1);padding-bottom:10px;margin-bottom:14px}
.pngk{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.pngt{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;color:var(--p1)}
.pngb{font-size:12px;color:var(--ink3)}
.pngbox .agdest{margin-bottom:16px}
.mtx{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.mtx thead th{background:var(--p1);color:#fff;text-align:left;font-size:11px;text-transform:none;letter-spacing:0;padding:4px 6px;font-weight:600}
.mtx thead th span{font-weight:400;color:var(--p2);margin-left:2px}
.mtx th.pc{width:46px;text-align:center}
.mtx tbody th.pc{background:var(--soft);color:var(--ink3);text-transform:none;letter-spacing:0;font-size:10px;font-weight:600;vertical-align:middle;padding:2px;border-bottom:1px solid var(--line);text-align:center}
.mtx tbody th.pc .fl{display:block;font-size:16px;line-height:1}
.mtx td{vertical-align:top;padding:2px 3px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.mx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:6px;padding:1px 4px;border-radius:3px;margin-bottom:1px;line-height:1.25}
.mx:last-child{margin-bottom:0}
.mx.hi{background:rgba(250,181,143,.28)}
.mxh{color:var(--ink3);font-size:11px}
.mxv{font-size:11px;white-space:nowrap;margin-left:auto}.mxv b{color:var(--ink)}
.vs{color:var(--ink3)}
.pngbox{width:1600px;padding:0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Painel de Notícias <span>| Henrique Behrens</span></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar notícias…" aria-label="Buscar">
        <select id="fv" aria-label="Filtrar por veículo"><option value="">Todos os veículos</option></select>
        <button id="theme" title="Alternar tema">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>Painel gerado automaticamente a partir de páginas públicas, sem login. Resumos de notícias baseados em título, linha-fina e descrição pública de cada matéria. Horários em BRT (UTC−3); “≈” indica horário estimado a partir de indicação relativa (“há 2 horas”).</footer>

<script>
const BASE={v:'https://valor.globo.com',og:'https://oglobo.globo.com',f:'https://www1.folha.uol.com.br',fc:'https://c-level.folha.uol.com.br',p:'https://www.poder360.com.br',c:'https://www.cnnbrasil.com.br',m:'https://www.metropoles.com',e:'https://www.estadao.com.br',vj:'https://veja.abril.com.br',bj:'https://braziljournal.com',r:'https://www.reuters.com',ft:'https://www.ft.com/content/',fgv:'https://portalibre.fgv.br',bcb:'https://www.bcb.gov.br'};
const VNAME={v:'Valor',og:'O Globo',f:'Folha',fc:'Folha',p:'Poder360',c:'CNN Brasil',m:'Metrópoles',e:'Estadão',vj:'Veja',bj:'Brazil Journal',r:'Reuters',ft:'Financial Times',fgv:'FGV IBRE',bcb:'BCB',fed:'Federal Reserve',boj:'BoJ',ibge:'IBGE'};
function U(s){const i=s.indexOf(':');const k=s.slice(0,i);if(k==='https')return s;return (BASE[k]||'')+s.slice(i+1)}
function S(k){return VNAME[k]||k}

const DATA={"meta": {"edicao": "Quarta-feira, 4 de novembro de 2026", "gerado": "04/11/2026 ≈07h50 (execução agendada)", "janela": "03/11 13h45 → 04/11 07h45 (18h)"}, "geral": [{"h": "Política: PEC da Segurança aprovada e a largada da disputa pelo Senado", "p": "O Senado aprovou a PEC da Segurança Pública por 73 a 0 em primeiro turno, sem a redução da maioridade penal, e o texto segue para promulgação (O Globo, Poder360). É a primeira vitória do governo no Congresso desde a eleição. Lula comemorou e reafirmou a criação do Ministério da Segurança, enquanto governo e oposição costuram um calendário especial para votar a maioridade penal em separado; o líder do PT fala em redução só para crimes hediondos. O PL lança hoje, às 11h, Rogério Marinho contra Davi Alcolumbre. O grupo calcula 39 votos (CNN), e o PP se irritou com ataques a Tereza Cristina, que mantém a candidatura. O Novo terá nome próprio na Câmara. Lula fez exames de rotina no Sírio-Libanês, “dentro da normalidade”, e volta hoje a Brasília. Segundo o Valor, ele só deve avançar nas conversas sobre o novo governo depois da viagem à Turquia e às Filipinas. Leitura analítica: a PEC dá ao Planalto um trunfo, mas o adiamento da equipe prolonga o vácuo que pesa sobre os preços."}, {"h": "Mercado doméstico: ativos nos piores níveis do ano às vésperas do Copom", "p": "O Ibovespa caiu 1,42% na terça, a 165.529 pontos, no sexto pregão seguido de queda (Estadão), e o dólar subiu ao maior patamar do ano: R$ 5,4871 no comercial (+0,79%, Valor) e PTAX de R$ 5,4935 (BCB). O DI de 10 anos subiu ≈26 bps, a 15,68% (Investing). O Valor atribui o estresse ao silêncio de Lula sobre a Fazenda e o BC e ao temor de medidas heterodoxas na linha de André Lara Resende. Cochrane, Frischtak e Zeina Latif criticaram a proposta, e a inflação implícita disparou. O Copom decide hoje, às 18h30. A Folha fala em “maioria ampla” pela manutenção em 13,75%, e a B3 dá 72,5% para essa opção (Poder360), enquanto o Estadão descreve um mercado dividido (divergência). No Focus, o PIB de 2026 recuou de 1,80% para 1,76%, e o IPCA subiu de 5,19% para 5,22% (Valor). A Bloomberg destaca a disparada das apostas em juros e inflação após a reeleição."}, {"h": "Fiscal, tributário e inflação: dívida a caminho de 90% do PIB e MP do Seletivo", "p": "O Tesouro projeta a dívida bruta em 83,7% do PIB neste ano, perto de 90% em 2030 e 91,5% em 2036 sem superávits, e diz que só reformas estruturais garantem uma queda sustentada (Folha, O Globo). O mesmo relatório estima que cada ponto da Selic mexe em mais de R$ 400 bilhões da dívida até 2030. O risco fiscal mapeado caiu em 2025, mas segue em R$ 4,87 trilhões (Valor), e ministérios pedem mais R$ 1 bilhão para fechar o ano. Sobre o Imposto Seletivo, O Globo noticiou o adiamento da MP na terça à tarde, e o blog da Folha diz que ela deve sair nesta quarta (divergência de calendário). Lula discutiu o texto com o ministro da Fazenda. Mais de 20 entidades pedem o adiamento da reforma tributária. Em Londres, um ministro prometeu a investidores que Lula “vai endereçar” o fiscal (Brazil Journal). O IPC-Fipe de outubro subiu 0,44%, e o IPCA sai em 12/11."}, {"h": "Internacional: “onda azul” tira de Trump o controle do Congresso", "p": "Os democratas conquistaram a Câmara e o Senado nas eleições de meio de mandato. As projeções apontam 54 cadeiras no Senado (NYT, Valor), com sete viradas em redutos republicanos: Texas, Carolina do Sul, Carolina do Norte, Ohio, Maine, Iowa e Kansas. Os destaques são James Talarico no Texas, o primeiro democrata em quase 40 anos, Abdul El-Sayed, primeiro senador muçulmano, e Keisha Lance Bottoms, primeira governadora negra (Geórgia). Trump parabenizou os democratas e disse que aceitará o resultado, mas avisou que será o “Sr. Veto” (Veja) e admitiu ao WSJ que a guerra com o Irã pesou. A FT e a Bloomberg citam a inflação e o cansaço com Trump. Nos mercados, os futuros reverteram as perdas iniciais, e o dólar recua. Nos dados, a JOLTS veio em 7,52 milhões (consenso de 7,15 mi), e a inflação da zona do euro subiu a 4,0% em outubro, em linha e o dobro da meta do BCE. ADP e ISM de serviços saem hoje, o BoE decide amanhã (consenso de alta a 4,00%) e o payroll sai na sexta."}, {"h": "Geopolítica e empresas: Ormuz sob minas, ajuda a Israel e a conta da IA", "p": "O Irã relata mais quatro petroleiros em chamas após minas em Ormuz (Estadão), e o WSJ descreve táticas de guerrilha de Teerã para retomar o controle do estreito. Trump disse ao FT que não há plano imediato de novos ataques ao Irã, um dia depois do ataque a Qeshm, e afirmou que os EUA cortarão a ajuda militar a Israel até o fim do ano (WSJ). A Reuters vê Washington e Teerã ainda distantes de um acordo. A China confirmou conversas para uma inédita cúpula trilateral com EUA e Rússia (Bloomberg), e a Rússia voltou a atingir usinas na Ucrânia. Nas empresas, a AMD teve receita 45% maior e lucro 95% maior, e o Itaú ampliou a distância dos rivais com ROE de 23,6% (Brazil Journal). A Oracle cancelou um acordo de IA de US$ 7 bi com a Tencent sob pressão de Trump, a Marvell e a Lumentum perderam US$ 91 bi em valor de mercado, e Tesla e SpaceX caem com a onda azul (Bloomberg). A Embraer negocia a venda de 100 jatos à IndiGo (Folha)."}, {"h": "Fechamento dos mercados (Américas e Europa em 03/11; Ásia em 04/11)", "p": "Bolsas: Ibovespa 165.529 pts (−1,42%); S&P 500 7.568,92 (+0,36%); Nasdaq 25.372,01 (+0,83%); Dow Jones 51.786,72 (−0,38%); Stoxx 600 645,66 (−0,58%); DAX 25.864,62 (−0,45%); FTSE 100 10.638,43 (−1,14%). Ásia em 04/11: Nikkei 62.192 (−1,26%); Hang Seng 23.919,50 (+1,67%); Xangai 3.686,17 (+2,16%). Juros de 10 anos: Brasil 15,68% (+26,5 bps); EUA 4,950% (+5,6 bps) e 2 anos 4,614% (+3,1 bps); Alemanha 3,310% (+1,9 bp); Reino Unido 5,248% (+5,1 bps); Japão 2,820% (+4,5 bps, em 04/11); China 1,605% (−3,6 bps, em 04/11). Moedas: USD/BRL 5,4900 (+0,97%, Investing; PTAX de 5,4935); DXY 101,87 (+0,12%); EUR/USD 1,1194 (+0,06%); USD/JPY 158,68 (+0,46%); USD/CNY 6,6706 (+0,34%). Commodities: Brent US$ 103,60 (−1,12%); WTI US$ 96,09 (−0,38%); ouro US$ 3.940,40 (−0,74%); cobre US$ 6,402/lb (−2,52%); soja 1.214,00 cents/bu (−0,23%); minério 62% US$ 91,03/t (−0,24%). Nesta manhã (≈07h45), depois da onda azul, o DXY cai a ≈101,37 (−0,5%), o ouro sobe ≈3% (US$ 4.058), o Brent cede a ≈US$ 102 e o Stoxx 600 avança ≈1,25% (Investing, intradiário)."}], "top10": [{"t": "Democratas tomam Câmara e Senado em derrota histórica de Trump", "d": "Projeções dão 54 cadeiras aos democratas no Senado, com sete viradas, de Texas a Kansas, e maioria na Câmara. A FT fala em “repreensão impressionante”, e o WSJ, em ruptura do controle de Trump sobre Washington.", "w": "Abre dois anos de governo dividido: investigações, vetos e travas a tarifas, à guerra com o Irã e à agenda fiscal.", "s": [["r", "r:/legal/government/democrats-seize-congress-sweeping-midterm-repudiation-trump-2026-11-04/"], ["ft", "ft:b1eb9500-612a-4bb0-bdc3-0311cfc0ec99"], ["v", "v:/mundo/noticia/2026/11/04/democratas-tomam-de-trump-controle-do-congresso.ghtml"]]}, {"t": "Copom decide hoje com mercado inclinado à pausa em 13,75%", "d": "Folha e B3 (72,5%) apontam manutenção; o Estadão descreve mercado dividido. Câmbio, inflação implícita e Focus pioraram desde a eleição.", "w": "Primeira decisão após a reeleição testa a credibilidade do BC em meio ao debate sobre propostas heterodoxas.", "s": [["f", "f:/mercado/2026/11/copom-deve-manter-selic-em-1375-e-interromper-ciclo-de-cortes.shtml"], ["p", "p:/poder-economia/mercado-aposta-em-manutencao-da-selic-em-1375-pos-reuniao-do-copom/"], ["e", "e:/einvestidor/cenarios-e-mercado/selic-mercado-muda-projecoes-e-ve-decisao-do-copom-como-teste-de-credibilidade-do-bc/"]]}, {"t": "Ativos locais vão aos piores níveis do ano com temor sobre a condução da economia", "d": "Ibovespa −1,42%, dólar a R$ 5,49 e DI de 10 anos a 15,68%. O silêncio sobre Fazenda e BC e a proposta de Lara Resende pesam.", "w": "O prêmio de risco já embute a hipótese de guinada heterodoxa, o que encarece crédito e dívida.", "s": [["v", "v:/financas/noticia/2026/11/04/ativos-locais-vao-aos-piores-niveis-do-ano-com-temor-sobre-conducao-da-economia.ghtml"], ["og", "og:/economia/financas/noticia/2026/11/04/por-que-o-silencio-de-lula-sobre-a-equipe-economica-do-novo-mandato-mexe-tanto-com-o-dolar.ghtml"]]}, {"t": "Senado aprova PEC da Segurança por unanimidade e sem redução da maioridade", "d": "Texto constitucionaliza o Susp, amplia a PF e endurece penas para facções. Vai à promulgação, e a maioridade terá votação separada.", "w": "Primeira vitória do governo pós-eleição e base para o novo Ministério da Segurança Pública.", "s": [["og", "og:/politica/noticia/2026/11/03/senado-aprova-pec-da-seguranca-com-penas-mais-duras-para-faccoes-fortalecimento-da-pf-e-sem-reducao-da-maioridade.ghtml"], ["p", "p:/poder-congresso/senado-aprova-pec-da-seguranca-publica-e-texto-vai-a-promulgacao/"]]}, {"t": "Trump aceita o resultado, mas promete ser o “Sr. Veto”", "d": "Presidente parabenizou os democratas, disse que não estava na cédula e admitiu ao WSJ que a guerra com o Irã pesou na derrota.", "w": "O tom indica governo por vetos e ordens executivas, com risco de mais atrito institucional.", "s": [["vj", "vj:/mundo/trump-admite-derrota-mas-avisa-serei-o-sr-veto/"], ["WSJ", "https://www.wsj.com/politics/elections/trump-acknowledges-iran-war-is-partly-to-blame-for-republican-losses-c3cf572e"]]}, {"t": "Tesouro projeta dívida perto de 90% do PIB em 2030", "d": "Indicador fecha 2026 em 83,7% do PIB e chega a 91,5% em 2036 sem superávits. Cada ponto da Selic vale mais de R$ 400 bi até 2030.", "w": "Reforça a pressão por um sinal fiscal do quarto mandato antes da definição da equipe.", "s": [["og", "og:/economia/noticia/2026/11/03/tesouro-projeta-divida-perto-de-90percent-do-pib-em-2030-e-diz-que-queda-sustentada-depende-de-reformas.ghtml"], ["f", "f:/mercado/2026/11/tesouro-projeta-divida-em-915-do-pib-em-2036-sem-superavits-e-defende-reformas-estruturais.shtml"]]}, {"t": "PL lança Marinho contra Alcolumbre na disputa pelo Senado", "d": "Candidatura sai hoje às 11h. O grupo calcula 39 votos e aposta em acordo com Tereza Cristina, que mantém o nome; o PP reclama de ataques.", "w": "O comando do Senado define o ritmo das indicações de Lula, que podem chegar a 53 no próximo mandato.", "s": [["c", "c:/blogs/jussara-soares/politica/marinho-mira-autonomia-do-senado-para-ampliar-apoio-contra-alcolumbre/"], ["og", "og:/politica/noticia/2026/11/04/pl-lanca-rogerio-marinho-a-presidencia-do-senado-em-meio-a-disputa-por-apoio-da-oposicao.ghtml"]]}, {"t": "Inflação da zona do euro sobe a 4% em outubro, o dobro da meta do BCE", "d": "Leitura em linha com o consenso; é o ritmo mais forte em três anos. O núcleo ficou em 2,5%. Os PMIs de serviços recuaram, mas seguem acima de 50.", "w": "Sustenta o viés de aperto do BCE, e o BoE deve subir os juros amanhã.", "s": [["ft", "ft:23cedd6f-e550-4869-aee1-e0ec10ae7e51"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-04/euro-zone-inflation-accelerates-to-double-the-ecb-s-target"]]}, {"t": "Irã relata mais petroleiros atingidos por minas em Ormuz; Trump descarta novo ataque imediato", "d": "Quatro navios pegaram fogo, e Teerã recorre a minas e lança-granadas. Trump disse ao FT que não há plano imediato de atacar o Irã.", "w": "O fluxo de petróleo segue vulnerável, e o Congresso democrata deve pressionar por limites à guerra.", "s": [["e", "e:/internacional/ira-diz-que-quatro-navios-petroleiros-pegaram-fogo-apos-atingirem-minas-em-ormuz-npr/"], ["ft", "ft:f3afd549-65fc-487e-922e-2748fa6a8a5f"], ["WSJ", "https://www.wsj.com/world/middle-east/iran-turns-to-guerrilla-tactics-in-bid-to-reassert-grip-on-strait-of-hormuz-f10da428"]]}, {"t": "Mercados globais digerem a onda azul: dólar cai e ações de IA e de Musk sofrem", "d": "Os futuros nos EUA reverteram as perdas, a Ásia subiu na China e caiu no Japão, e Tesla e SpaceX recuam. A Bloomberg vê risco às apostas em IA e cripto.", "w": "Mais regulação de IA e de data centers entra no radar das big techs, que puxam os índices.", "s": [["ft", "ft:a0b18705-3bd8-4886-992c-b6062fdec6ea"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-04/democrats-win-rattles-trump-trades-from-ai-stocks-to-crypto"], ["v", "v:/financas/intraday/post/2026/11/em-wall-street-surpresa-com-a-dimensao-da-onda-azul-nas-midterms.ghtml"]]}], "secoes": [{"id": "brasil", "nome": "Brasil", "cls": "sec-br", "resumo": "A sessão no Brasil foi marcada pela primeira vitória legislativa do governo após a eleição, a PEC da Segurança aprovada por 73 a 0, e pela largada da disputa pelo Senado. Ao mesmo tempo, os ativos foram aos piores níveis do ano à espera do Copom e de sinais sobre a equipe econômica. O relatório do Tesouro e a pressão sobre a Selic deixam o fiscal no centro, e o caso Master ganhou novos capítulos (BRB e intimação nos EUA).", "temas": [{"n": "Destaques", "r": "A PEC da Segurança aprovada por unanimidade e a abertura da disputa pelo Senado dominam a política. Na economia, o Copom de hoje ocorre com os ativos locais nos piores níveis do ano e com o Tesouro projetando dívida perto de 90% do PIB.", "i": [["≈19h30 (03/11)", "og", "Senado aprova PEC da Segurança com penas mais duras para facções, fortalecimento da PF e sem redução da maioridade", "Placar de 73 a 0 no primeiro turno; o texto vai à promulgação.", "og:/politica/noticia/2026/11/03/senado-aprova-pec-da-seguranca-com-penas-mais-duras-para-faccoes-fortalecimento-da-pf-e-sem-reducao-da-maioridade.ghtml"], ["04h00", "f", "Copom deve manter Selic em 13,75% e interromper ciclo de cortes", "Levantamentos apontam maioria ampla por juros estáveis.", "f:/mercado/2026/11/copom-deve-manter-selic-em-1375-e-interromper-ciclo-de-cortes.shtml"], ["≈06h45", "v", "Ativos locais vão aos piores níveis do ano com temor sobre condução da economia", "Proposta de Lara Resende gera receio de medidas heterodoxas.", "v:/financas/noticia/2026/11/04/ativos-locais-vao-aos-piores-niveis-do-ano-com-temor-sobre-conducao-da-economia.ghtml"], ["≈01h45", "og", "Tesouro projeta dívida perto de 90% do PIB em 2030 e diz que queda sustentada depende de reformas", "Cenário de juros altos, crescimento menor e déficits maiores.", "og:/economia/noticia/2026/11/03/tesouro-projeta-divida-perto-de-90percent-do-pib-em-2030-e-diz-que-queda-sustentada-depende-de-reformas.ghtml"], ["≈00h45", "og", "PL lança Rogério Marinho à presidência do Senado em meio à disputa por apoio da oposição", "Anúncio às 11h; Tereza Cristina mantém a candidatura.", "og:/politica/noticia/2026/11/04/pl-lanca-rogerio-marinho-a-presidencia-do-senado-em-meio-a-disputa-por-apoio-da-oposicao.ghtml"]]}, {"n": "Política e Congresso", "r": "A aprovação da PEC da Segurança (73 a 0) foi costurada com a retirada da maioridade penal, que agora ganha calendário próprio: o líder do PT fala em redução só para crimes hediondos, e a comissão da Câmara quer votar ainda neste mês. Lula comemorou e deve criar o Ministério da Segurança, tema que a coluna do Valor vê como oportunidade para Alckmin. Na sucessão do Senado, o PL lança Marinho hoje; a CNN fala em 39 votos, o PP reage a ataques a Tereza Cristina e o Novo apoia Marinho, mas terá candidato próprio na Câmara. Lula volta a Brasília depois de exames normais e, segundo o Valor, só avança na formação do governo depois da viagem à Turquia e às Filipinas. O presidente poderá renovar toda a direção das agências reguladoras até 2030 e terá até 53 indicações a submeter ao Senado (Estadão). No PT, a cúpula expõe um racha, e Quaquá é ameaçado de expulsão (Estadão).", "i": [["≈04h45", "og", "Da retirada da maioridade à votação unânime: o que garantiu a primeira vitória do governo após eleições", "Alteração será promulgada pelo Congresso.", "og:/politica/noticia/2026/11/04/da-retirada-da-maioridade-a-votacao-unanime-o-que-garantiu-a-primeira-vitoria-do-governo-apos-eleicoes.ghtml"], ["19h31 (03/11)", "p", "Senado aprova PEC da Segurança Pública e texto vai a promulgação", "Ba ic-calendar/"]]}]}, {"id": "intl", "nome": "Internacional", "cls": "sec-intl", "resumo": "A vitória democrata na Câmara e no Senado redefine os dois últimos anos de Trump. Pesaram a inflação, a gasolina recorde e a guerra com o Irã, que o próprio presidente admitiu. Ormuz segue sob ameaça de minas, os EUA anunciam o fim da ajuda militar a Israel e a China confirma conversas para uma cúpula trilateral. Na Europa, a inflação de 4% sustenta o aperto monetário.", "temas": [{"n": "Guerra e Conflitos", "r": "O Oriente Médio segue no centro. O Irã diz que mais quatro petroleiros pegaram fogo após atingirem minas em Ormuz, e o WSJ descreve táticas de guerrilha para retomar o controle do estreito. Trump disse ao FT que não há plano imediato de atacar o Irã e afirmou que os EUA cortarão a ajuda militar a Israel até o fim do ano; o Parlamento iraniano leu a derrota republicana como mensagem contra a guerra. Para a Reuters, EUA e Irã seguem distantes de um acordo. Na Ucrânia, a Rússia atingiu usinas nas regiões de Kiev e Zhytomyr. A Coreia do Norte lançou novo projétil, e a OTAN discute um plano com ataques de longo alcance dentro da Rússia (WSJ).", "i": [["02h34", "e", "Irã diz que mais quatro navios-petroleiros pegaram fogo após atingirem minas em Ormuz", "—", "e:/internacional/ira-diz-que-quatro-navios-petroleiros-pegaram-fogo-apos-atingirem-minas-em-ormuz-npr/"], ["—", "WSJ", "Iran Resorts to Guerrilla Tactics in Bid to Reassert Grip on Strait of Hormuz", "Em português: “Irã recorre a táticas de guerrilha para retomar o controle de Ormuz”; usa de lança-granadas a minas magnéticas.", "https://www.wsj.com/world/middle-east/iran-turns-to-guerrilla-tactics-in-bid-to-reassert-grip-on-strait-of-hormuz-f10da428"], ["—", "ft", "US has no immediate plan to strike Iran, Trump tells FT", "Em português: “EUA não têm plano imediato de atacar o Irã, diz Trump ao FT”.", "ft:f3afd549-65fc-487e-922e-2748fa6a8a5f"], ["—", "WSJ", "Trump Says U.S. Plans to Cut Off Military Aid to Israel by End anca-recuam-e-apontam-deterioracao-da-atividade.ghtml"], ["06h46", "v", "PMI de Serviços do Reino Unido avança para 52,8 em outubro", "Composto em 52,9, o maior em oito meses.", "v:/mundo/noticia/2026/11/04/pmi-de-servicos-do-reino-unido-avanca-para-528-em-outubro.ghtml"], ["—", "ft", "Better than expected Eurozone growth supports ECB’s tightening path", "Em português: “Crescimento acima do esperado sustenta o aperto do BCE”.", "ft:6dc54eed-2904-487d-8656-85ac25111933"], ["20h29 (03/11)", "f", "Ministro dos Transportes da Espanha renuncia após colisão de trens matar 69", "Sánchez reformula o gabinete (Reuters).", "f:/mundo/2026/11/ministro-dos-transportes-da-espanha-renuncia-apos-colisao-de-trens-matar-69.shtml"], ["—", "ft", "Seven aircraft grounded in Europe after bomb threats", "Em português: “Sete aviões retidos na Europa após ameaças de bomba”; nada foi encontrado (Valor).", "ft:f1122a7d-f27b-437f-84ba-59ea87e2ba17"], ["—", "ft", "Italy’s ‘exit tax’ plan spooks rich expats", "Em português: “Plano de ‘imposto de saída’ da Itália assusta expatriados ricos”.", "ft:394938d3-f635-4af7-89f2-8a3c28ecf4ae"], ["—", "WSJ", "Britain Set to Apologize for Role in Trans-Atlantic Slave Trade", "Em português: “Reino Unido vai se desculpar pelo tráfico transatlântico”; sem reparações.", "https://www.wsj.com/world/uk/britain-set-to-apologize-for-role-in-trans-atlantic-slave-trade-a7afc8dc"], ["04/11", "r", "Hungary opens communist-era informer files in belated reckoning with Cold War past", "Em português: “Hungria abre arquivos de informantes da era comunista”.", "r:/world/hungary-opens-communist-era-informer-files-belated-reckoning-with-cold-war-past-2026-11-04/"]]}, {"n": "China", "r": "A China confirmou conversas com EUA e Rússia para uma primeira cúpula trilateral (Bloomberg). Na tecnologia, a Oracle cancelou um acordo de IA de US$ 7 bi com a Tencent sob pressão de Trump, e a Nvidia mandou clientes de data centers reduzirem a exposição à China (FT). A Reuters avalia que a de e gabinete, e policiais de alto escalão foram presos por suposto grampo ilegal do presidente. O governo mobilizou 20 mil soldados (FT, Reuters).", "i": [["—", "ft", "Indonesia deploys 20,000 soldiers as wiretapping scandal erupts", "Em português: “Indonésia mobiliza 20 mil soldados em meio a escândalo de grampos”.", "ft:b82627c8-726b-471d-9e49-f28b06765e79"], ["04/11", "r", "Indonesia president sacks his chief of staff for alleged wiretapping", "Em português: “Presidente da Indonésia demite o chefe de gabinete por suposto grampo”.", "r:/world/asia-pacific/indonesia-arrests-chief-staff-top-policemen-alleged-wiretapping-president-2026-11-04/"]], "pm": "Escândalo de grampos"}, {"n": "Economia Global", "r": "Os bancos centrais seguem em modo de aperto. O BC do Canadá promete cautela após a primeira alta em mais de três anos, o BoE deve subir os juros amanhã e o BCE ganha argumentos com a inflação a 4%. O Valor compara as decisões de juros desta semana no Brasil e no México. Bangladesh fechou um acordo de reajuste para os trabalhadores têxteis após cinco dias de protestos, e o Catar deve se tornar o maior comprador de GNL dos EUA (FT).", "i": [["≈16h45 (03/11)", "v", "Presidente do BC do Canadá promete cautela em novos aumentos de juros", "BoC elevou a taxa para 2,5% na semana passada.", "v:/financas/noticia/2026/11/03/presidente-do-bc-do-canad-promete-cautela-em-novos-aumentos-de-juros.ghtml"], ["≈18h45 (03/11)", "v", "Análise: Decisões de juros desta semana expõem diferenças entre Brasil e México", "—", "v:/financas/noticia/2026/11/03/analise-decisoes-de-juros-desta-semana-expoem-diferencas-entre-brasil-e-mexico.ghtml"], ["—", "ft", "Qatar set to become world’s biggest buyer of US LNG", "Em português: “Catar deve se tornar o maior comprador de GNL dos EUA”.", "ft:88e46724-0bd4-451a-b02b-f5709c9771b7"], ["≈06h45", "og", "Após cinco dias de protestos, Bangladesh fecha acordo para aumentar salário mínimo de trabalhadores têxteis", "Categoria pedia reajuste de 140%.", "og:/economia/noticia/2026/11/04/apos-cinco-dias-de-protestos-bangladesh-fecha-acordo-para-aumentar-salario-minimo-de-trabalhadores-texteis.ghtml"], ["04/11", "r", "South Africans vote as anger over failing services threatens ANC", "Em português: “Sul-africanos votam com o CNA ameaçado pela insatisfação”.", "r:/world/africa/south-africa-votes-local-polls-expected-further-weaken-anc-grip-2026-11-03/"], ["—", "ft", "Are we ready for an AI bust?", "Em português: “Estamos prontos para o estouro da IA?” (opinião).", "ft:b954b99c-b71e-4334-9789-18e2b69de76d"]]}]}, {"id": "emp", "nome": "Empresas & Mercado", "cls": "sec-emp", "resumo": "Os mercados recalibram as apostas para um Congresso democrata: o dólar cai, as ações de IA e de Musk recuam e os futuros se recuperam. No Brasil, a safra de balanços traz Itaú forte, ISA Energia, Latam e RD Saúde em alta e BB Seguridade e Marcopolo em queda. A AMD lidera entre os chips.", "temas": [{"n": "Destaques do Mercado", "r": "Os mercados globais reagem à onda azul. Os futuros nos EUA reverteram as perdas iniciais, já que uma vitória folgada reduz o risco de contestação (FT), e o dólar cai. Ações ligadas a Trump, IA e cripto sofrem: Tesla e SpaceX recuam (Bloomberg), e a Nasdaq futura sobe apesar do risco de mais regulação da IA (Valor). A temporada de balanços segue forte em chips (AMD, Super Micro), e o Itaú se destaca no Brasil.", "i": [["—", "ft", "Stocks recover as investors digest Democrats’ sweep", "Em português: “Ações se recuperam enquanto investidores digerem a vitória democrata”.", "ft:a0b18705-3bd8-4886-992c-b6062fdec6ea"], ["—", "Bloomberg", "Democrats’ Win Rattles Trump Trades From AI Stocks to Crypto", "Em português: “Vitória democrata abala as apostas ligadas a Trump, de IA a cripto”.", "https://www.bloomberg.com/news/articles/2026-11-04/democrats-win-rattles-trump-trades-from-ai-stocks-to-crypto"], ["07h10", "v", "Em Wall Street, surpresa com a dimensão da onda azul nas ‘midterms’", "Dólar recua; Nasdaq futuro sobe.", "v:/financas/intraday/post/2026/11/em-wall-street-surpresa-com-a-dimensao-da-onda-azul-nas-midterms.ghtml"], ["—", "Bloomberg", "Musk’s Tesla, SpaceX Slide as Democrats Sweep Congress", "Em português: “Tesla e SpaceX caem com a vitória democrata”.", "https://www.bloomberg.com/news/articles/2026-11-04/tesla-spacex-shares-take-early-hit-as-midterm-blue-wave-unfolds"], ["≈02h45", "og", "Primeiros resultados da eleição para o Congresso dos EUA elevam tensão no mercado financeiro do país", "—", "og:/economia/financas/noticia/2026/11/03/primeiros-resultados-da-eleicao-para-o-congresso-dos-eua-elevam-tensao-no-mercado-financeiro-do-pais.ghtml"], ["21h45 (03/11)", "c", "Wall Street: Nasdaq sobe com recuperação de empresas do setor de IA", "Micron +2,6%, Nvidia +2,3%.", "c:/economia/money/mercado/wall-street-nasdaq-sobe-com-recuperacao-de-empresas-do-setor-de-ia/"], ["—", "ft", "Marshall Wace and Millennium hit as hedge funds suffer in October’s AI rout", "Em português: “Hedge funds sofrem com a derrocada da IA em outubro”.", "ft:fae029f1-f03e-4509-852e-396fa4863271"]]}, {"n": "Bancos & Financeiro", "r": "O Itaú ampliou a vantagem sobre os concorrentes com ROE de 23,6% e carteira saudável (Brazil Journal), enquanto o lucro da BB Seguridade caiu 5,1% e a empresa cortou projeções. No exterior, a Block pagará quase US$ 1 bi para encerrar uma investigação de lavagem, e hackers usaram entrevistas falsas no roubo de US$ 6,3 bi da Binance (FT, Bloomberg). A CFTC aprovou contratos perpétuos de ações nos EUA, e a Meta busca US$ 15 bi em títulos.", "i": [["21h00 (03/11)", "bj", "Itaú se afasta de concorrentes com ROE de 23,6% e carteira saudável", "Resultado do 3º trimestre.", "bj:/itau-se-afasta-de-concorrentes-com-roe-de-23-6-e-carteira-saudavel"], ["21h10 (03/11)", "c", "BB Seguridade registra lucro de R$ 2,432 bi no 3° tri, recuo de 5,1%", "Empresa corta expectativas para o ano (Estadão).", "c:/economia/money/negocios/bb-seguridade-registra-lucro-de-r-2432-bi-no-3-tri-recuo-de-51/"]  "Perda de competitividade e falta de minério.", "v:/empresas/noticia/2026/11/03/gerdau-encerra-produo-de-ao-em-divinpolis-mg.ghtml"], ["—", "ft", "Glencore plans CEO pay overhaul to speed up windfall after any takeover", "Em português: “Glencore planeja mudar o pagamento do CEO em caso de aquisição”.", "ft:545be7ea-4506-49d6-bf82-59d273e1ef04"], ["—", "ft", "Crisis widens at top platinum refiner as probe exposes metal test manipulation", "Em português: “Crise se amplia em refinador de platina após manipulação de testes”.", "ft:97ce0d59-0d82-4f22-8ac1-d1b299c5b9d7"]]}, {"n": "Agro & Alimentos", "r": "A BrasilAgro reverteu o prejuízo e lucrou R$ 81,3 mi no trimestre, mas prefere reduzir dívida a comprar fazendas e enfrenta atraso na colheita de cana (CNN). Um novo foco da doença de Newcastle foi identificado em granja de Santa Catarina, o quarto no estado (Metrópoles). O El Niño deve complicar as safras de 2027. A Bloomberg relata inadimplência recorde no agro, e a Unilever cortará € 1 bi em custos após separar a área de alimentos.", "i": [["22h11 (03/11)", "c", "Brasilagro reverte prejuízo e lucra R$ 81,3 milhões no trimestre", "Venda de parte de fazenda na Bahia.", "c:/agro/brasilagro-reverte-prejuizo-e-lucra-r-813-milhoes-no-trimestre/"], ["07h40", "m", "Novo foco da doença de Newcastle é identificado em granja de Santa Catarina", "Quarto caso no estado desde a emergência.", "m:/brasil/novo-foco-da-doenca-de-newcastle-e-identificado-em-granja-de-santa-catarina"], ["04h00", "c", "De Norte a Sul, El Niño amplia complicações em safras em 2027", "Chuva prejudica cana e grãos de inverno.", "c:/agro/de-norte-a-sul-el-nino-arrasta-complicacoes-de-safras-ate-inicio-de-2027/"], ["—", "Bloomberg", "Lula Victory Adds to Brazil Farm Angst as Defaults Hit Record", "Em português: “Vitória de Lula aumenta a angústia no agro com inadimplência recorde”.", "https://www.bloomberg.com/news/articles/2026-11-03/lula-victory-adds-to-brazil-farm-angst-as-defaults-hit-record"], ["04h00", uxo-kitchens-com-dividas-de-r-300-milhoes.shtml"], ["—", "WSJ", "McDonald’s Is Beefing Up, but It Won’t Be Cheap", "Em português: “McDonald’s reforça o cardápio, mas não sairá barato”.", "https://www.wsj.com/finance/stocks/mcdonalds-is-beefing-up-but-it-wont-be-cheap-9ce73fff"]]}, {"n": "Tecnologia & Telecom", "r": "A AMD bateu as projeções, com receita de US$ 13,4 bi (+45%) e data centers em US$ 8,5 bi (+97%); a ação subiu ≈8% no after-market (CNN, WSJ). A Super Micro lucrou US$ 1,59 bi. A Marvell e a Lumentum perderam US$ 91 bi em valor de mercado com dúvidas sobre a fusão. Uma liminar proíbe a Meta de usar conteúdo jornalístico para treinar IA no Brasil, e a possível venda da TIM agita o mercado (Valor). Segundo o Valor, as big techs enfrentam gargalos de chips, energia e prédios.", "i": [["21h58 (03/11)", "c", "AMD tem receita de US$ 13,4 bi no 3° trimestre; ação sobe 8%", "Data centers somam US$ 8,5 bi, alta de 97%.", "c:/economia/money/negocios/amd-tem-receita-de-us-134-bi-no-3-trimestre-acao-sobe-8/"], ["21h22 (03/11)", "c", "Super Micro Computer tem lucro de US$ 1,5947 bi", "Ação sobe 8,12% no after-hours.", "c:/economia/money/negocios/super-micro-computer-tem-lucro-de-us-15947-bi/"], ["≈16h45 (03/11)", "v", "Marvell e Lumentum perderam US$ 91 bi em valor de mercado com aumento das dúvidas sobre fusão", "Desistência ainda parece improvável.", "v:/empresas/noticia/2026/11/03/marvell-e-lumentum-perderam-us-91-bi-em-valor-de-mercado-com-aumento-das-duvidas-sobre-fusao.ghtml"], ["21h06 (03/11)", "fc", "Justiça proíbe Meta de usar reportagens para treinar IA no Brasil", "Multa diária de até R$ 1 milhão.", "fc:/negocios/2026/11/justica-proibe-meta-de-usar-reportagens-para-treinar-ia-no-brasil.shtml"], ["≈05h45", "v", "Possível venda da TIM agita o mercado", "Poste Italiane disse que a operadora pode ser negociada.", "v:/impresso/noticia/2026/11/04/possivel-venda-da-tim-agita-o-mercado.ghtml"], ["≈05h45", "v", "‘Big techs’ operam com gargalo de chip, energia e prédio de data center", "—", "v:/empresas/noticia/2026/11/04/big-techs-operam-com-gargalo-de-chip-energia-e-predio-de-data-center.ghtml"], ["07h00", "bj", "Por que a euforia com os data centers já corre risco", "Depois do Redata.", "bj:/por-que-a-euforia-com-os-data-centers-ja-corre-risco"], ["≈14h45 (03/11)", "v", "Palantir registra forte resultado, mas preocupações com encomendas pesam sobre ação", "Receita +96%, a US$ 2,3 bi.", "v:/empresas/noticia/2026/11/03/palantir-registra-forte-resultado-mas-preocupacoes-com-encomendas-pesam-sobre-acao.ghtml"], ["—", "ft", "Accenture accused of publishing AI paper littered with AI hallucinations", "Em português: “Accenture é acusada de publicar estudo sobre IA cheio de alucinações”.", "ft:874e3f05-0be3-4a2d-b2a2-7b5823441794"], ["07h00", "bj", "André Street, o maior VC pessoa física do Brasil", "Fundador da Stone.", "bj:/andre-street-o-maior-vc-pessoa-fisica-do-brasil"]]}, {"n": "Saúde", "r": "A Anvisa aprovou a primeira versão em comprimidos do Wegovy (Metrópoles), e a Novo Nordisk elevou as projeções com a demanda pela pílula (FT). A CVS vai desmontar seu império de saúde de US$ 117 bi, e a 3M fechou um acordo de US$ 7,4 bi no caso dos “químicos eternos” (WSJ).", "i": [["07h36", "m", "Anvisa aprova primeira versão em comprimidos da caneta emagrecedora Wegovy", "Semaglutida oral de dose diária.", "m:/brasil/anvisa-aprova-primeira-versao-em-comprimidos-da-caneta-emagrecedora-wegovy"], ["—", "ft", "Novo sales boosted by Wegovy weight-loss pill", "Em português: “Vendas da Novo impulsionadas pela pílula do Wegovy”; projeções elevadas.", "ft:6dbbb7d2-54d2-4bad-adf8-3db5b757488b"], ["—", "ft", "CVS Health moves to dismantle $117bn healthcare empire", "Em português: “CVS vai desmontar império de saúde de US$ 117 bi”.", "ft:2478a5ea-263a-4f4f-ac96-7d619fb39bb8"], ["—", "WSJ", "3M Announces $7.4 Billion Settlement in ‘Forever Chemicals’ Injuries Case", "Em português: “3M anuncia acordo de US$ 7,4 bi no caso dos PFAS”.", "https://www.wsj const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(it,sec,tema){
  const [h,v,t,d,u]=it;
  const est=h.startsWith('≈')||h==='—';
  return `<article class="card" data-v="${v}" data-s="${esc((t+' '+d.replace(/<[^>]+>/g,'')).toLowerCase())}">
  <a class="ct" href="${esc(U(u))}" target="_blank" rel="noopener">${esc(t)}</a>
  ${d?`<div class="cd">${d}</div>`:''}
  <div class="cm"><span class="tag">${esc(S(v))}</span><span class="${est?'est':''}">${esc(h)}</span></div></article>`;
}
function countAll(){let n=0;DATA.secoes.forEach(s=>s.temas.forEach(t=>n+=t.i.length));return n}
function srcLinks(arr){return arr.map(([v,u])=>`<a href="${esc(U(u))}" target="_blank" rel="noopener">${esc(S(v))}</a>`).join('')}

function agendaDestaques(){
  return `<ul class="agdest">${DATA.agenda.destaques.map(([f,t])=>`<li><span class="fl">${f}</span>${esc(t)}</li>`).join('')}</ul><p class="note agnx">${esc(DATA.agenda.proxima)}</p>`;
}
function agendaGrid(){
  const D=DATA.agenda.dias;
  const cell=(p,d)=>p.ev.filter(e=>e[0].startsWith(d)).map(([dd,h,imp,n,at,co,an])=>{
    const v=at?`<b>${esc(at)}</b>${co?` <span class="vs">vs ${esc(co)}</span>`:''}`:(co||an?`<span class="vs">${co?'cons. '+esc(co):''}${co&&an?' · ':''}${an?'ant. '+esc(an):''}</span>`:'');
    return `<div class="mx${imp>=3?' hi':''}"><span class="mxt">${imp>=3?'<span class="imp"></span>':''}${h&&h!=='—'?`<span class="mxh">${esc(h)}</span> `:''}${esc(n)}</span>${v?`<span class="mxv">${v}</span>`:''}</div>`}).join('');
  return `<div class="tbl"><table class="mtx"><thead><tr><th class="pc"></th>${D.map(([d,n])=>`<th>${d} <span>${n}</span></th>`).join('')}</tr></thead><tbody>${DATA.agenda.paises.map(p=>`<tr><th class="pc" title="${esc(p.n)}"><span class="fl">${p.f}</span><span class="pn">(${esc(p.c)})</span></th>${D.map(([d])=>`<td>${cell(p,d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note aglg"><span class="imp"></span> alta importância · em negrito, o resultado divulgado (vs consenso) · horários em BRT; “≈” = estimado · fontes: Investing.com, FGV, BCB, Tesouro e imprensa</p>`;
}
function loadH2C(){return window.html2canvas?Promise.resolve():new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('Não foi possível carregar o gerador de imagem (verifique a conexão).'));document.head.appendChild(sc)})}
async function dlPNG(btn){
  const old=btn.textContent;btn.textContent='Gerando…';btn.disabled=true;
  const box=document.createElement('div');box.className='pngbox';
  const g=document.createElement('div');g.innerHTML=agendaGrid();box.appendChild(g.querySelector('table.mtx'));
  document.body.appendChild(box);
  try{await loadH2C();const bg=getComputedStyle(document.body).backgroundColor;
    const c=await html2canvas(box.firstElementChild,{scale:2,backgroundColor:getComputedStyle(document.querySelector('.panel')||document.body).backgroundColor||'#fff',useCORS:true,logging:false});
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='calendario_semana_'+DATA.agenda.semana.replace(/[^0-9a-z]+/gi,'_')+'.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert(e.message)}finally{box.remove();btn.textContent=old;btn.disabled=false}
}

function renderSec(s){

  const body=s.temas.map((t,k)=>`<section class="panel theme" id="${s.id}-${k}"><div class="th"><h3>${esc(t.n)}${t.pm?` <span class="note">· País do Momento — ${esc(t.pm)}</span>`:''}</h3><span class="cnt"><span class="vis">${t.i.length}</span> notícias</span></div><div class="items">${t.i.map(it=>card(it)).join('')}</div><p class="empty hidden">Nenhuma notícia corresponde ao filtro.</p></section>`).join('');

function renderAgenda(){return `<section class="panel"><div class="agtop"><div><p class="kicker">Agenda da Semana</p><h2>${esc(DATA.agenda.semana)}</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}</section><section class="panel">${agendaGrid()}</section>`}

function tabs(){
  const t=[['geral','Visão Geral',''],...DATA.secoes.map(s=>[s.id,s.nome,s.temas.reduce((a,b)=>a+b.i.length,0)]),['agenda','Agenda da Semana','']];
  $('#tabs').innerHTML=t.map(([id,n,c])=>`<button data-t="${id}" class="${state.tab===id?'on':''}">${esc(n)}${c!==''?`<span class="n">${c}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;try{localStorage.setItem('pn_tab',state.tab)}catch(e){}render();window.scrollTo(0,0)});
}
function render(){
  tabs();
  const app=$('#app');
  if(state.tab==='geral')app.innerHTML=renderGeral();
  else if(state.tab==='agenda')app.innerHTML=renderAgenda();
  else app.innerHTML=renderSec(DATA.secoes.find(s=>s.id===state.tab));
  filter();
  applyCollapse();
  document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{state.col=!state.col;try{localStorage.setItem('pn_col',state.col?'1':'')}catch(e){}applyCollapse()});
}
function applyCollapse(){document.querySelectorAll('.sumbox').forEach(p=>p.classList.toggle('collapsed',!!state.col));document.querySelectorAll('.tog').forEach(b=>b.textContent=state.col?'＋ Expandir resumo':'－ Minimizar resumo')}
function filter(){
  const q=state.q.trim().toLowerCase(),v=state.v;
  if((q||v)&&(state.tab==='geral'||state.tab==='agenda')){
    // global search: show results across sections
    const res=[];DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>{const txt=(it[2]+' '+it[3].replace(/<[^>]+>/g,'')).toLowerCase();if((!q||txt.includes(q))&&(!v||S(it[1])===v))res.push([s.nome+' · '+t.n,it])})));
    $('#app').innerHTML=`<section class="panel"><p class="kicker">Resultados da busca</p><h2>${res.length} notícia(s)</h2><div class="items">${res.map(([w,it])=>card(it).replace('<div class="cm">',`<div class="cm"><span class="note">${esc(w)}</span>`)).join('')||'<p class="empty">Nada encontrado.</p>'}</div></section>`;
    return;
  }
  document.querySelectorAll('.theme').forEach(th=>{let n=0;th.querySelectorAll('.card').forEach(c=>{const ok=(!q||c.dataset.s.includes(q))&&(!v||S(c.dataset.v)===v);c.classList.toggle('hidden',!ok);if(ok)n++});const vis=th.querySelector('.vis');if(vis)vis.textContent=n;th.querySelector('.empty').classList.toggle('hidden',n>0)});
}
function init(){
  $('#meta').textContent=`${DATA.meta.edicao} · Janela: ${DATA.meta.janela} · ${countAll()} notícias classificadas`;
  const vs=new Set();DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>vs.add(S(it[1])))));
  $('#fv').innerHTML+= [...vs].sort().map(v=>`<option>${esc(v)}</option>`).join('');
  $('#q').oninput=e=>{state.q=e.target.value;if(state.tab==='geral'||state.tab==='agenda'){if(!state.q&&!state.v)render();else filter()}else filter()};
  $('#fv').onchange=e=>{state.v=e.target.value;if((state.tab==='geral'||state.tab==='agenda')&&!state.q&&!state.v)render();else filter()};
  $('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pn_theme',n)}catch(e){}};
  render();
}
init();
</script>
</body>
</html>
