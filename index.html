<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Notícias | Henrique Behrens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#0147ab;--p2:#D2E8FF;--p3:#E2E6ED;--p4:#FAB58F;--p5:#DF570B;
  --bg:#f6f8fb;--panel:#ffffff;--ink:#0d1530;--ink2:#3f4a63;--ink3:#6b7489;--line:var(--p3);
  --brand:var(--p1);--brand2:var(--p1);--accent:var(--p5);--chip:var(--p3);--chipink:#1b2440;--soft:var(--p2);
  --br:var(--p1);--intl:var(--p5);--emp:var(--p4);--warn:#a33f06;--warnbg:#fde3d3;--ok:var(--p1);--okbg:var(--p2);
  --shadow:0 1px 2px rgba(1,71,171,.05),0 1px 3px rgba(1,71,171,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand2);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--brand);color:#fff;padding:18px 16px 0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;margin:0;letter-spacing:.2px}
h1 span{color:var(--p2);font-weight:500}
.meta{font-size:12.5px;color:var(--p2);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;width:220px;font:inherit;font-size:13.5px}
.tools input::placeholder{color:#c4d2e4}
.tools select,.tools button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.tools select option{color:#111}
nav.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:transparent;border:0;color:var(--p2);padding:10px 14px;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs .n{font-size:11px;background:#ffffff1f;border-radius:10px;padding:1px 7px;margin-left:6px}
main{padding:20px 0 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.kicker{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
h2{font:600 19px/1.3 "IBM Plex Serif",Georgia,serif;margin:0 0 10px}
h3{font:600 16px/1.3 "IBM Plex Sans",sans-serif;margin:0}
.summary p{margin:0 0 10px;color:var(--ink)}
.summary p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
ol.top10{list-style:none;padding:0;margin:0;counter-reset:t}
ol.top10 li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
ol.top10 li:first-child{border-top:0;padding-top:4px}
ol.top10 li::before{content:counter(t);font:600 20px/1 "IBM Plex Serif",serif;color:var(--accent);padding-top:2px}
.t10t{font-weight:600;margin-bottom:3px}
.t10d{color:var(--ink2);font-size:14px}
.why{font-size:13px;color:var(--ink);background:var(--soft);border-radius:6px;padding:5px 8px;margin-top:6px}
.why b{color:var(--ink2);font-weight:600}
.src{font-size:12.5px;color:var(--ink3);margin-top:5px}
.src a{margin-right:8px}
.sechead{border-left:4px solid var(--br);padding-left:12px}
.sec-intl .sechead{border-color:var(--intl)}.sec-emp .sechead{border-color:var(--emp)}
.themes-nav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.themes-nav a{font-size:12.5px;background:var(--soft);color:var(--chipink);padding:4px 10px;border-radius:999px}
.themes-nav a b{font-weight:600;margin-left:4px;color:var(--ink3)}
.theme{scroll-margin-top:12px}
.theme .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.theme .cnt{font-size:12px;color:var(--ink3)}
.tsum{font-size:14px;color:var(--ink2);margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.items{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.card .ct{font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
.card .ct:hover{color:var(--brand2)}
.card .cd{font-size:13.5px;color:var(--ink2)}
.card .cm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3);margin-top:auto;padding-top:4px}
.tag{background:var(--chip);color:var(--chipink);border-radius:4px;padding:1px 6px;font-weight:500}
.est{color:var(--warn)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:1px 6px}
.empty{color:var(--ink3);font-size:13.5px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600}
td.d{white-space:nowrap;font-weight:600}
.st{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.st.c{color:var(--ok);background:var(--okbg)}.st.e{color:var(--warn);background:var(--warnbg)}.st.r{color:var(--ink2);background:var(--chip)}
.tbl{overflow-x:auto}
.daysep td{background:var(--chip);font-weight:600;color:var(--ink2);font-size:12.5px}
.log li{margin-bottom:4px;font-size:13.5px}
.okc{color:var(--ok);font-weight:600}.wc{color:var(--warn);font-weight:600}
.hidden{display:none!important}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:10px 16px 30px}
.note{font-size:12.5px;color:var(--ink3)}
mark{background:#ffe58f;color:#111;border-radius:2px}
.gsec{display:grid;gap:14px}
.gblk h3{font:600 14px/1.3 "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2);margin:0 0 4px}
.gblk p{margin:0}
a.t10t{display:block;font-weight:600;margin-bottom:3px;color:var(--ink)}
a.t10t:hover{color:var(--brand2)}
.intro{margin:0 0 12px;font-weight:500}
.tsums p{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--p4);color:var(--ink)}
.tsums p:last-child{margin-bottom:0}
.tsums a{color:var(--ink)}.tsums a b{color:var(--brand2)}
.ag{display:grid;gap:10px}
.agwrap .ag{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.agh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--brand2);border-bottom:2px solid var(--p5);padding-bottom:3px;margin-bottom:4px}
.agr{display:grid;grid-template-columns:48px 44px 1fr 10px;gap:8px;align-items:baseline;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.agr:last-child{border-bottom:0}
.agt{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12.5px}
.agg{font-size:11px;font-weight:600;color:var(--chipink);background:var(--chip);border-radius:4px;padding:0 5px;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;align-self:center}
.dot.r{background:var(--p3);border:1px solid var(--ink3)}.dot.c{background:var(--p1)}.dot.e{background:var(--p5)}
:root[data-theme="dark"] .dot.c{background:var(--p2)}
.aglg{margin-top:10px}.aglg .dot{margin:0 3px 0 8px}.aglg .dot:first-child{margin-left:0}
.sumbox{position:relative}
.tog{position:absolute;top:14px;right:16px;background:var(--soft);color:var(--brand2);border:1px solid var(--line);border-radius:6px;font:500 12px "IBM Plex Sans",sans-serif;padding:3px 9px;cursor:pointer}
.sumbox.collapsed .gsec,.sumbox.collapsed .intro,.sumbox.collapsed .tsums{display:none}
.sumbox.collapsed h2{margin-bottom:0}
.sumbox .kicker{padding-right:150px}
.agdest{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.agdest li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.fl{font-size:18px;line-height:1.2}
.agnx{margin:10px 0 0}
.agc{margin-bottom:16px}
.agcn{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.agcn .fl{font-size:22px}
table.cal{table-layout:fixed;min-width:760px;border:1px solid var(--p1)}
table.cal th{background:var(--p1);color:#fff;text-align:center;font-size:12px;text-transform:none;letter-spacing:0;padding:4px;border-right:1px solid #ffffff40}
table.cal th span{display:block;font-weight:400;font-size:11px;color:var(--p2)}
table.cal td{border-right:1px solid var(--line);padding:4px 6px;height:58px;vertical-align:top}
.ce{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3;padding:2px 4px;border-radius:3px}
.ce .cn em{display:block;font-style:italic;color:var(--ink3);font-size:11px}
.ce .ch{white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.ce.hl{background:var(--p4);font-weight:600;color:#3a1400}
.ce.hl .ch,.ce.hl em{color:#5a2200}
.hlk{display:inline-block;width:12px;height:10px;background:var(--p4);border-radius:2px;margin-right:4px;vertical-align:middle}
.agtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dl{background:var(--p1);color:#fff;border:0;border-radius:6px;font:500 12.5px "IBM Plex Sans",sans-serif;padding:6px 12px;cursor:pointer}
.dl:hover{filter:brightness(1.1)}
.agx{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:18px 22px}
@media (max-width:600px){.agx{grid-template-columns:1fr}}
.agc{margin:0}
table.cal{table-layout:auto;min-width:0;border:0;width:100%;font-size:12.5px}
table.cal th{background:none;color:var(--ink3);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px;border:0;border-bottom:1.5px solid var(--p1)}
table.cal th.n,table.cal td.n{text-align:right;white-space:nowrap}
table.cal td{border:0;border-bottom:1px solid var(--line);padding:4px 6px;height:auto;vertical-align:baseline}
table.cal td.cd{white-space:nowrap;color:var(--ink2);font-weight:500}
table.cal td.ct2{white-space:nowrap;color:var(--ink3);font-variant-numeric:tabular-nums}
table.cal td.at{font-weight:600;color:var(--ink)}
table.cal tr.hi td{background:rgba(250,181,143,.22)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p5);margin-right:6px;vertical-align:middle}
@media (max-width:600px){table.cal td.ct2,table.cal th:nth-child(2){display:none}}
.pngbox{position:fixed;left:-10000px;top:0;padding:0;background:var(--panel);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.pngbox .agx{grid-template-columns:1fr 1fr}
.pnghead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--p1);padding-bottom:10px;margin-bottom:14px}
.pngk{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.pngt{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;color:var(--p1)}
.pngb{font-size:12px;color:var(--ink3)}
.pngbox .agdest{margin-bottom:16px}
.mtx{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.mtx thead th{background:var(--p1);color:#fff;text-align:left;font-size:11px;text-transform:none;letter-spacing:0;padding:4px 6px;font-weight:600}
.mtx thead th span{font-weight:400;color:var(--p2);margin-left:2px}
.mtx th.pc{width:46px;text-align:center}
.mtx tbody th.pc{background:var(--soft);color:var(--ink3);text-transform:none;letter-spacing:0;font-size:10px;font-weight:600;vertical-align:middle;padding:2px;border-bottom:1px solid var(--line);text-align:center}
.mtx tbody th.pc .fl{display:block;font-size:16px;line-height:1}
.mtx td{vertical-align:top;padding:2px 3px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.mx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:6px;padding:1px 4px;border-radius:3px;margin-bottom:1px;line-height:1.25}
.mx:last-child{margin-bottom:0}
.mx.hi{background:rgba(250,181,143,.28)}
.mxh{color:var(--ink3);font-size:11px}
.mxv{font-size:11px;white-space:nowrap;margin-left:auto}.mxv b{color:var(--ink)}
.vs{color:var(--ink3)}
.pngbox{width:1600px;padding:0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Painel de Notícias <span>| Henrique Behrens</span></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar notícias…" aria-label="Buscar">
        <select id="fv" aria-label="Filtrar por veículo"><option value="">Todos os veículos</option></select>
        <button id="theme" title="Alternar tema">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>Painel gerado automaticamente a partir de páginas públicas, sem login. Resumos de notícias baseados em título, linha-fina e descrição pública de cada matéria. Horários em BRT (UTC−3); “≈” indica horário estimado a partir de indicação relativa (“há 2 horas”).</footer>

<script>
const BASE={v:'https://valor.globo.com',og:'https://oglobo.globo.com',f:'https://www1.folha.uol.com.br',fc:'https://c-level.folha.uol.com.br',p:'https://www.poder360.com.br',c:'https://www.cnnbrasil.com.br',m:'https://www.metropoles.com',e:'https://www.estadao.com.br',vj:'https://veja.abril.com.br',bj:'https://braziljournal.com',r:'https://www.reuters.com',ft:'https://www.ft.com/content/',fgv:'https://portalibre.fgv.br',bcb:'https://www.bcb.gov.br'};
const VNAME={v:'Valor',og:'O Globo',f:'Folha',fc:'Folha',p:'Poder360',c:'CNN Brasil',m:'Metrópoles',e:'Estadão',vj:'Veja',bj:'Brazil Journal',r:'Reuters',ft:'Financial Times',fgv:'FGV IBRE',bcb:'BCB',fed:'Federal Reserve',boj:'BoJ',ibge:'IBGE'};
function U(s){const i=s.indexOf(':');const k=s.slice(0,i);if(k==='https')return s;return (BASE[k]||'')+s.slice(i+1)}
function S(k){return VNAME[k]||k}

const DATA={"meta": {"edicao": "Terça-feira, 3 de novembro de 2026", "gerado": "03/11/2026 ≈06h40 (execução agendada)", "janela": "02/11 12h00 → 03/11 06h00 (18h)"}, "geral": [{"h": "Política: Lula negocia o Centrão e a PEC da Segurança chega ao Senado", "p": "Lula negocia com Hugo Motta e Davi Alcolumbre o espaço do Centrão nos ministérios (Valor), e Edinho Silva conduz as conversas com Republicanos e MDB. Segundo o Painel da Folha, o presidente não fará gesto ao mercado: o nome da Fazenda sai junto com o restante da equipe. Rafael Fonteles, cotado para a pasta, publicou “Viva o equilíbrio fiscal”. O Senado pode votar hoje a PEC da Segurança; o Planalto tenta tirar a redução da maioridade penal, e Lula condiciona o novo ministério à aprovação. Na sucessão do Congresso, o PL lança Rogério Marinho contra Alcolumbre, com apoio do Novo, e Tereza Cristina se apresenta como terceira via. Partidos que apoiaram Flávio elegeram 286 deputados, contra 124 dos aliados de Lula (Metrópoles). No caso Flávio, Fachin deve negar o pedido para afastar Moraes, e a PF apura o voo que teria levado a família à fronteira."}, {"h": "Mercado doméstico: Copom começa sob pressão e o fantasma do “tabelamento”", "p": "Com a B3 fechada no feriado de Finados, o último pregão foi o de sexta: o Ibovespa caiu 0,75%, a 167.922 pontos, depois de uma das piores semanas da história, e o dólar fechou em R$ 5,4385 (PTAX de R$ 5,4212). O Copom começa hoje e decide amanhã, com a Selic em 13,75%. Folha e Valor relatam maioria por manutenção, enquanto o Estadão descreve um mercado dividido entre pausa e corte de 0,25 ponto (divergência). Pesam o câmbio, o prêmio de risco pós-eleição e o temor sobre o perfil da diretoria do BC, já que Lula indicará seis diretores até 2027. A proposta de André Lara Resende, de um conselho para levar a Selic a 7,5% em 12 meses, ganhou o apoio de Gabrielli, Gleisi e parte do PT; Durigan, Mercadante e Edinho Silva se distanciaram. Leitura analítica: enquanto a Fazenda não tem nome, as propostas heterodoxas ocupam o vácuo e encarecem o prêmio de risco."}, {"h": "Fiscal, tributário e inflação: Imposto Seletivo só em fevereiro e reforma com pendências", "p": "O governo deve editar a MP do Imposto Seletivo com cobrança só a partir de fevereiro, para manter em 2027 a carga hoje cobrada via IPI (O Globo). A dois meses da “virada de chave” da reforma tributária, o Valor lista pendências: a alíquota da CBS ainda depende do Senado e do TCU, e o Seletivo não foi regulamentado. Gabrielli, coordenador do programa de governo, vê quadro fiscal “menos dramático”, enquanto economistas veem na proposta de Lara Resende risco para a inflação e o juro longo, e um ex-ministro da Fazenda fala em dólar a R$ 6 ou R$ 7. Editoriais pedem revisão do Bolsa Família e criticam o tamanho do novo IVA. O fim das bets, debatido hoje no STF, reduz os recursos da PEC da Segurança (Folha). O IPCA de 12 meses está em 4,58% (set, BCB), e o de outubro sai em 12/11."}, {"h": "Internacional: os EUA votam hoje, e a Suprema Corte contraria Trump", "p": "Os americanos renovam hoje a Câmara, um terço do Senado e governos estaduais. Os democratas são favoritos na Câmara, com ganho projetado de 12 a 25 cadeiras (Folha), e precisam virar quatro cadeiras no Senado. A inflação e a gasolina perto do recorde pesam contra Trump (pesquisa do FT). A Suprema Corte negou o pedido do governo para separar votos na Califórnia; as decisões sobre a triagem de eleitores estrangeiros são relatadas de forma divergente por CNN, NYT e Bloomberg. Trump encerrou a campanha prometendo US$ 5.000 por adulto e admitiu indultos preventivos. Nos dados, o ISM industrial subiu a 55,5 (consenso de 54,5), com preços em 75,2, e os gastos com construção caíram 1,9%; JOLTS sai hoje e o payroll, na sexta (consenso de 63 mil). Fora dos EUA, a Austrália subiu os juros a 4,85%, e o BoE deve elevar os seus a 4,00% na quinta."}, {"h": "Geopolítica e empresas: ataque a Qeshm, petróleo em queda e a conta da IA", "p": "Na véspera da eleição, os EUA atacaram a ilha iraniana de Qeshm, em Ormuz, num ato que Washington chama de defensivo contra um possível uso de mísseis terra-ar. O ataque veio horas depois de sinais de avanço diplomático: o Irã ofereceu reabrir Ormuz em dois dias, e Khamenei deu aval às conversas, mas a rodada de Doha terminou sem acordo. O Brent caiu 6,1% na segunda e sobe ≈1,5% nesta manhã. Na Ucrânia, a Rússia atacou a rede elétrica, e Kiev atingiu uma refinaria em Yaroslavl. Nas empresas, a Marvell compra a Lumentum por US$ 115 bi, a Apple bateu as projeções mas alertou para os custos de memória, a Palantir dobrou o lucro, a Anthropic revelou US$ 900 bi em compromissos de IA antes do IPO e a Disney prepara milhares de demissões (Bloomberg). No cripto, o ataque ao Mercado Bitcoin tem valores divergentes (US$ 11 mi × US$ 40 mi)."}, {"h": "Fechamento dos mercados (Américas e Europa em 02/11; Ásia em 03/11; B3 em 30/10)", "p": "Bolsas: Ibovespa 167.922 pts (−0,75%, em 30/10; a B3 fechou em 02/11, Finados); S&P 500 7.541,40 (−0,51%); Nasdaq 25.164,31 (−1,07%); Dow Jones 51.983,98 (+0,41%); Stoxx 600 649,44 (+0,42%); DAX 25.981,09 (+0,63%); FTSE 100 10.761,33 (+0,29%). Ásia: Nikkei 63.081,86 (−0,33%, em 02/11; Tóquio fechou em 03/11, Dia da Cultura); em 03/11, Hang Seng 23.503,00 (+0,47%) e Xangai 3.608,10 (−0,82%). Juros de 10 anos: Brasil 15,415% (−6 bps, em 30/10); EUA 4,894% (−3,5 bps ante sexta) e 2 anos 4,598% (+1,7 bp); Alemanha 3,291% (−2,8 bps); Reino Unido 5,196% (−9,5 bps); Japão 2,767% (−0,9 bp, em 02/11); China 1,611% (−2,4 bps, em 03/11). Moedas: USD/BRL 5,4375 (−0,02%, em 02/11, com o mercado local fechado; em 30/10, 5,4385, +1,08%, e PTAX de 5,4212); DXY 101,75 (−0,13%); EUR/USD 1,1187 (+0,27%); USD/JPY 157,95 (+0,17%); USD/CNY 6,6483 (−0,09%). Commodities: Brent US$ 104,77 (−6,09%; ≈−11% desde o fechamento de sexta, de 117,64); WTI US$ 96,46 (−5,70%); ouro US$ 3.969,60 (+1,61%); cobre US$ 6,5675/lb (+0,85%); soja 1.216,75 cents/bu (−1,42%); minério 62% US$ 91,25/t (+0,60%). Nesta manhã (≈06h), o Brent sobe a ≈US$ 106,35 (+1,5%) e o cobre cai ≈3,7% (Investing)."}], "top10": [{"t": "EUA vão às urnas nas midterms com o controle do Congresso em jogo", "d": "Os americanos renovam a Câmara, um terço do Senado e governos estaduais. Os democratas são favoritos na Câmara e precisam virar quatro cadeiras no Senado; a inflação e a gasolina pesam contra Trump.", "w": "Uma derrota republicana limita a agenda de Trump (tarifas, cortes e indultos), afeta o dólar e o fluxo para emergentes e pode ampliar a pressão sobre temas ligados ao Brasil.", "s": [["r", "r:/world/us/trump-faces-midterm-verdict-with-control-congress-stake-2026-11-03/"], ["f", "f:/mundo/2026/11/favoritismo-democrata-nos-eua-aproxima-hakeem-jeffries-do-comando-da-camara-e-de-embate-com-trump.shtml"], ["ft", "ft:5ed63d08-66f3-4ad3-9ec7-2ec8b590fc85"]]}, {"t": "EUA atacam a ilha iraniana de Qeshm na véspera da eleição", "d": "Washington descreve a ação como defensiva, contra um possível uso de mísseis terra-ar. O ataque veio horas depois de sinais de avanço diplomático, e a rodada de Doha terminou sem acordo.", "w": "O ataque reabre o risco em Ormuz justamente quando o petróleo recuava com a diplomacia, e mexe com inflação, juros e o câmbio de importadores de energia.", "s": [["ft", "ft:ebeaca62-8958-459a-be9d-d3d39e441a53"], ["WSJ", "https://www.wsj.com/world/middle-east/u-s-strikes-irans-qeshm-island-as-trump-talks-down-war-risks-79d73d3d"], ["r", "r:/world/middle-east/us-struck-irans-qeshm-island-wall-street-journal-reports-2026-11-03/"], ["p", "p:/poder-internacional/eua-atacam-a-ilha-iraniana-de-qeshm-no-estreito-de-ormuz/"]]}, {"t": "Copom começa hoje sob pressão do câmbio e do risco pós-eleição", "d": "Com a Selic em 13,75%, Folha e Valor relatam maioria por manutenção, enquanto o Estadão vê um mercado dividido entre pausa e corte de 0,25 ponto. A decisão sai amanhã, às 18h30.", "w": "Uma pausa encerraria o ciclo de cortes; um corte em meio à piora das expectativas poderia ser lido como leniência, num momento de pressão política sobre o BC.", "s": [["f", "f:/mercado/2026/11/piora-na-percepcao-de-risco-pos-eleicao-pressiona-bc-a-interromper-ciclo-de-cortes-de-juros.shtml"], ["e", "e:/economia/corte-manutencao-selic-mercado-dividido-copom/"], ["v", "v:/impresso/noticia/2026/11/03/mercado-aposta-que-taxa-selic-pare-de-cair-e-teme-solucoes-heterodoxas-na-economia.ghtml"]]}, {"t": "Proposta de Lara Resende para os juros racha o PT e assusta o mercado", "d": "O economista propõe um conselho para levar a Selic a 7,5% em 12 meses. Gabrielli, Gleisi e parte do PT apoiam; Durigan, Mercadante e Edinho Silva se distanciam, e economistas veem risco para a inflação e o câmbio.", "w": "O sinal sobre quem dará o tom da política econômica no Lula 4 está em disputa, e o mercado precifica o risco de intervenção na autonomia do BC.", "s": [["p", "p:/poder-economia/andre-lara-resende-quer-conselho-para-levar-selic-a-75/"], ["v", "v:/brasil/noticia/2026/11/03/proposta-de-lara-resende-e-ameaca-para-inflacao-e-juro-de-longo-prazo-dizem-economistas.ghtml"], ["m", "m:/colunas/matheus-leitao/nunca-defendi-tabelamento-de-juros-diz-aloizio-mercadante-sobre-lara"]]}, {"t": "Senado pode votar hoje a PEC da Segurança, com impasse sobre a maioridade penal", "d": "Governistas querem votar os dois turnos no mesmo dia. O Planalto tenta retirar a redução da maioridade, e Lula condiciona a criação do Ministério da Segurança, que herdaria PF e PRF, à aprovação.", "w": "É o primeiro grande teste da base de Lula no Congresso pós-eleição e define o desenho do novo ministério.", "s": [["c", "c:/politica/senado-inicia-hoje-debate-da-pec-da-seguranca-com-impasse-sobre-maioridade/"], ["og", "og:/politica/noticia/2026/11/03/lula-condiciona-criacao-do-ministerio-da-seguranca-a-aprovacao-da-pec-no-congresso-e-orcamento-da-pasta-ainda-e-duvida.ghtml"], ["m", "m:/colunas/milena-teixeira/planalto-entra-em-campo-e-quer-maioridade-penal-de-fora-da-pec-da-seguranca"]]}, {"t": "Lula negocia o Centrão nos ministérios e não antecipa o nome da Fazenda", "d": "Lula discute com Motta e Alcolumbre o espaço dos aliados, e Edinho Silva conversa com Republicanos e MDB. O nome da Fazenda sai com o resto da equipe; Fonteles, cotado, acena com o equilíbrio fiscal.", "w": "A composição define a governabilidade diante de uma Câmara em que os aliados de Flávio elegeram 286 deputados, e a escolha da Fazenda é o principal vetor de prêmio de risco.", "s": [["v", "v:/impresso/noticia/2026/11/03/lula-avalia-naco-do-centrao-nos-ministerios.ghtml"], ["f", "f:/colunas/painel/2026/11/lula-rejeita-fazer-gesto-ao-mercado-e-antecipar-nome-para-fazenda.shtml"], ["m", "m:/brasil/partidos-que-apoiaram-flavio-elegem-286-deputados-lula-124"]]}, {"t": "PL lança Marinho contra Alcolumbre na disputa pelo comando do Senado", "d": "O PL pressiona senadores a abrir o voto, o Novo apoia Marinho e Tereza Cristina mantém candidatura como terceira via. Na Câmara, o PL discute apoiar Hugo Motta.", "w": "A presidência do Senado controla a pauta de indicações e reformas; uma derrota de Alcolumbre mudaria a relação do Planalto com a Casa.", "s": [["og", "og:/politica/noticia/2026/11/03/pl-avanca-por-marinho-a-frente-do-senado-e-pressiona-parlamentares-a-abrir-voto-para-reduzir-base-de-alcolumbre.ghtml"], ["f", "f:/colunas/painel/2026/11/marinho-tera-apoio-do-novo-em-lancamento-para-presidente-do-senado-e-busca-outros-partidos.shtml"], ["c", "c:/blogs/caio-junqueira/politica/tereza-cristina-mantem-candidatura-e-vira-3a-via-ao-comando-do-senado/"]]}, {"t": "Suprema Corte dos EUA rejeita pedido de Trump sobre votos na Califórnia", "d": "O governo queria separar ≈20 mil cédulas de supostos não cidadãos. É mais um revés judicial às tentativas de Trump de influir na eleição.", "w": "O resultado reduz o espaço para contestação e sinaliza limites institucionais caso Trump questione o resultado.", "s": [["ft", "ft:b3619ebb-01cc-4458-bc77-b04e5b16b658"], ["NYT", "https://www.nytimes.com/2026/11/02/us/politics/trump-supreme-court-california-ballots.html"], ["c", "c:/internacional/suprema-corte-rejeita-tentativa-de-trump-de-separar-votos-na-california/"]]}, {"t": "Petróleo despenca ≈6% com a diplomacia entre EUA e Irã e volta a subir após Qeshm", "d": "O Brent fechou a segunda em US$ 104,77 (−6,09%), ≈11% abaixo de sexta, e sobe ≈1,5% nesta manhã.", "w": "A volatilidade do petróleo afeta diretamente a inflação, a defasagem dos combustíveis da Petrobras e a decisão dos bancos centrais.", "s": [["v", "v:/financas/noticia/2026/11/02/petrleo-cai-4-pontos-percentuais-com-expectativas-de-avano-diplomtico-entre-eua-e-ir.ghtml"], ["ft", "ft:d7fe99f8-d292-4cb5-a8fd-45be0f8cc2b3"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-02/latest-oil-market-news-and-analysis-for-nov-3"]]}, {"t": "Marvell compra a Lumentum por US$ 115 bi; Apple e Anthropic expõem a conta da IA", "d": "A Marvell aposta em componentes para data centers. A Apple bateu as projeções, mas alertou para custos de memória “sem precedentes”, e o prospecto da Anthropic revela US$ 900 bi em compromissos com IA.", "w": "Os números alimentam o debate sobre o retorno do ciclo de investimentos em IA, que tem derrubado as techs e pressionado o mercado de crédito.", "s": [["ft", "ft:92322fad-f293-48b8-a14b-00506d78eb3b"], ["ft", "ft:f6ad8c32-cacb-48ad-ad85-a9a7edac3f16"], ["ft", "ft:4d91dbab-6fe4-45ab-beee-d77e091cb37f"]]}], "secoes": [{"id": "brasil", "nome": "Brasil", "cls": "sec-br", "resumo": "Com a B3 fechada no feriado de Finados, o noticiário brasileiro das últimas 18 horas girou em torno de três eixos: a montagem política do quarto governo Lula, a véspera do Copom e a ofensiva heterodoxa em torno da proposta de André Lara Resende para os juros. Lula negocia com Hugo Motta e Davi Alcolumbre o espaço do Centrão nos ministérios e, segundo o Painel da Folha, não vai antecipar o nome da Fazenda; Rafael Fonteles, cotado para a pasta, fez acenos ao equilíbrio fiscal. O Senado pode votar hoje a PEC da Segurança, com impasse sobre a maioridade penal, enquanto PL e Novo lançam Rogério Marinho contra Alcolumbre. No campo econômico, o mercado vê o fim do ciclo de cortes da Selic, e as críticas à proposta de Lara Resende crescem dentro e fora do governo.", "temas": [{"n": "Destaques", "r": "A articulação de Lula com o Centrão, a votação da PEC da Segurança no Senado, a pressão sobre o Copom, a proposta de Lara Resende para os juros e a disputa pela presidência do Senado concentram as atenções.", "i": [["≈05h10", "v", "Lula avalia naco do Centrão nos ministérios", "Presidente negocia apoio com Hugo Motta e Davi Alcolumbre e discute a acomodação de aliados no quarto mandato.", "v:/impresso/noticia/2026/11/03/lula-avalia-naco-do-centrao-nos-ministerios.ghtml"], ["03h15", "c", "Senado inicia hoje análise da PEC da Segurança com impasse sobre maioridade", "Governistas querem votar os dois turnos no mesmo dia para evitar que o texto volte à Câmara.", "c:/politica/senado-inicia-hoje-debate-da-pec-da-seguranca-com-impasse-sobre-maioridade/"], ["23h00 (02/11)", "f", "Piora na percepção de risco pós-eleição pressiona BC a interromper ciclo de cortes de juros", "Economistas projetam que o Copom manterá a Selic parada nesta quarta (4).", "f:/mercado/2026/11/piora-na-percepcao-de-risco-pos-eleicao-pressiona-bc-a-interromper-ciclo-de-cortes-de-juros.shtml"], ["14h46 (02/11)", "p", "André Lara Resende quer conselho para levar Selic a 7,5%", "Proposta prevê que o BC leve a taxa básica a esse nível em 12 meses; ideia divide PT e governo.", "p:/poder-economia/andre-lara-resende-quer-conselho-para-levar-selic-a-75/"], ["≈05h50", "og", "PL avança por Marinho à frente do Senado e pressiona parlamentares a abrir voto", "Bolsonaristas tentam reduzir a base de Davi Alcolumbre na disputa pela presidência da Casa.", "og:/politica/noticia/2026/11/03/pl-avanca-por-marinho-a-frente-do-senado-e-pressiona-parlamentares-a-abrir-voto-para-reduzir-base-de-alcolumbre.ghtml"]]}, {"n": "Política e Congresso", "r": "Lula negocia ministérios com Motta e Alcolumbre, e Edinho Silva conduz as conversas com Republicanos e MDB; o presidente rejeita antecipar o nome da Fazenda. A PEC da Segurança chega ao plenário do Senado com o Planalto tentando tirar a redução da maioridade penal, e Lula condiciona a criação do Ministério da Segurança (que herdaria PF e PRF) à aprovação. Na sucessão do Congresso, o PL avança com Marinho contra Alcolumbre, com apoio do Novo; Tereza Cristina se apresenta como terceira via, e o PL discute apoiar Hugo Motta na Câmara. Um levantamento do Metrópoles mostra que partidos aliados de Flávio elegeram 286 deputados, contra 124 dos aliados de Lula. No caso Flávio, a PF apura o voo que teria levado a família à fronteira, e lideranças evangélicas se afastam do bolsonarismo. Leitura analítica: a governabilidade dependerá do preço cobrado pelo Centrão.", "i": [["06h00", "vj", "Negociações por base consistente e pronunciamento devem marcar semana de Lula", "Agenda da semana combina articulação com o Centrão e fala do presidente.", "vj:/politica/negociacoes-por-base-consistente-e-pronunciamento-devem-marcar-semana-de-lula/"], ["≈05h50", "og", "PL avança por Marinho à frente do Senado e pressiona parlamentares a abrir voto", "Objetivo é reduzir a base de Alcolumbre, que busca a reeleição.", "og:/politica/noticia/2026/11/03/pl-avanca-por-marinho-a-frente-do-senado-e-pressiona-parlamentares-a-abrir-voto-para-reduzir-base-de-alcolumbre.ghtml"], ["≈05h55", "og", "A articulação para filiar Michelle Bolsonaro ao Republicanos", "Nota de Lauro Jardim.", "og:/blogs/lauro-jardim/post/2026/11/a-articulacao-para-filiar-michelle-bolsonaro-ao-republicanos.ghtml"], ["05h30", "m", "Planalto entra em campo e quer maioridade penal fora da PEC da Segurança", "José Guimarães acionou lideranças para garantir votos e aprovar a PEC sem a redução.", "m:/colunas/milena-teixeira/planalto-entra-em-campo-e-quer-maioridade-penal-de-fora-da-pec-da-seguranca"], ["05h30", "e", "Planalto aposta na aprovação da PEC da Segurança, mas redução da maioridade penal sobe no telhado", "Coluna do Estadão: proposta que Lula defendeu a dois dias do 2º turno perde força.", "e:/politica/coluna-do-estadao/reducao-da-maioridade-penal-que-lula-defendeu-a-dois-dias-do-2-turno-sobe-no-telhado/"], ["05h30", "e", "Maioridade penal e polícia municipal: o que prevê a PEC da Segurança", "Texto pode ser votado no Senado nesta terça.", "e:/brasil/maioridade-penal-e-policia-municipal-o-que-preve-a-pec-da-seguranca-que-pode-ser-votada-no-senado/"], ["≈05h10", "v", "Lula avalia naco do Centrão nos ministérios", "Negociação com Hugo Motta e Davi Alcolumbre.", "v:/impresso/noticia/2026/11/03/lula-avalia-naco-do-centrao-nos-ministerios.ghtml"], ["≈05h10", "v", "Discutida há anos, reforma eleitoral esbarra em divergências", "Câmara articula adotar o voto distrital misto; efeito sobre cada grupo ainda é incerto.", "v:/politica/noticia/2026/11/03/discutida-ha-anos-reforma-eleitoral-esbarra-em-divergencias.ghtml"], ["05h00", "c", "Voto distrital misto empodera presidentes de partidos, diz especialista", "João Henrique Hummel avalia que o modelo concentra poder nas lideranças.", "c:/politica/voto-distrital-misto-empodera-presidentes-de-partidos-diz-especialista/"], ["04h30", "m", "Voto distrital misto: texto deve frear puxadores de voto como Nikolas", "Proposta muda a eleição de deputados.", "m:/brasil/voto-distrital-misto-texto-deve-frear-puxadores-de-voto-como-nikolas"], ["04h30", "m", "Senado põe PEC da Segurança na pauta em meio a debate sobre maioridade", "Oposição deve insistir na redução da idade penal para crimes hediondos.", "m:/brasil/senado-poe-pec-da-seguranca-na-pauta-em-meio-a-debate-sobre-maioridade"], ["≈04h10", "og", "Lula condiciona criação do Ministério da Segurança à aprovação da PEC", "Orçamento da pasta ainda é dúvida; votação está marcada para esta terça.", "og:/politica/noticia/2026/11/03/lula-condiciona-criacao-do-ministerio-da-seguranca-a-aprovacao-da-pec-n s divulgações do FGV IBRE.", "fgv:/"], ["—", "ibge", "05/11 · 09h · Produção industrial de setembro", "Anterior: −0,6% m/m e −1,2% a/a (IBGE/Investing).", "https://www.ibge.gov.br/calendario/conjunturais.html"], ["—", "Investing", "06/11 · 15h · Balança comercial de outubro", "Anterior: US$ 7,74 bi.", "https://br.investing.com/economic-calendar/"]]}]}, {"id": "intl", "nome": "Internacional", "cls": "sec-intl", "resumo": "O exterior chega ao dia das midterms americanas com dois vetores de risco: a urna e o Golfo. Os EUA votam hoje com pesquisas favoráveis aos democratas na Câmara, a Suprema Corte negou o pedido de Trump para separar votos na Califórnia, e Trump encerrou a campanha prometendo cheques e indultos. Na véspera, forças americanas atacaram a ilha iraniana de Qeshm, num ato descrito como defensivo, horas depois de sinais de avanço diplomático que derrubaram o petróleo em ≈6%. A Rússia lançou ataque maciço contra a rede elétrica ucraniana, e Kiev atingiu uma refinaria em Yaroslavl. Na economia global, a Austrália elevou os juros ao maior nível em 18 anos e o BoE deve subir os juros na quinta.", "temas": [{"n": "Guerra e Conflitos", "r": "Os EUA atacaram a ilha de Qeshm, no Estreito de Ormuz; segundo autoridades, para conter um possível uso de mísseis terra-ar. O ataque veio em meio a negociações: o Irã ofereceu reabrir Ormuz em dois dias se os EUA aceitarem suas exigências, Khamenei deu aval às conversas, mas a rodada de Doha terminou sem avanço e a Reuters vê acordo distante. Os Emirados preparam rotas alternativas de exportação. Na Ucrânia, a Rússia atacou a rede elétrica e um bombardeio matou 26 em Zaporizhzhia; Kiev atingiu a refinaria de Yaroslavl. O número de drones derrubados diverge (493 no Estadão, 856 na Reuters).", "i": [["03h55", "e", "EUA atacam ilha iraniana de Qeshm em meio a negociações com Teerã", "Ataque relatado pelo WSJ, em plena negociação.", "e:/internacional/eua-atacam-ilha-iraniana-de-qeshm-em-meio-a-negociacoes-com-teera-diz-jornal-np const $=s=>document.querySelector(s);

function card(it,sec,tema){
  const [h,v,t,d,u]=it;
  const est=h.startsWith('≈')||h==='—';
  return `<article class="card" data-v="${v}" data-s="${esc((t+' '+d.replace(/<[^>]+>/g,'')).toLowerCase())}">
  <a class="ct" href="${esc(U(u))}" target="_blank" rel="noopener">${esc(t)}</a>
  ${d?`<div class="cd">${d}</div>`:''}
  <div class="cm"><span class="tag">${esc(S(v))}</span><span class="${est?'est':''}">${esc(h)}</span></div></article>`;
}
function countAll(){let n=0;DATA.secoes.forEach(s=>s.temas.forEach(t=>n+=t.i.length));return n}
function srcLinks(arr){return arr.map(([v,u])=>`<a href="${esc(U(u))}" target="_blank" rel="noopener">${esc(S(v))}</a>`).join('')}

}
function agendaGrid(){
  const D=DATA.agenda.dias;

    const v=at?`<b>${esc(at)}</b>${co?` <span class="vs">vs ${esc(co)}</span>`:''}`:(co||an?`<span class="vs">${co?'cons. '+esc(co):''}${co&&an?' · ':''}${an?'ant. '+esc(an):''}</span>`:'');
    return `<div class="mx${imp>=3?' hi':''}"><span class="mxt">${imp>=3?'<span class="imp"></span>':''}${h&&h!=='—'?`<span class="mxh">${esc(h)}</span> `:''}${esc(n)}</span>${v?`<span class="mxv">${v}</span>`:''}</div>`}).join('');
  return `<div class="tbl"><table class="mtx"><thead><tr><th class="pc"></th>${D.map(([d,n])=>`<th>${d} <span>${n}</span></th>`).join('')}</tr></thead><tbody>${DATA.agenda.paises.map(p=>`<tr><th class="pc" title="${esc(p.n)}"><span class="fl">${p.f}</span><span class="pn">(${esc(p.c)})</span></th>${D.map(([d])=>`<td>${cell(p,d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>

}

async function dlPNG(btn){
  const old=btn.textContent;btn.textContent='Gerando…';btn.disabled=true;
  const box=document.createElement('div');box.className='pngbox';
  const g=document.createElement('div');g.innerHTML=agendaGrid();box.appendChild(g.querySelector('table.mtx'));
  document.body.appendChild(box);
  try{await loadH2C();const bg=getComputedStyle(document.body).backgroundColor;
    const c=await html2canvas(box.firstElementChild,{scale:2,backgroundColor:getComputedStyle(document.querySelector('.panel')||document.body).backgroundColor||'#fff',useCORS:true,logging:false});
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='calendario_semana_'+DATA.agenda.semana.replace(/[^0-9a-z]+/gi,'_')+'.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert(e.message)}finally{box.remove();btn.textContent=old;btn.disabled=false}
}

  return `<section class="panel summary sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><p class="kicker">Resumo global do noticiário · ${esc(DATA.meta.edicao)}</p><h2>O dia em perspectiva</h2><div class="gsec">${DATA.geral.map(g=>`<div class="gblk"><h3>${esc(g.h)}</h3><p>${esc(g.p)}</p></div>`).join('')}</div></section>
  <div class="grid2">
  <section class="panel"><p class="kicker">Top 10 do dia</p><ol class="top10">${DATA.top10.map(x=>`<li><div><a class="t10t" href="${esc(U(x.s[0][1]))}" target="_blank" rel="noopener">${esc(x.t)} ↗</a><div class="t10d">${esc(x.d)}</div><div class="why"><b>Por que importa:</b> ${esc(x.w)}</div><div class="src">${srcLinks(x.s)}</div></div></li>`).join('')}</ol></section>
  <section class="panel"><div class="agtop"><div><p class="kicker">Calendário da semana · ${esc(DATA.agenda.semana)}</p><h2>Destaques</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}<p class="note" style="margin-top:8px">Calendário completo por país na aba “Agenda da Semana”.</p></section>
  </div>
  <section class="panel"><p class="kicker">Log de coleta</p><ul class="log">${DATA.log.map(([s,f,t])=>`<li><span class="${s==='ok'?'okc':'wc'}">${s==='ok'?'✓':'!'}</span> <b>${esc(f)}</b> — ${esc(t)}</li>`).join('')}</ul></section>`;
}
function renderSec(s){
  const nav=s.temas.map((t,k)=>`<a href="#${s.id}-${k}">${esc(t.n)}<b>${t.i.length}</b></a>`).join('');
  const body=s.temas.map((t,k)=>`<section class="panel theme" id="${s.id}-${k}"><div class="th"><h3>${esc(t.n)}${t.pm?` <span class="note">· País do Momento — ${esc(t.pm)}</span>`:''}</h3><span class="cnt"><span class="vis">${t.i.length}</span> notícias</span></div><div class="items">${t.i.map(it=>card(it)).join('')}</div><p class="empty hidden">Nenhuma notícia corresponde ao filtro.</p></section>`).join('');
  return `<div class="${s.cls}"><section class="panel sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><div class="sechead"><p class="kicker">Resumo da sessão por classificação</p><h2>${esc(s.nome)}</h2></div><p class="intro">${esc(s.resumo)}</p><div class="tsums">${s.temas.map((t,k)=>`<p><a href="#${s.id}-${k}"><b>${esc(t.n)}${t.pm?' ('+esc(t.pm)+')':''}.</b></a> ${esc(t.r)}</p>`).join('')}</div></section><div class="themes-nav">${nav}</div>${body}</div>`;
}
function renderAgenda(){return `<section class="panel"><div class="agtop"><div><p class="kicker">Agenda da Semana</p><h2>${esc(DATA.agenda.semana)}</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}</section><section class="panel">${agendaGrid()}</section>`}

function tabs(){
  const t=[['geral','Visão Geral',''],...DATA.secoes.map(s=>[s.id,s.nome,s.temas.reduce((a,b)=>a+b.i.length,0)]),['agenda','Agenda da Semana','']];
  $('#tabs').innerHTML=t.map(([id,n,c])=>`<button data-t="${id}" class="${state.tab===id?'on':''}">${esc(n)}${c!==''?`<span class="n">${c}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;try{localStorage.setItem('pn_tab',state.tab)}catch(e){}render();window.scrollTo(0,0)});
}
function render(){
  tabs();
  const app=$('#app');
  if(state.tab==='geral')app.innerHTML=renderGeral();
  else if(state.tab==='agenda')app.innerHTML=renderAgenda();
  else app.innerHTML=renderSec(DATA.secoes.find(s=>s.id===state.tab));
  filter();
  applyCollapse();
  document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{state.col=!state.col;try{localStorage.setItem('pn_col',state.col?'1':'')}catch(e){}applyCollapse()});
}
function applyCollapse(){document.querySelectorAll('.sumbox').forEach(p=>p.classList.toggle('collapsed',!!state.col));document.querySelectorAll('.tog').forEach(b=>b.textContent=state.col?'＋ Expandir resumo':'－ Minimizar resumo')}
function filter(){
  const q=state.q.trim().toLowerCase(),v=state.v;
  if((q||v)&&(state.tab==='geral'||state.tab==='agenda')){
    // global search: show results across sections
    const res=[];DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>{const txt=(it[2]+' '+it[3].replace(/<[^>]+>/g,'')).toLowerCase();if((!q||txt.includes(q))&&(!v||S(it[1])===v))res.push([s.nome+' · '+t.n,it])})));
    $('#app').innerHTML=`<section class="panel"><p class="kicker">Resultados da busca</p><h2>${res.length} notícia(s)</h2><div class="items">${res.map(([w,it])=>card(it).replace('<div class="cm">',`<div class="cm"><span class="note">${esc(w)}</span>`)).join('')||'<p class="empty">Nada encontrado.</p>'}</div></section>`;
    return;
  }
  document.querySelectorAll('.theme').forEach(th=>{let n=0;th.querySelectorAll('.card').forEach(c=>{const ok=(!q||c.dataset.s.includes(q))&&(!v||S(c.dataset.v)===v);c.classList.toggle('hidden',!ok);if(ok)n++});const vis=th.querySelector('.vis');if(vis)vis.textContent=n;th.querySelector('.empty').classList.toggle('hidden',n>0)});
}
function init(){
  $('#meta').textContent=`${DATA.meta.edicao} · Janela: ${DATA.meta.janela} · ${countAll()} notícias classificadas`;
  const vs=new Set();DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>vs.add(S(it[1])))));
  $('#fv').innerHTML+= [...vs].sort().map(v=>`<option>${esc(v)}</option>`).join('');
  $('#q').oninput=e=>{state.q=e.target.value;if(state.tab==='geral'||state.tab==='agenda'){if(!state.q&&!state.v)render();else filter()}else filter()};
  $('#fv').onchange=e=>{state.v=e.target.value;if((state.tab==='geral'||state.tab==='agenda')&&!state.q&&!state.v)render();else filter()};
  $('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pn_theme',n)}catch(e){}};
  render();
}
init();
</script>
</body>
</html>
