<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Notícias | Henrique Behrens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#0147ab;--p2:#D2E8FF;--p3:#E2E6ED;--p4:#FAB58F;--p5:#DF570B;
  --bg:#f6f8fb;--panel:#ffffff;--ink:#0d1530;--ink2:#3f4a63;--ink3:#6b7489;--line:var(--p3);
  --brand:var(--p1);--brand2:var(--p1);--accent:var(--p5);--chip:var(--p3);--chipink:#1b2440;--soft:var(--p2);
  --br:var(--p1);--intl:var(--p5);--emp:var(--p4);--warn:#a33f06;--warnbg:#fde3d3;--ok:var(--p1);--okbg:var(--p2);
  --shadow:0 1px 2px rgba(1,71,171,.05),0 1px 3px rgba(1,71,171,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand2);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--brand);color:#fff;padding:18px 16px 0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;margin:0;letter-spacing:.2px}
h1 span{color:var(--p2);font-weight:500}
.meta{font-size:12.5px;color:var(--p2);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;width:220px;font:inherit;font-size:13.5px}
.tools input::placeholder{color:#c4d2e4}
.tools select,.tools button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.tools select option{color:#111}
nav.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:transparent;border:0;color:var(--p2);padding:10px 14px;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs .n{font-size:11px;background:#ffffff1f;border-radius:10px;padding:1px 7px;margin-left:6px}
main{padding:20px 0 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.kicker{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
h2{font:600 19px/1.3 "IBM Plex Serif",Georgia,serif;margin:0 0 10px}
h3{font:600 16px/1.3 "IBM Plex Sans",sans-serif;margin:0}
.summary p{margin:0 0 10px;color:var(--ink)}
.summary p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
ol.top10{list-style:none;padding:0;margin:0;counter-reset:t}
ol.top10 li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
ol.top10 li:first-child{border-top:0;padding-top:4px}
ol.top10 li::before{content:counter(t);font:600 20px/1 "IBM Plex Serif",serif;color:var(--accent);padding-top:2px}
.t10t{font-weight:600;margin-bottom:3px}
.t10d{color:var(--ink2);font-size:14px}
.why{font-size:13px;color:var(--ink);background:var(--soft);border-radius:6px;padding:5px 8px;margin-top:6px}
.why b{color:var(--ink2);font-weight:600}
.src{font-size:12.5px;color:var(--ink3);margin-top:5px}
.src a{margin-right:8px}
.sechead{border-left:4px solid var(--br);padding-left:12px}
.sec-intl .sechead{border-color:var(--intl)}.sec-emp .sechead{border-color:var(--emp)}
.themes-nav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.themes-nav a{font-size:12.5px;background:var(--soft);color:var(--chipink);padding:4px 10px;border-radius:999px}
.themes-nav a b{font-weight:600;margin-left:4px;color:var(--ink3)}
.theme{scroll-margin-top:12px}
.theme .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.theme .cnt{font-size:12px;color:var(--ink3)}
.tsum{font-size:14px;color:var(--ink2);margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.items{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.card .ct{font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
.card .ct:hover{color:var(--brand2)}
.card .cd{font-size:13.5px;color:var(--ink2)}
.card .cm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3);margin-top:auto;padding-top:4px}
.tag{background:var(--chip);color:var(--chipink);border-radius:4px;padding:1px 6px;font-weight:500}
.est{color:var(--warn)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:1px 6px}
.empty{color:var(--ink3);font-size:13.5px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600}
td.d{white-space:nowrap;font-weight:600}
.st{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.st.c{color:var(--ok);background:var(--okbg)}.st.e{color:var(--warn);background:var(--warnbg)}.st.r{color:var(--ink2);background:var(--chip)}
.tbl{overflow-x:auto}
.daysep td{background:var(--chip);font-weight:600;color:var(--ink2);font-size:12.5px}
.log li{margin-bottom:4px;font-size:13.5px}
.okc{color:var(--ok);font-weight:600}.wc{color:var(--warn);font-weight:600}
.hidden{display:none!important}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:10px 16px 30px}
.note{font-size:12.5px;color:var(--ink3)}
mark{background:#ffe58f;color:#111;border-radius:2px}
.gsec{display:grid;gap:14px}
.gblk h3{font:600 14px/1.3 "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2);margin:0 0 4px}
.gblk p{margin:0}
a.t10t{display:block;font-weight:600;margin-bottom:3px;color:var(--ink)}
a.t10t:hover{color:var(--brand2)}
.intro{margin:0 0 12px;font-weight:500}
.tsums p{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--p4);color:var(--ink)}
.tsums p:last-child{margin-bottom:0}
.tsums a{color:var(--ink)}.tsums a b{color:var(--brand2)}
.ag{display:grid;gap:10px}
.agwrap .ag{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.agh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--brand2);border-bottom:2px solid var(--p5);padding-bottom:3px;margin-bottom:4px}
.agr{display:grid;grid-template-columns:48px 44px 1fr 10px;gap:8px;align-items:baseline;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.agr:last-child{border-bottom:0}
.agt{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12.5px}
.agg{font-size:11px;font-weight:600;color:var(--chipink);background:var(--chip);border-radius:4px;padding:0 5px;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;align-self:center}
.dot.r{background:var(--p3);border:1px solid var(--ink3)}.dot.c{background:var(--p1)}.dot.e{background:var(--p5)}
:root[data-theme="dark"] .dot.c{background:var(--p2)}
.aglg{margin-top:10px}.aglg .dot{margin:0 3px 0 8px}.aglg .dot:first-child{margin-left:0}
.sumbox{position:relative}
.tog{position:absolute;top:14px;right:16px;background:var(--soft);color:var(--brand2);border:1px solid var(--line);border-radius:6px;font:500 12px "IBM Plex Sans",sans-serif;padding:3px 9px;cursor:pointer}
.sumbox.collapsed .gsec,.sumbox.collapsed .intro,.sumbox.collapsed .tsums{display:none}
.sumbox.collapsed h2{margin-bottom:0}
.sumbox .kicker{padding-right:150px}
.agdest{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.agdest li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.fl{font-size:18px;line-height:1.2}
.agnx{margin:10px 0 0}
.agc{margin-bottom:16px}
.agcn{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.agcn .fl{font-size:22px}
table.cal{table-layout:fixed;min-width:760px;border:1px solid var(--p1)}
table.cal th{background:var(--p1);color:#fff;text-align:center;font-size:12px;text-transform:none;letter-spacing:0;padding:4px;border-right:1px solid #ffffff40}
table.cal th span{display:block;font-weight:400;font-size:11px;color:var(--p2)}
table.cal td{border-right:1px solid var(--line);padding:4px 6px;height:58px;vertical-align:top}
.ce{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3;padding:2px 4px;border-radius:3px}
.ce .cn em{display:block;font-style:italic;color:var(--ink3);font-size:11px}
.ce .ch{white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.ce.hl{background:var(--p4);font-weight:600;color:#3a1400}
.ce.hl .ch,.ce.hl em{color:#5a2200}
.hlk{display:inline-block;width:12px;height:10px;background:var(--p4);border-radius:2px;margin-right:4px;vertical-align:middle}
.agtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dl{background:var(--p1);color:#fff;border:0;border-radius:6px;font:500 12.5px "IBM Plex Sans",sans-serif;padding:6px 12px;cursor:pointer}
.dl:hover{filter:brightness(1.1)}
.agx{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:18px 22px}
@media (max-width:600px){.agx{grid-template-columns:1fr}}
.agc{margin:0}
table.cal{table-layout:auto;min-width:0;border:0;width:100%;font-size:12.5px}
table.cal th{background:none;color:var(--ink3);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px;border:0;border-bottom:1.5px solid var(--p1)}
table.cal th.n,table.cal td.n{text-align:right;white-space:nowrap}
table.cal td{border:0;border-bottom:1px solid var(--line);padding:4px 6px;height:auto;vertical-align:baseline}
table.cal td.cd{white-space:nowrap;color:var(--ink2);font-weight:500}
table.cal td.ct2{white-space:nowrap;color:var(--ink3);font-variant-numeric:tabular-nums}
table.cal td.at{font-weight:600;color:var(--ink)}
table.cal tr.hi td{background:rgba(250,181,143,.22)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p5);margin-right:6px;vertical-align:middle}
@media (max-width:600px){table.cal td.ct2,table.cal th:nth-child(2){display:none}}
.pngbox{position:fixed;left:-10000px;top:0;padding:0;background:var(--panel);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.pngbox .agx{grid-template-columns:1fr 1fr}
.pnghead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--p1);padding-bottom:10px;margin-bottom:14px}
.pngk{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.pngt{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;color:var(--p1)}
.pngb{font-size:12px;color:var(--ink3)}
.pngbox .agdest{margin-bottom:16px}
.mtx{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.mtx thead th{background:var(--p1);color:#fff;text-align:left;font-size:11px;text-transform:none;letter-spacing:0;padding:4px 6px;font-weight:600}
.mtx thead th span{font-weight:400;color:var(--p2);margin-left:2px}
.mtx th.pc{width:46px;text-align:center}
.mtx tbody th.pc{background:var(--soft);color:var(--ink3);text-transform:none;letter-spacing:0;font-size:10px;font-weight:600;vertical-align:middle;padding:2px;border-bottom:1px solid var(--line);text-align:center}
.mtx tbody th.pc .fl{display:block;font-size:16px;line-height:1}
.mtx td{vertical-align:top;padding:2px 3px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.mx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:6px;padding:1px 4px;border-radius:3px;margin-bottom:1px;line-height:1.25}
.mx:last-child{margin-bottom:0}
.mx.hi{background:rgba(250,181,143,.28)}
.mxh{color:var(--ink3);font-size:11px}
.mxv{font-size:11px;white-space:nowrap;margin-left:auto}.mxv b{color:var(--ink)}
.vs{color:var(--ink3)}
.pngbox{width:1600px;padding:0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Painel de Notícias <span>| Henrique Behrens</span></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar notícias…" aria-label="Buscar">
        <select id="fv" aria-label="Filtrar por veículo"><option value="">Todos os veículos</option></select>
        <button id="theme" title="Alternar tema">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>Painel gerado automaticamente a partir de páginas públicas, sem login. Resumos de notícias baseados em título, linha-fina e descrição pública de cada matéria. Horários em BRT (UTC−3); “≈” indica horário estimado a partir de indicação relativa (“há 2 horas”).</footer>

<script>
const BASE={v:'https://valor.globo.com',og:'https://oglobo.globo.com',f:'https://www1.folha.uol.com.br',fc:'https://c-level.folha.uol.com.br',p:'https://www.poder360.com.br',c:'https://www.cnnbrasil.com.br',m:'https://www.metropoles.com',e:'https://www.estadao.com.br',vj:'https://veja.abril.com.br',bj:'https://braziljournal.com',r:'https://www.reuters.com',ft:'https://www.ft.com/content/',fgv:'https://portalibre.fgv.br',bcb:'https://www.bcb.gov.br'};
const VNAME={v:'Valor',og:'O Globo',f:'Folha',fc:'Folha',p:'Poder360',c:'CNN Brasil',m:'Metrópoles',e:'Estadão',vj:'Veja',bj:'Brazil Journal',r:'Reuters',ft:'Financial Times',fgv:'FGV IBRE',bcb:'BCB',fed:'Federal Reserve',boj:'BoJ',ibge:'IBGE'};
function U(s){const i=s.indexOf(':');const k=s.slice(0,i);if(k==='https')return s;return (BASE[k]||'')+s.slice(i+1)}
function S(k){return VNAME[k]||k}

const DATA={"meta": {"edicao": "Terça-feira, 10 de novembro de 2026", "gerado": "10/11/2026 ≈07h40 (execução agendada, iniciada às ≈07h05)", "janela": "09/11 11h00 → 10/11 ≈07h15"}, "geral": [{"h": "Política: Fachin encerra o inquérito das fake news e o caso Master muda de mãos na PF", "p": "O fato político da noite foi o arquivamento do inquérito das fake news por Edson Fachin, horas depois do parecer da PGR, após mais de sete anos de tramitação (Folha, Poder360, Veja). O encerramento tem efeito imediato, mas não anula atos passados, e 104 procedimentos derivados serão analisados um a um (CNN, O Globo). A OAB considerou a decisão “acertada”, bolsonaristas a trataram como derrota de Moraes e a ala próxima ao ministro ficou contrariada (CNN, O Globo). No caso Master, a cúpula da PF mandou refazer os relatórios sobre a relação de ministros do STF com Vorcaro e afastou delegados da coordenação da investigação, enquanto a defesa do banqueiro pede que Gilmar Mendes decida sobre a prisão (Folha, O Globo, Estadão). No Executivo, Lula embarcou para a COP31, na Turquia, com Alcolumbre e Motta recusando o convite (CNN, Valor), adiou o decreto do fim da escala 6x1 para depois da volta (16/11) e nomeou para o TRF-1 o juiz apoiado por Dino e Gilmar, em derrota para Kassio Nunes Marques (Poder360, Valor, Folha). O STF faz hoje audiência de conciliação sobre a 6x1 (CNN, Veja). Leitura analítica: a pesquisa Quaest sugere uma “lua de mel curta” para o Lula 4 (Veja), e a sucessão no Senado segue tensa, com aliados de Marinho temendo que Alcolumbre evite um 2º turno (Metrópoles)."}, {"h": "Mercado doméstico: alívio externo puxa o Ibovespa, mas o fiscal segue no centro", "p": "O Ibovespa subiu 2,22%, para 172.236 pontos, acompanhando o exterior e puxado por Vale e bancos, com o petróleo em queda forte depois de Trump dizer que novos ataques ao Irã não parecem necessários (Valor, Investing). O dólar ficou praticamente estável, em R$ 5,51 (+0,03%), e a PTAX de 09/11 foi de R$ 5,5146 (BCB). O Focus elevou a Selic esperada para 2026 e o IPCA de 2027 (Valor), e o IGP-DI subiu 1,15% em outubro, acumulando 5,03% em 12 meses (Valor). Hoje sai a ata do Copom, lida em busca das razões da pausa nos cortes (O Globo, CNN). Gestores seguem cobrando um ajuste crível: o UBS diz que a falta de ajuste “suga todo o oxigênio” (Brazil Journal), e André Esteves (BTG) avaliou como exageradas tanto a alta pré-2º turno quanto a correção posterior (Valor). O Pix bateu recorde de transações em um dia (Poder360, O Globo)."}, {"h": "Fiscal, tributário e inflação: renúncia prorrogada e conta das medidas em R$ 190 bi", "p": "O governo prorrogou por 30 dias, até 9/12, a desoneração da gasolina e do etanol, a um custo de ≈R$ 3,57 bilhões, por decreto assinado por Alckmin em exercício (Folha, O Globo, CNN). Cálculo publicado pelo Valor estima impacto fiscal líquido de R$ 190 bilhões em 2026 e 2027 para o conjunto de medidas do governo (R$ 390 bi em mais gastos e menos receitas contra R$ 200 bi em aumento de tributos). Na leitura de analistas, a correção fiscal vai ditar a aprovação de Lula em 2027, e um Senado conservador tende a frear ajustes via receita (Christopher Garman, Eurasia, na CNN); Carlos Kawall diz que o modelo de expansão do gasto “está fazendo água” (O Globo). Na reforma tributária, estudo contesta a alíquota de 11,3% da CBS e vê arrecadação de R$ 147 bi a mais em 2027 (Poder360); concessionárias calculam alta de 5% nos pedágios a partir de janeiro (Poder360); e o imposto de importação de pneus sobe de 16% para 30% (Poder360). Entidades pedem prioridade ao combate a supersalários (Valor, CNN). Inflação: IGP-DI de 1,15% e IPC-S de 0,38% na 1ª quadrissemana de novembro (Valor); o IPCA de outubro sai na quinta."}, {"h": "Internacional: CPI dos EUA hoje, Waller fala em 50 bps e Trump perde fôlego", "p": "O dado do dia é o CPI de outubro dos EUA, às 10h30 (consenso de 3,9% a/a, ante 3,7%; núcleo de 2,8%) (Investing). O tom do Fed endureceu: Christopher Waller disse que o Fed deveria considerar uma alta de 50 pontos-base se a inflação não ceder, o que seria a maior desde 2022 (FT), e Goolsbee citou pressões inflacionárias fora do petróleo (Valor). Na política americana, o republicano Thomas Massie apresentou pedido de impeachment do secretário de Defesa, Pete Hegseth, que Trump defendeu (Poder360, NYT, CNN); Trump voltou a falar em fraude eleitoral, sem provas, após ter reconhecido a derrota nas midterms (Folha, NYT, Valor). Na Califórnia, eleitores rejeitaram o imposto sobre bilionários (NYT, WSJ). A China registrou superávit comercial acumulado acima de US$ 1 trilhão no ano, com exportações +35,2% a/a em outubro (Reuters, Poder360); o saldo do mês, de US$ 105,3 bi, ficou abaixo do consenso de US$ 126,5 bi (Investing)."}, {"h": "Geopolítica e empresas: negociação na Ucrânia, Irã em pausa e a crise da Nvidia", "p": "Rússia, Ucrânia e EUA retomaram em Abu Dhabi as primeiras negociações em nove meses; o enviado de Trump diz que as diferenças diminuíram, mas a expectativa de avanço é baixa (Reuters, FT, O Globo). Trump disse que vai adiar novos ataques ao Irã por ora (Reuters, Valor), mas a tensão segue: os EUA retiraram aviões-tanque de uma segunda base britânica após ameaça iraniana (Estadão, WSJ, FT), houthis voltaram a atacar a Arábia Saudita (CNN, Estadão) e a França convocou o embaixador iraniano por ataques hackers a refrigeradores de supermercados (Reuters, O Globo). No Paraguai, o novo presidente, Pedro Alliana, pediu a renúncia dos ministros e trocou o comando do BC, enquanto a Justiça fez buscas na casa de Santiago Peña (Valor, O Globo). Rubio disse que os EUA vão “lidar” com o governo Lula, mas cobrou aval ao embaixador americano (Folha, CNN). No corporativo, a Nvidia perdeu ≈US$ 192–200 bi em valor de mercado (−4,27%) com a investigação sobre a relação de Jensen Huang com uma suposta espiã chinesa, e Trump disse que o FBI está “investigando” o caso (CNN, Valor, FT) <span class=\"flag\">Divergência</span>. No Brasil, Itaúsa teve lucro recorrente recorde (R$ 5,1 bi), a JBS viu o lucro cair 71,7%, e Magalu e Grupo SBF tiveram leituras diferentes entre veículos (Valor, CNN, Poder360)."}, {"h": "Fechamento dos mercados (Américas e Europa em 09/11; Ásia em 10/11)", "p": "Na segunda (09/11), o alívio do petróleo e a recuperação das techs puxaram os mercados. O Ibovespa subiu 2,22%, a 172.236 pontos; o dólar fechou em R$ 5,5083 (+0,03%), e o DI de 10 anos ficou em 15,18%, sem variação no histórico do Investing (≈, possível falta de atualização). Nos EUA, o S&P 500 avançou 2,35% (7.549,94 pontos), o Nasdaq 2,74% (25.253) e o Dow 2,15% (52.390). O Treasury de 10 anos subiu ≈1 bp, a 4,86%, e o de 2 anos ≈3 bps, a 4,55%; o DXY caiu 0,55%, a 101,65, e o EUR/USD subiu 0,69%, a 1,1224. Na Europa, o Stoxx 600 ganhou 1,26% (656,52), o DAX 1,73% e o FTSE 1,02%, com o Bund a 3,27% (+≈1 bp) e o Gilt a 5,13% (−≈2 bps). Na Ásia, já em 10/11, o Nikkei caiu 0,50% (60.396), depois de saltar 4,73% na segunda, enquanto o Hang Seng subiu 0,44% e Xangai 0,08%; o JGB de 10 anos foi a 2,69% (+≈3 bps) e o título chinês a 1,58% (−≈2 bps). O iene fechou a segunda em 157,9 por dólar e o yuan em 6,67. Nas commodities, o petróleo desabou na segunda (Brent −5,15%, a US$ 92,57; WTI −3,98%, a US$ 86,85) e segue em queda nesta manhã (Brent ≈US$ 90, intradiário). O ouro subiu 1,25% (US$ 4.114,50), o cobre 1,44%, a soja recuou 0,46% e o minério ficou estável (US$ 92,71). Fonte: Investing.com (histórico de cotações)."}], "top10": [{"t": "Fachin arquiva o inquérito das fake news após mais de sete anos", "d": "O presidente do STF encerrou a investigação horas depois do parecer da PGR. O fim tem efeito imediato, mas não anula atos anteriores, e 104 procedimentos derivados serão analisados individualmente.", "w": "Retira do centro da crise do STF o instrumento mais contestado da Corte e reduz o poder de Moraes, mas não encerra a disputa: a direita pede anulação de atos, e a ala próxima ao ministro ficou contrariada.", "s": [["f", "f:/poder/2026/11/fachin-arquiva-inquerito-das-fake-news-no-stf-apos-mais-de-7-anos-de-tramitacao.shtml"], ["p", "p:/poder-justica/fachin-arquiva-o-inquerito-das-fake-news/"], ["c", "c:/politica/fim-do-inquerito-das-fake-news-nao-encerra-investigacoes-no-stf-entenda/"], ["og", "og:/politica/noticia/2026/11/10/fim-do-inquerito-das-fake-news-contraria-ala-proxima-a-moraes.ghtml"]]}, {"t": "Escândalo de Jensen Huang derruba a Nvidia; Trump diz que o FBI investiga", "d": "As ações caíram 4,27% na segunda, com perda de ≈US$ 192–200 bi em valor de mercado, depois de o conselho abrir investigação sobre a relação do CEO com uma suposta espiã chinesa. Huang admitiu o caso extraconjugal, e acionistas já processam a empresa.", "w": "A maior empresa do ciclo de IA enfrenta risco de governança e de segurança nacional ao mesmo tempo, com reflexos sobre a política americana de chips para a China.", "s": [["ft", "ft:cbabf2da-2079-4b69-88e3-0ba84cf8d6fd"], ["c", "c:/economia/money/negocios/nvidia-perde-us-192-bi-em-um-dia-apos-escandalo-com-ceo/"], ["v", "v:/empresas/noticia/2026/11/10/crise-com-ceo-faz-nvidia-perder-cerca-de-us-200-bi.ghtml"], ["WSJ", "https://www.wsj.com/tech/ai/how-jensen-huangs-affair-spiraled-into-a-national-security-nightmare-d9b43304"]]}, {"t": "Ibovespa sobe 2,2% e Nasdaq 2,7% com tombo do petróleo", "d": "O Ibovespa fechou em 172.236 pontos, com Vale e bancos, e o dólar ficou estável em R$ 5,51. Em NY, as techs voltaram aos níveis pré-eleição, e o Brent caiu 5,15% com a sinalização de Trump de que não deve atacar o Irã por ora.", "w": "Estende a recuperação após o tombo pós-2º turno, mas o prêmio fiscal doméstico continua sem resposta.", "s": [["v", "v:/financas/noticia/2026/11/09/ibovespa-acompanha-exterior-e-fecha-em-alta-com-vale-e-bancos-estendendo-recuperacao.ghtml"], ["og", "og:/economia/financas/ao-vivo/ibovespa-hoje-acompanhe-bolsa-e-dolar.ghtml"], ["vj", "vj:/coluna/macro-intelligence/tombo-do-petroleo-reacende-otimismo-nos-mercados/"]]}, {"t": "Dia de CPI nos EUA e ata do Copom; Waller fala em alta de 50 bps", "d": "O CPI de outubro sai às 10h30 (consenso de 3,9% a/a). Waller disse que o Fed deveria considerar uma alta de 50 bps se a inflação não desacelerar. No Brasil, a ata do Copom deve detalhar por que ficou mais difícil cortar a Selic.", "w": "Um CPI acima do esperado reforçaria a aposta de aperto do Fed em dezembro e pressionaria juros e câmbio também no Brasil.", "s": [["ft", "ft:72abed21-6043-4b2b-81b1-f3a2547da5b7"], ["c", "c:/blogs/debora-oliveira/economia/money/macroeconomia/ata-do-copom-deve-detalhar-por-que-ficou-mais-dificil-cortar-a-selic/"], ["og", "og:/economia/financas/noticia/2026/11/10/bc-divulga-hoje-ata-do-copom-veja-as-pistas-que-analistas-buscam-sobre-a-pausa-nos-cortes-de-juros.ghtml"]]}, {"t": "Superávit comercial da China passa de US$ 1 trilhão no ano", "d": "As exportações subiram 35,2% a/a em outubro, puxadas pela demanda ligada à IA, e o acumulado do ano ultrapassou US$ 1 trilhão em tempo recorde. O saldo do mês (US$ 105,3 bi) ficou abaixo do consenso (US$ 126,5 bi), segundo o Investing.", "w": "Amplia a tensão comercial com EUA e Europa e sustenta a leitura de que a China exporta seu excesso de capacidade.", "s": [["r", "r:/world/asia-pacific/chinas-trade-surplus-soars-past-1-trillion-october-exports-jump-352-yy-2026-11-10/"], ["p", "p:/poder-china/china-supera-us-1-trilhao-em-superavit-com-avanco-da-ia/"], ["WSJ", "https://www.wsj.com/world/china/chinas-trade-surplus-surged-past-1-trillion-in-october-967968c9"]]}, {"t": "Rússia, Ucrânia e EUA retomam negociações em Abu Dhabi", "d": "São as primeiras conversas trilaterais em nove meses. O enviado de Trump diz que as diferenças diminuíram; a delegação russa quer centrar a pauta numa nova arquitetura de segurança europeia.", "w": "Um avanço afetaria energia, sanções e o orçamento de defesa europeu; a baixa expectativa limita, por ora, o efeito em preços.", "s": [["r", "r:/world/europe/russia-ukraine-meet-us-backed-talks-after-trump-says-broad-deal-possible-2026-11-10/"], ["ft", "ft:352539b3-41fd-4418-a171-43975897ec0e"], ["c", "c:/internacional/negociacoes-entre-eua-ucrania-e-russia-comecam-em-abu-dhabi-diz-moscou/"]]}, {"t": "Republicano pede impeachment de Hegseth; Trump volta a falar em fraude", "d": "Thomas Massie listou oito acusações contra o secretário de Defesa, incluindo a condução da guerra contra o Irã. Trump defendeu Hegseth e retomou, sem provas, o discurso de fraude após a derrota nas midterms.", "w": "Sinaliza um Trump enfraquecido e um Congresso mais disposto a fiscalizar o Executivo antes mesmo da posse da nova maioria democrata.", "s": [["p", "p:/poder-internacional/deputado-republicano-pede-impeachment-de-secretario-de-defesa-de-trump/"], ["NYT", "https://www.nytimes.com/2026/11/09/us/politics/hegseth-impeachment-massie.html"], ["f", "f:/mundo/2026/11/apos-derrota-avassaladora-trump-volta-a-falar-em-fraude-nas-eleicoes.shtml"]]}, {"t": "Fim da escala 6x1: decreto fica para depois da COP31, e STF faz conciliação hoje", "d": "Lula adiou a regulamentação para depois de voltar ao Brasil, em 16/11. Hoje o ministro Flávio Dino reúne empresas, trabalhadores e Congresso para discutir a transição; o presidente do TST defende o fim imediato.", "w": "Define o custo de adaptação para empresas de serviços e varejo e o calendário de uma das principais bandeiras do Lula 4.", "s": [["p", "p:/poder-governo/lula-adia-decreto-da-escala-6-x-1-para-depois-de-viagem-a-asia/"], ["c", "c:/politica/stf-promove-audiencia-nesta-terca-10-para-discutir-fim-da-escala-6x1/"], ["v", "v:/brasil/noticia/2026/11/10/fim-da-escala-6x1-veja-quem-pode-continuar-com-jornada-diferente-da-5x2.ghtml"]]}, {"t": "Governo prorroga desoneração dos combustíveis; medidas somam R$ 190 bi de impacto", "d": "A isenção de tributos federais sobre gasolina e etanol foi estendida até 9/12, a ≈R$ 3,57 bi. Cálculo publicado pelo Valor estima impacto fiscal líquido de R$ 190 bi em 2026–27 para o conjunto de medidas.", "w": "Reforça a percepção de que o ajuste ainda não começou, num momento em que o mercado cobra sinais concretos.", "s": [["f", "f:/mercado/2026/11/governo-lula-vai-prorrogar-desoneracao-da-gasolina-e-do-etanol-por-mais-30-dias.shtml"], ["v", "v:/brasil/noticia/2026/11/10/medidas-do-governo-devem-ter-impacto-fiscal-liquido-de-r-190-bi-em-2026-e-2027.ghtml"], ["c", "c:/economia/money/macroeconomia/governo-prorroga-desoneracao-de-gasolina-e-etanol-por-30-dias/"]]}, {"t": "Caso Master: PF manda refazer relatórios sobre ministros do STF e afasta delegados", "d": "A cúpula da PF avaliou que os documentos podiam ser lidos como investigação de ministros. Delegados do caso foram tirados da coordenação, e a defesa de Vorcaro pede que Gilmar Mendes decida sobre a prisão.", "w": "Aumenta a desconfiança sobre a condução do caso e a proximidade entre o escândalo e o Supremo.", "s": [["f", "f:/poder/2026/11/cupula-da-pf-determina-que-relatorios-sobre-relacao-de-ministros-do-stf-com-vorcaro-sejam-refeitos.shtml"], ["og", "og:/politica/noticia/2026/11/09/delegados-do-caso-master-sao-afastados-do-cargo.ghtml"], ["e", "e:/politica/blog-do-fausto-macedo/defesa-de-vorcaro-pede-a-fachin-que-gilmar-mendes-decida-sobre-prisao-de-banqueiro/"]]}], "secoes": [{"id": "brasil", "nome": "Brasil", "cls": "sec-br", "resumo": "A noite foi dominada pelo Judiciário: Fachin encerrou o inquérito das fake news e a PF mexeu na condução do caso Master, enquanto Lula viajou para a COP31 deixando para a volta o decreto da escala 6x1. No mercado, o Ibovespa subiu com o alívio externo, mas a agenda fiscal segue sem medidas: o governo prorrogou a desoneração dos combustíveis, e as contas do conjunto de medidas apontam impacto líquido de R$ 190 bi em dois anos. Hoje saem a ata do Copom e, nos EUA, o CPI.", "temas": [{"n": "Destaques", "r": "Cinco fatos organizam o dia: o fim do inquérito das fake news; a reorganização do caso Master na PF; a alta da bolsa com o petróleo em queda; a prorrogação da desoneração dos combustíveis; e o adiamento do decreto da 6x1, que o STF discute hoje.", "i": [["20h03 (09/11)", "f", "Fachin encerra inquérito das fake news no STF após mais de 7 anos de tramitação", "Decisão fecha um dos processos mais controversos da Corte.", "f:/poder/2026/11/fachin-arquiva-inquerito-das-fake-news-no-stf-apos-mais-de-7-anos-de-tramitacao.shtml"], ["23h04 (09/11)", "f", "Cúpula da PF determina que relatórios sobre relação de ministros do STF com Vorcaro sejam refeitos", "Avaliação foi de que os documentos poderiam ser lidos como investigação de ministros.", "f:/poder/2026/11/cupula-da-pf-determina-que-relatorios-sobre-relacao-de-ministros-do-stf-com-vorcaro-sejam-refeitos.shtml"], ["≈19h00 (09/11)", "v", "Ibovespa acompanha exterior e fecha em alta com Vale e bancos, estendendo recuperação", "Movimento reverte parte das perdas acumuladas após o 2º turno.", "v:/financas/noticia/2026/11/09/ibovespa-acompanha-exterior-e-fecha-em-alta-com-vale-e-bancos-estendendo-recuperacao.ghtml"], ["20h44 (09/11)", "f", "Governo Lula prorroga desoneração da gasolina e do etanol por mais 30 dias", "Impacto conjunto estimado em R$ 3,57 bilhões.", "f:/mercado/2026/11/governo-lula-vai-prorrogar-desoneracao-da-gasolina-e-do-etanol-por-mais-30-dias.shtml"], ["16h42 (09/11)", "p", "Lula adia regulamentação da escala 6x1 para depois de viagem à Ásia", "Texto será divulgado após o retorno do presidente, em 16/11.", "p:/poder-governo/lula-adia-decreto-da-escala-6-x-1-para-depois-de-viagem-a-asia/"]]}, {"n": "Política e Congresso", "r": "Com Lula fora do país (COP31 na Turquia, depois Asean nas Filipinas), a política gira em torno da montagem do Lula 4 e das eleições no Congresso. Alcolumbre e Motta recusaram o convite para a viagem, aliados de Rogério Marinho temem que Alcolumbre evite um 2º turno no Senado e o PL lista possíveis “traidores”. O PSD, com apoio de Motta, quer acelerar o voto distrital misto antes da posse do novo Congresso. No governo, Wellington Dias deve deixar o MDS e Tebet aparece como “coringa”. Leitura analítica: a Quaest indica uma lua de mel curta, e especialistas veem o Lula 4 tentando se aproveitar de um Centrão enfraquecido (Veja, CNN). Fato a acompanhar: o TSE julga a ação da campanha de Lula contra a Meta.", "i": [["21h57 (09/11)", "c", "Lula desembarca na Turquia para participar da COP 31", "De Antália, o presidente seguirá para as Filipinas.", "c:/internacional/lula-desembarca-na-turquia-para-participar-da-cop-31/"], ["≈20h00 (09/11)", "v", "Alcolumbre e Motta priorizam agenda e recusam convite de Lula para COP31", "Articulações para as eleições no Senado e na Câmara pesaram.", "v:/politica/noticia/2026/11/09/alcolumbre-e-motta-priorizam-agenda-e-recusam-convite-de-lula-para-cop31.ghtml"], ["05h00", "m", "Aliados de Marinho temem que Alcolumbre impeça 2º turno no Senado", "Regimento interno não é claro sobre segundo turno.", "m:/colunas/igor-gadelha/aliados-de-marinho-temem-que-alcolumbre-impeca-2o-turno-no-senado"], ["≈05h00", "og", "Os potenciais traidores da campanha de Rogério Marinho, segundo integrantes do PL", "Coluna de Malu Gaspar.", "og:/blogs/malu-gaspar/post/2026/11/os-potenciais-traidores-da-campanha-de-rogerio-marinho-segundo-integrantes-do-pl.ghtml"], ["03h20", "c", "Aliados defendem “tropa de choque” de Lula no Senado", "Governo aposta em experiência para enfrentar a bancada bolsonarista.", "c:/politica/aliados-defendem-tropa-de-choque-de-lula-no-senado/"], ["22h31 (09/11)", "vj", "‘Lua de mel curta’: o que a pesquisa Quaest diz sobre o começo do governo Lula 4", "—", "vj:/politica/lua-de-mel-curta-o-que-pesquisa-quaest-diz-sobre-comeco-do-governo-lula-4/"], ["≈23h00 (09/11)", "og", "Com apoio de Motta, PSD quer voto distrital misto com escolha única na urna e listas partidárias", "Partido de Kassab quer acelerar a tramitação antes da posse do novo Congresso.", "og:/politica/noticia/2026/11/09/com-apoio-de-motta-psd-quer-voto-distrital-misto-com-escolha-unica-na-urna-e-listas-partidarias.ghtml"], ["≈19h00 (09/11 road-deal-possible-2026-11-10/"], ["05h50", "c", "Negociações entre EUA, Ucrânia e Rússia começam em Abu Dhabi, diz Moscou", "Primeiras conversas trilaterais desde fevereiro.", "c:/internacional/negociacoes-entre-eua-ucrania-e-russia-comecam-em-abu-dhabi-diz-moscou/"], ["10/11", "r", "Russia sees European security framework as main thrust of Ukraine talks, delegation source says", "Rússia vê nova arquitetura de segurança europeia como eixo das negociações.", "r:/world/europe/russia-sees-new-security-framework-europe-main-thrust-ukraine-talks-delegation-2026-11-10/"], ["—", "ft", "Talks aimed at ending Russia’s war in Ukraine resume", "Negociações para encerrar a guerra são retomadas, mas com baixa expectativa de avanço.", "ft:352539b3-41fd-4418-a171-43975897ec0e"], ["09/11", "r", "Trump says he will hold off on fresh Iran strikes for now", "Trump diz que vai adiar novos ataques ao Irã por ora.", "r:/world/middle-east/trump-meet-iran-war-mediator-qatar-no-imminent-deal-seen-end-war-2026-11-09/"], ["≈20h00 (09/11)", "v", "Trump diz que ação militar dos EUA contra o Irã não parece necessária neste momento", "Mas diz que os EUA estão “com as armas carregadas”.", "v:/mundo/noticia/2026/11/09/trump-diz-que-ao-militar-dos-eua-contra-o-ir-no-parece-necessria-neste-momento.ghtml"], ["10/11", "r", "Qatari PM makes unscheduled stop at G7 to brief Europeans post Trump talks", "Premiê do Catar faz parada não programada no G7 para relatar conversas com Trump.", "r:/world/middle-east/qatari-pm-makes-unscheduled-stop-g7-brief-europeans-post-trump-talks-2026-11-10/"], ["06h58", "e", "EUA retiram aviões-tanque de base britânica após ameaça do Irã, diz jornal", "—", "e:/internacional/eua-retiram-avioes-tanque-de-base-britanica-apos-ameaca-do-ira-npr/"], ["—", "WSJ", "U.S. Aircraft Evacuated From Second U.K. Base Due to Iran Threat", "Aeronaves americanas deixam uma segunda base britânica por ameaça iraniana.", "https://www.wsj.com/world/middle-east/u-s-aircraft-evacuated-from-second-u /* ---------- render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={tab:'geral',q:'',v:'',col:false};
try{const t=localStorage.getItem('pn_theme');if(t)document.documentElement.dataset.theme=t;const tb=localStorage.getItem('pn_tab');state.col=!!localStorage.getItem('pn_col');if(tb)state.tab=tb}catch(e){}

function card(it,sec,tema){
  const [h,v,t,d,u]=it;
  const est=h.startsWith('≈')||h==='—';
  return `<article class="card" data-v="${v}" data-s="${esc((t+' '+d.replace(/<[^>]+>/g,'')).toLowerCase())}">
  <a class="ct" href="${esc(U(u))}" target="_blank" rel="noopener">${esc(t)}</a>
  ${d?`<div class="cd">${d}</div>`:''}
  <div class="cm"><span class="tag">${esc(S(v))}</span><span class="${est?'est':''}">${esc(h)}</span></div></article>`;
}
function countAll(){let n=0;DATA.secoes.forEach(s=>s.temas.forEach(t=>n+=t.i.length));return n}
function srcLinks(arr){return arr.map(([v,u])=>`<a href="${esc(U(u))}" target="_blank" rel="noopener">${esc(S(v))}</a>`).join('')}

function agendaDestaques(){
  return `<ul class="agdest">${DATA.agenda.destaques.map(([f,t])=>`<li><span class="fl">${f}</span>${esc(t)}</li>`).join('')}</ul><p class="note agnx">${esc(DATA.agenda.proxima)}</p>`;
}
function agendaGrid(){
  const D=DATA.agenda.dias;
  const cell=(p,d)=>p.ev.filter(e=>e[0].startsWith(d)).map(([dd,h,imp,n,at,co,an])=>{
    const v=at?`<b>${esc(at)}</b>${co?` <span class="vs">vs ${esc(co)}</span>`:''}`:(co||an?`<span class="vs">${co?'cons. '+esc(co):''}${co&&an?' · ':''}${an?'ant. '+esc(an):''}</span>`:'');
    return `<div class="mx${imp>=3?' hi':''}"><span class="mxt">${imp>=3?'<span class="imp"></span>':''}${h&&h!=='—'?`<span class="mxh">${esc(h)}</span> `:''}${esc(n)}</span>${v?`<span class="mxv">${v}</span>`:''}</div>`}).join('');
  return `<div class="tbl"><table class="mtx"><thead><tr><th class="pc"></th>${D.map(([d,n])=>`<th>${d} <span>${n}</span></th>`).join('')}</tr></thead><tbody>${DATA.agenda.paises.map(p=>`<tr><th class="pc" title="${esc(p.n)}"><span class="fl">${p.f}</span><span class="pn">(${esc(p.c)})</span></th>${D.map(([d])=>`<td>${cell(p,d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note aglg"><span class="imp"></span> alta importância · em negrito, o resultado divulgado (vs consenso) · horários em BRT; “≈” = estimado · fontes: Investing.com, FGV, BCB, Tesouro e imprensa</p>`;
}
function loadH2C(){return window.html2canvas?Promise.resolve():new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('Não foi possível carregar o gerador de imagem (verifique a conexão).'));document.head.appendChild(sc)})}
async function dlPNG(btn){
  const old=btn.textContent;btn.textContent='Gerando…';btn.disabled=true;
  const box=document.createElement('div');box.className='pngbox';
  const g=document.createElement('div');g.innerHTML=agendaGrid();box.appendChild(g.querySelector('table.mtx'));
  document.body.appendChild(box);
  try{await loadH2C();const bg=getComputedStyle(document.body).backgroundColor;
    const c=await html2canvas(box.firstElementChild,{scale:2,backgroundColor:getComputedStyle(document.querySelector('.panel')||document.body).backgroundColor||'#fff',useCORS:true,logging:false});
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='calendario_semana_'+DATA.agenda.semana.replace(/[^0-9a-z]+/gi,'_')+'.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert(e.message)}finally{box.remove();btn.textContent=old;btn.disabled=false}
}
function renderGeral(){
  return `<section class="panel summary sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><p class="kicker">Resumo global do noticiário · ${esc(DATA.meta.edicao)}</p><h2>O dia em perspectiva</h2><div class="gsec">${DATA.geral.map(g=>`<div class="gblk"><h3>${esc(g.h)}</h3><p>${esc(g.p)}</p></div>`).join('')}</div></section>
  <div class="grid2">
  <section class="panel"><p class="kicker">Top 10 do dia</p><ol class="top10">${DATA.top10.map(x=>`<li><div><a class="t10t" href="${esc(U(x.s[0][1]))}" target="_blank" rel="noopener">${esc(x.t)} ↗</a><div class="t10d">${esc(x.d)}</div><div class="why"><b>Por que importa:</b> ${esc(x.w)}</div><div class="src">${srcLinks(x.s)}</div></div></li>`).join('')}</ol></section>
  <section class="panel"><div class="agtop"><div><p class="kicker">Calendário da semana · ${esc(DATA.agenda.semana)}</p><h2>Destaques</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}<p class="note" style="margin-top:8px">Calendário completo por país na aba “Agenda da Semana”.</p></section>
  </div>
  <section class="panel"><p class="kicker">Log de coleta</p><ul class="log">${DATA.log.map(([s,f,t])=>`<li><span class="${s==='ok'?'okc':'wc'}">${s==='ok'?'✓':'!'}</span> <b>${esc(f)}</b> — ${esc(t)}</li>`).join('')}</ul></section>`;
}
function renderSec(s){
  const nav=s.temas.map((t,k)=>`<a href="#${s.id}-${k}">${esc(t.n)}<b>${t.i.length}</b></a>`).join('');
  const body=s.temas.map((t,k)=>`<section class="panel theme" id="${s.id}-${k}"><div class="th"><h3>${esc(t.n)}${t.pm?` <span class="note">· País do Momento — ${esc(t.pm)}</span>`:''}</h3><span class="cnt"><span class="vis">${t.i.length}</span> notícias</span></div><div class="items">${t.i.map(it=>card(it)).join('')}</div><p class="empty hidden">Nenhuma notícia corresponde ao filtro.</p></section>`).join('');
  return `<div class="${s.cls}"><section class="panel sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><div class="sechead"><p class="kicker">Resumo da sessão por classificação</p><h2>${esc(s.nome)}</h2></div><p class="intro">${esc(s.resumo)}</p><div class="tsums">${s.temas.map((t,k)=>`<p><a href="#${s.id}-${k}"><b>${esc(t.n)}${t.pm?' ('+esc(t.pm)+')':''}.</b></a> ${esc(t.r)}</p>`).join('')}</div></section><div class="themes-nav">${nav}</div>${body}</div>`;
}
function renderAgenda(){return `<section class="panel"><div class="agtop"><div><p class="kicker">Agenda da Semana</p><h2>${esc(DATA.agenda.semana)}</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}</section><section class="panel">${agendaGrid()}</section>`}

function tabs(){
  const t=[['geral','Visão Geral',''],...DATA.secoes.map(s=>[s.id,s.nome,s.temas.reduce((a,b)=>a+b.i.length,0)]),['agenda','Agenda da Semana','']];
  $('#tabs').innerHTML=t.map(([id,n,c])=>`<button data-t="${id}" class="${state.tab===id?'on':''}">${esc(n)}${c!==''?`<span class="n">${c}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;try{localStorage.setItem('pn_tab',state.tab)}catch(e){}render();window.scrollTo(0,0)});
}
function render(){
  tabs();
  const app=$('#app');
  if(state.tab==='geral')app.innerHTML=renderGeral();
  else if(state.tab==='agenda')app.innerHTML=renderAgenda();
  else app.innerHTML=renderSec(DATA.secoes.find(s=>s.id===state.tab));
  filter();
  applyCollapse();
  document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{state.col=!state.col;try{localStorage.setItem('pn_col',state.col?'1':'')}catch(e){}applyCollapse()});
}
function applyCollapse(){document.querySelectorAll('.sumbox').forEach(p=>p.classList.toggle('collapsed',!!state.col));document.querySelectorAll('.tog').forEach(b=>b.textContent=state.col?'＋ Expandir resumo':'－ Minimizar resumo')}
function filter(){
  const q=state.q.trim().toLowerCase(),v=state.v;
  if((q||v)&&(state.tab==='geral'||state.tab==='agenda')){
    // global search: show results across sections
    const res=[];DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>{const txt=(it[2]+' '+it[3].replace(/<[^>]+>/g,'')).toLowerCase();if((!q||txt.includes(q))&&(!v||S(it[1])===v))res.push([s.nome+' · '+t.n,it])})));
    $('#app').innerHTML=`<section class="panel"><p class="kicker">Resultados da busca</p><h2>${res.length} notícia(s)</h2><div class="items">${res.map(([w,it])=>card(it).replace('<div class="cm">',`<div class="cm"><span class="note">${esc(w)}</span>`)).join('')||'<p class="empty">Nada encontrado.</p>'}</div></section>`;
    return;
  }
  document.querySelectorAll('.theme').forEach(th=>{let n=0;th.querySelectorAll('.card').forEach(c=>{const ok=(!q||c.dataset.s.includes(q))&&(!v||S(c.dataset.v)===v);c.classList.toggle('hidden',!ok);if(ok)n++});const vis=th.querySelector('.vis');if(vis)vis.textContent=n;th.querySelector('.empty').classList.toggle('hidden',n>0)});
}
function init(){
  $('#meta').textContent=`${DATA.meta.edicao} · Janela: ${DATA.meta.janela} · ${countAll()} notícias classificadas`;
  const vs=new Set();DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>vs.add(S(it[1])))));
  $('#fv').innerHTML+= [...vs].sort().map(v=>`<option>${esc(v)}</option>`).join('');
  $('#q').oninput=e=>{state.q=e.target.value;if(state.tab==='geral'||state.tab==='agenda'){if(!state.q&&!state.v)render();else filter()}else filter()};
  $('#fv').onchange=e=>{state.v=e.target.value;if((state.tab==='geral'||state.tab==='agenda')&&!state.q&&!state.v)render();else filter()};
  $('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pn_theme',n)}catch(e){}};
  render();
}
init();
</script>
</body>
</html>
