<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Notícias | Henrique Behrens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#0147ab;--p2:#D2E8FF;--p3:#E2E6ED;--p4:#FAB58F;--p5:#DF570B;
  --bg:#f6f8fb;--panel:#ffffff;--ink:#0d1530;--ink2:#3f4a63;--ink3:#6b7489;--line:var(--p3);
  --brand:var(--p1);--brand2:var(--p1);--accent:var(--p5);--chip:var(--p3);--chipink:#1b2440;--soft:var(--p2);
  --br:var(--p1);--intl:var(--p5);--emp:var(--p4);--warn:#a33f06;--warnbg:#fde3d3;--ok:var(--p1);--okbg:var(--p2);
  --shadow:0 1px 2px rgba(1,71,171,.05),0 1px 3px rgba(1,71,171,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#070d24;--panel:#0e1636;--ink:#eef2fb;--ink2:#b9c3dc;--ink3:#8590ad;--line:#1f2a52;
  --brand:#0147ab;--brand2:#9cc7ff;--accent:#FAB58F;--chip:#1a2550;--chipink:#D2E8FF;--soft:#14205a;
  --br:#D2E8FF;--intl:#DF570B;--emp:#FAB58F;--warn:#FAB58F;--warnbg:#3a1a08;--ok:#D2E8FF;--okbg:#14205a;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand2);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--brand);color:#fff;padding:18px 16px 0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;margin:0;letter-spacing:.2px}
h1 span{color:var(--p2);font-weight:500}
.meta{font-size:12.5px;color:var(--p2);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;width:220px;font:inherit;font-size:13.5px}
.tools input::placeholder{color:#c4d2e4}
.tools select,.tools button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.tools select option{color:#111}
nav.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:transparent;border:0;color:var(--p2);padding:10px 14px;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs .n{font-size:11px;background:#ffffff1f;border-radius:10px;padding:1px 7px;margin-left:6px}
main{padding:20px 0 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.kicker{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
h2{font:600 19px/1.3 "IBM Plex Serif",Georgia,serif;margin:0 0 10px}
h3{font:600 16px/1.3 "IBM Plex Sans",sans-serif;margin:0}
.summary p{margin:0 0 10px;color:var(--ink)}
.summary p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
ol.top10{list-style:none;padding:0;margin:0;counter-reset:t}
ol.top10 li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
ol.top10 li:first-child{border-top:0;padding-top:4px}
ol.top10 li::before{content:counter(t);font:600 20px/1 "IBM Plex Serif",serif;color:var(--accent);padding-top:2px}
.t10t{font-weight:600;margin-bottom:3px}
.t10d{color:var(--ink2);font-size:14px}
.why{font-size:13px;color:var(--ink);background:var(--soft);border-radius:6px;padding:5px 8px;margin-top:6px}
.why b{color:var(--ink2);font-weight:600}
.src{font-size:12.5px;color:var(--ink3);margin-top:5px}
.src a{margin-right:8px}
.sechead{border-left:4px solid var(--br);padding-left:12px}
.sec-intl .sechead{border-color:var(--intl)}.sec-emp .sechead{border-color:var(--emp)}
.themes-nav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.themes-nav a{font-size:12.5px;background:var(--soft);color:var(--chipink);padding:4px 10px;border-radius:999px}
.themes-nav a b{font-weight:600;margin-left:4px;color:var(--ink3)}
.theme{scroll-margin-top:12px}
.theme .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.theme .cnt{font-size:12px;color:var(--ink3)}
.tsum{font-size:14px;color:var(--ink2);margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.items{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.card .ct{font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
.card .ct:hover{color:var(--brand2)}
.card .cd{font-size:13.5px;color:var(--ink2)}
.card .cm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3);margin-top:auto;padding-top:4px}
.tag{background:var(--chip);color:var(--chipink);border-radius:4px;padding:1px 6px;font-weight:500}
.est{color:var(--warn)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:1px 6px}
.empty{color:var(--ink3);font-size:13.5px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600}
td.d{white-space:nowrap;font-weight:600}
.st{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.st.c{color:var(--ok);background:var(--okbg)}.st.e{color:var(--warn);background:var(--warnbg)}.st.r{color:var(--ink2);background:var(--chip)}
.tbl{overflow-x:auto}
.daysep td{background:var(--chip);font-weight:600;color:var(--ink2);font-size:12.5px}
.log li{margin-bottom:4px;font-size:13.5px}
.okc{color:var(--ok);font-weight:600}.wc{color:var(--warn);font-weight:600}
.hidden{display:none!important}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:10px 16px 30px}
.note{font-size:12.5px;color:var(--ink3)}
mark{background:#ffe58f;color:#111;border-radius:2px}
.gsec{display:grid;gap:14px}
.gblk h3{font:600 14px/1.3 "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2);margin:0 0 4px}
.gblk p{margin:0}
a.t10t{display:block;font-weight:600;margin-bottom:3px;color:var(--ink)}
a.t10t:hover{color:var(--brand2)}
.intro{margin:0 0 12px;font-weight:500}
.tsums p{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--p4);color:var(--ink)}
.tsums p:last-child{margin-bottom:0}
.tsums a{color:var(--ink)}.tsums a b{color:var(--brand2)}
.ag{display:grid;gap:10px}
.agwrap .ag{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.agh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--brand2);border-bottom:2px solid var(--p5);padding-bottom:3px;margin-bottom:4px}
.agr{display:grid;grid-template-columns:48px 44px 1fr 10px;gap:8px;align-items:baseline;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.agr:last-child{border-bottom:0}
.agt{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12.5px}
.agg{font-size:11px;font-weight:600;color:var(--chipink);background:var(--chip);border-radius:4px;padding:0 5px;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;align-self:center}
.dot.r{background:var(--p3);border:1px solid var(--ink3)}.dot.c{background:var(--p1)}.dot.e{background:var(--p5)}
:root[data-theme="dark"] .dot.c{background:var(--p2)}
.aglg{margin-top:10px}.aglg .dot{margin:0 3px 0 8px}.aglg .dot:first-child{margin-left:0}
.sumbox{position:relative}
.tog{position:absolute;top:14px;right:16px;background:var(--soft);color:var(--brand2);border:1px solid var(--line);border-radius:6px;font:500 12px "IBM Plex Sans",sans-serif;padding:3px 9px;cursor:pointer}
.sumbox.collapsed .gsec,.sumbox.collapsed .intro,.sumbox.collapsed .tsums{display:none}
.sumbox.collapsed h2{margin-bottom:0}
.sumbox .kicker{padding-right:150px}
.agdest{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.agdest li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.fl{font-size:18px;line-height:1.2}
.agnx{margin:10px 0 0}
.agc{margin-bottom:16px}
.agcn{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.agcn .fl{font-size:22px}
table.cal{table-layout:fixed;min-width:760px;border:1px solid var(--p1)}
table.cal th{background:var(--p1);color:#fff;text-align:center;font-size:12px;text-transform:none;letter-spacing:0;padding:4px;border-right:1px solid #ffffff40}
table.cal th span{display:block;font-weight:400;font-size:11px;color:var(--p2)}
table.cal td{border-right:1px solid var(--line);padding:4px 6px;height:58px;vertical-align:top}
.ce{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3;padding:2px 4px;border-radius:3px}
.ce .cn em{display:block;font-style:italic;color:var(--ink3);font-size:11px}
.ce .ch{white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.ce.hl{background:var(--p4);font-weight:600;color:#3a1400}
.ce.hl .ch,.ce.hl em{color:#5a2200}
.hlk{display:inline-block;width:12px;height:10px;background:var(--p4);border-radius:2px;margin-right:4px;vertical-align:middle}
.agtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dl{background:var(--p1);color:#fff;border:0;border-radius:6px;font:500 12.5px "IBM Plex Sans",sans-serif;padding:6px 12px;cursor:pointer}
.dl:hover{filter:brightness(1.1)}
.agx{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:18px 22px}
@media (max-width:600px){.agx{grid-template-columns:1fr}}
.agc{margin:0}
table.cal{table-layout:auto;min-width:0;border:0;width:100%;font-size:12.5px}
table.cal th{background:none;color:var(--ink3);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px;border:0;border-bottom:1.5px solid var(--p1)}
table.cal th.n,table.cal td.n{text-align:right;white-space:nowrap}
table.cal td{border:0;border-bottom:1px solid var(--line);padding:4px 6px;height:auto;vertical-align:baseline}
table.cal td.cd{white-space:nowrap;color:var(--ink2);font-weight:500}
table.cal td.ct2{white-space:nowrap;color:var(--ink3);font-variant-numeric:tabular-nums}
table.cal td.at{font-weight:600;color:var(--ink)}
table.cal tr.hi td{background:rgba(250,181,143,.22)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p5);margin-right:6px;vertical-align:middle}
@media (max-width:600px){table.cal td.ct2,table.cal th:nth-child(2){display:none}}
.pngbox{position:fixed;left:-10000px;top:0;padding:0;background:var(--panel);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.pngbox .agx{grid-template-columns:1fr 1fr}
.pnghead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--p1);padding-bottom:10px;margin-bottom:14px}
.pngk{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.pngt{font:600 22px/1.2 "IBM Plex Serif",Georgia,serif;color:var(--p1)}
.pngb{font-size:12px;color:var(--ink3)}
.pngbox .agdest{margin-bottom:16px}
.mtx{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.mtx thead th{background:var(--p1);color:#fff;text-align:left;font-size:11px;text-transform:none;letter-spacing:0;padding:4px 6px;font-weight:600}
.mtx thead th span{font-weight:400;color:var(--p2);margin-left:2px}
.mtx th.pc{width:46px;text-align:center}
.mtx tbody th.pc{background:var(--soft);color:var(--ink3);text-transform:none;letter-spacing:0;font-size:10px;font-weight:600;vertical-align:middle;padding:2px;border-bottom:1px solid var(--line);text-align:center}
.mtx tbody th.pc .fl{display:block;font-size:16px;line-height:1}
.mtx td{vertical-align:top;padding:2px 3px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.mx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:6px;padding:1px 4px;border-radius:3px;margin-bottom:1px;line-height:1.25}
.mx:last-child{margin-bottom:0}
.mx.hi{background:rgba(250,181,143,.28)}
.mxh{color:var(--ink3);font-size:11px}
.mxv{font-size:11px;white-space:nowrap;margin-left:auto}.mxv b{color:var(--ink)}
.vs{color:var(--ink3)}
.pngbox{width:1600px;padding:0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Painel de Notícias <span>| Henrique Behrens</span></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar notícias…" aria-label="Buscar">
        <select id="fv" aria-label="Filtrar por veículo"><option value="">Todos os veículos</option></select>
        <button id="theme" title="Alternar tema">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>Painel gerado automaticamente a partir de páginas públicas, sem login. Resumos de notícias baseados em título, linha-fina e descrição pública de cada matéria. Horários em BRT (UTC−3); “≈” indica horário estimado a partir de indicação relativa (“há 2 horas”).</footer>

<script>
const BASE={v:'https://valor.globo.com',og:'https://oglobo.globo.com',f:'https://www1.folha.uol.com.br',fc:'https://c-level.folha.uol.com.br',p:'https://www.poder360.com.br',c:'https://www.cnnbrasil.com.br',m:'https://www.metropoles.com',e:'https://www.estadao.com.br',vj:'https://veja.abril.com.br',bj:'https://braziljournal.com',r:'https://www.reuters.com',ft:'https://www.ft.com/content/',fgv:'https://portalibre.fgv.br',bcb:'https://www.bcb.gov.br'};
const VNAME={v:'Valor',og:'O Globo',f:'Folha',fc:'Folha',p:'Poder360',c:'CNN Brasil',m:'Metrópoles',e:'Estadão',vj:'Veja',bj:'Brazil Journal',r:'Reuters',ft:'Financial Times',fgv:'FGV IBRE',bcb:'BCB',fed:'Federal Reserve',boj:'BoJ',ibge:'IBGE'};
function U(s){const i=s.indexOf(':');const k=s.slice(0,i);if(k==='https')return s;return (BASE[k]||'')+s.slice(i+1)}
function S(k){return VNAME[k]||k}

const DATA={"meta": {"edicao": "Quinta-feira, 5 de novembro de 2026", "gerado": "05/11/2026 ≈06h00 (execução agendada)", "janela": "04/11 12h00 → 05/11 06h00 (18h)"}, "geral": [{"h": "Política: maioridade penal vai à Câmara e Lula prepara o Lula 4", "p": "Alcolumbre fechou acordo com Hugo Motta e deixou a PEC da maioridade penal para a Câmara, onde o relator Mendonça Filho quer votar até o fim de novembro e admite negociar quais crimes entram (Poder360, O Globo). O PL acusa o Senado de se submeter à Câmara, e a oposição fala em “tentativa de enganar o eleitor” (Estadão). Randolfe pediu a anulação do voto de Flávio Bolsonaro na PEC da Segurança, registrado dos EUA, e Alcolumbre disse que vai analisar (Folha). A disputa pelo comando do Senado esquentou com farpas entre Alcolumbre e Marinho (O Globo). No governo, o PT pediu aos partidos planos para ministérios (Folha), Fonteles é alvo de fogo amigo enquanto Lula avalia nomes para a Fazenda (Folha), e o presidente fará pronunciamento na TV no domingo reforçando a responsabilidade fiscal (Valor). Leitura analítica: a sinalização fiscal antes da definição da equipe tenta conter o prêmio de risco sem antecipar nomes."}, {"h": "Mercado doméstico: Copom pausa em 13,75% e ativos se recuperam", "p": "O Copom manteve a Selic em 13,75% e interrompeu uma sequência de cinco cortes, como esperava a maioria do mercado (Valor, Poder360). O comunicado citou piora das projeções: o IPCA de 2026 foi a 5,6% (Poder360) e o de 2027 subiu de 3,9% para 4,7%, acima do teto da meta (O Globo). Aliados de Lula criticaram a decisão, e Lindbergh Farias falou em “vergonha” (Valor). Sobre os próximos passos, há leituras diferentes: a Fernanda Guardado vê manutenção até pelo menos abril (Estadão), enquanto analistas ouvidos por Poder360 e CNN já falam em Selic parada até 2027 (divergência de horizonte). Antes da decisão, o Ibovespa subiu 1,23%, a 167.563 pontos, o dólar caiu 0,56%, a R$ 5,4592 (Investing; PTAX de R$ 5,4778, BCB), e o DI de 10 anos recuou ≈39 bps, a 15,29%, com alívio externo e expectativa de anúncio fiscal (Valor). O Caged de setembro decepcionou: 121,3 mil vagas, contra consenso de 171 mil, o pior setembro desde 2020 (Valor, Investing)."}, {"h": "Fiscal, tributário e inflação: sai a MP do Imposto Seletivo", "p": "O governo publicou a MP do Imposto Seletivo: a cobrança começa em 2 de fevereiro de 2027, com transição até 2028, e deve arrecadar R$ 41,9 bilhões no ano que vem (Valor). As alíquotas replicam a carga atual do IPI sobre cigarros, bebidas e carros (O Globo); destilados chegam a 66% (CNN) e minerais têm alíquota zero em 2027 (Poder360). O setor produtivo pressiona: a CNI pediu à Fazenda o adiamento da reforma (O Globo) e diz que a CBS de 11,3% eleva a carga (Folha), e a OAB defende adiar para 2028 (Estadão). No Orçamento de 2027, o socorro aos Correios e a queda de 40% nos dividendos de estatais abrem um buraco de R$ 26 bilhões (O Globo). O Senado aprovou regra para reestruturar dívidas de estados e municípios (CNN), e Eduardo Gomes (PL) será o relator da LDO (Poder360). Na inflação, a Fipe aponta alimentos ainda em alta em outubro, mas perdendo força (Folha); o IPCA sai em 12/11."}, {"h": "Internacional: Congresso democrata e Trump na defensiva", "p": "Com as duas Casas sob controle democrata, Trump admitiu a derrota, se eximiu de culpa e acenou com o poder de veto (Valor); a Reuters vê os democratas ganhando influência sobre o comércio, mas esbarrando no veto para derrubar tarifas. Mike Johnson deixará a liderança republicana na Câmara (Poder360); Veja e Metrópoles falam em renúncia ao cargo (divergência de formulação). Vance atribuiu a derrota à guerra no Irã (WSJ, NYT), e DeSantis falou em “evento de extinção” (Bloomberg). Nos mercados, o Dow subiu 3,03%, o melhor dia desde abril de 2025 (Valor), enquanto o FT destaca o melhor dia das bolsas americanas desde agosto (divergência de referência). As empresas de Musk perderam ≈US$ 130 bilhões (Bloomberg, Folha; Veja fala em US$ 120 bi). Nos dados, o ADP veio em 86 mil (consenso de 67 mil) e o ISM de serviços em 54,5 (consenso de 54,8). Hoje o BoE decide às 9h (consenso de alta para 4,00%) e, na sexta, sai o payroll (consenso de 63 mil)."}, {"h": "Geopolítica e empresas: petróleo desaba, Paraguai em crise e safra de balanços", "p": "O petróleo despencou ≈9% com a expectativa de fim do conflito entre EUA e Irã (O Globo): o Brent fechou a US$ 94,62 (−8,67%, Investing), abaixo de US$ 100 pela primeira vez desde agosto (FT). A Reuters vê Trump diante da escolha entre acordo e escalada, a Coreia do Sul anunciou missão naval para manter Ormuz aberto (Estadão), e o FT revela que a Rússia aprofundou o apoio militar a Teerã. No Paraguai, a intervenção no Ueno Bank, ligado ao presidente Santiago Peña, suspendeu saques, derrubou o presidente do BC e gerou pedido de impeachment (Estadão, Bloomberg, CNN). Em Hong Kong, Joshua Wong pegou mais dez anos de prisão (Reuters). Nos balanços, Vibra (+504%), Prio (+468%), Axia (R$ 1,1 bi, abaixo do esperado, segundo a Folha), C&A e Smart Fit lucraram mais, enquanto GPA, Dexco e Tenda pioraram. A Heineken comprou a Better Drinks, e a Viridis fechou contrato com a Solvay para terras raras."}, {"h": "Fechamento dos mercados (Américas e Europa em 04/11; Ásia em 05/11)", "p": "Bolsas: Ibovespa 167.563 pts (+1,23%); S&P 500 7.688,62 (+1,58%); Nasdaq 25.736,51 (+1,44%); Dow Jones 53.356,12 (+3,03%); Stoxx 600 657,40 (+1,82%); DAX 26.437,67 (+2,22%); FTSE 100 10.829,21 (+1,79%). Ásia em 05/11: Nikkei 61.158 (−2,47%); Hang Seng 24.791 (+3,64%); Xangai 3.689,91 (+0,10%). Juros de 10 anos: Brasil 15,29% (−39 bps); EUA 4,892% (−5,8 bps) e 2 anos 4,581% (−3,3 bps); Alemanha 3,287% (−2,4 bps); Reino Unido 5,137% (−13,2 bps); Japão 2,766% (−5,3 bps, em 05/11); China 1,593% (−3,8 bps, em 05/11). Moedas: USD/BRL 5,4592 (−0,56%, Investing; PTAX de 5,4778); DXY 101,57 (−0,30%); EUR/USD 1,1229 (+0,31%); USD/JPY 158,45 (−0,14%); USD/CNY 6,6736 (+0,04%). Commodities: Brent US$ 94,62 (−8,67%); WTI US$ 88,12 (−8,29%); ouro US$ 4.073,00 (+3,37%); cobre US$ 6,429/lb (+0,42%); soja 1.202,25 c/bu (−0,97%); minério 62% US$ 91,95 (+1,01%). Fonte: histórico do Investing (as linhas de 05/11 da Europa, das moedas e das commodities são intradiárias e ficaram de fora)."}], "top10": [{"t": "Copom mantém Selic em 13,75% e interrompe ciclo de cortes", "d": "Decisão confirmou a aposta majoritária, mas o BC elevou as projeções: IPCA de 5,6% em 2026 e de 4,7% em 2027, acima do teto. Sem pistas sobre os próximos passos.", "w": "Fecha a porta para cortes no curto prazo e transfere ao governo, via sinal fiscal, o ônus de destravar os juros.", "s": [["v", "v:/financas/noticia/2026/11/04/bc-mantem-selic-em-1375percent-ao-ano-e-interrompe-sequencia-de-cinco-cortes.ghtml"], ["p", "p:/poder-economia/aceleracao-da-inflacao-justifica-selic-em-1375-diz-copom/"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-04/brazil-holds-key-rate-steady-at-13-75-after-lula-s-election-win"]]}, {"t": "Ativos locais reagem com alívio externo e expectativa de anúncio fiscal", "d": "Ibovespa +1,23%, dólar a R$ 5,46 e DI de 10 anos em queda de ≈39 bps. Lula fará pronunciamento no domingo reforçando a responsabilidade fiscal.", "w": "Mostra quanto do estresse recente é prêmio fiscal: o mercado reage a sinais antes mesmo da definição da equipe.", "s": [["v", "v:/financas/noticia/2026/11/04/juros-futuros-despencam-com-apoio-externo-e-expectativa-por-anuncio-fiscal.ghtml"], ["v", "v:/politica/noticia/2026/11/05/na-tv-lula-reforcara-responsabilidade-fiscal.ghtml"]]}, {"t": "Trump admite derrota e acena com veto; Johnson deixa a liderança", "d": "Democratas prometem conter o presidente, com investigações e pressão sobre tarifas; Vance culpa a guerra no Irã. Republicanos trocam acusações.", "w": "Dois anos de governo dividido mudam o risco de política comercial, fiscal e externa dos EUA, inclusive para o Brasil.", "s": [["r", "r:/legal/government/democrats-vow-rein-trump-he-shows-off-white-hou a Câmara após acordo Alcolumbre-Motta", "d": "Relator quer votar até o fim de novembro e admite negociar os crimes abrangidos. PL e oposição criticam a manobra.", "w": "Governo ganha tempo numa pauta popular e espinhosa às vésperas da disputa pelo comando do Senado.", "s": [["p", "p:/poder-congresso/alcolumbre-deixa-maioridade-penal-para-a-camara-apos-acordo-com-motta/"], ["og", "og:/politica/noticia/2026/11/05/relator-admite-negociar-crimes-abrangidos-pela-reducao-da-maioridade-penal-e-defende-prisao-separada-para-adolescentes.ghtml"]]}, {"t": "Caso Master: Fachin dá 15 dias à PGR sobre indiciamento de Vorcaro", "d": "Prazo vale para Vorcaro e mais 14 indiciados. Mensagens mostram Rueda e Vorcaro discutindo operação de R$ 320 milhões do BRB.", "w": "Mantém o caso no STF e amplia o risco político para o União Brasil.", "s": [["v", "v:/financas/noticia/2026/11/04/fachin-da-15-dias-para-pgr-se-manifestar-sobre-indiciamento-de-vorcaro-e-mais-14.ghtml"], ["p", "p:/poder-economia/rueda-e-vorcaro-discutiram-operacao-de-r-320-milhoes-do-brb/"]]}, {"t": "Quebra do Ueno Bank abre crise política no Paraguai", "d": "BC suspendeu saques do maior banco digital do país, ligado a Santiago Peña; o presidente do BC caiu e a oposição pede impeachment.", "w": "Crise bancária num parceiro do Mercosul e de Itaipu, com paralelos ao caso Master.", "s": [["e", "e:/economia/paraguai-banco-central-decreta-suspensao-de-saques-do-ueno-bank-ligado-ao-presidente-do-pais/"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-04/paraguay-names-new-central-banker-after-lender-is-taken-over"], ["c", "c:/internacional/crise-bancaria-provoca-pedido-de-impeachment-contra-presidente-do-paraguai/"]]}, {"t": "Onda azul mexe com Wall Street: Dow dispara, Musk perde US$ 130 bi", "d": "Dow +3,03%, melhor dia desde abril de 2025; big techs sobem com aposta em freio aos gastos com IA, enquanto as empresas de Musk recuam.", "w": "O mercado reprecifica regulação de IA, data centers e tarifas sob um Congresso democrata.", "s": [["v", "v:/financas/noticia/2026/11/04/em-ny-dow-jones-dispara-e-tem-o-melhor-dia-desde-abril-de-2025-apos-as-midterms.ghtml"], ["Bloomberg", "https://www.bloomberg.com/news/articles/2026-11-04/tesla-spacex-shares-take-early-hit-as-midterm-blue-wave-unfolds"], ["WSJ", "https://www.wsj.com/politics/elections/the-winners-and-losers-on-wall-street-from-the-election-earthquake-55ff9cd4"]]}], "secoes": [{"id": "brasil", "nome": "Brasil", "cls": "sec-br", "resumo": "A sessão no Brasil girou em torno do Copom, que manteve a Selic em 13,75% e encerrou o ciclo de cortes com projeções de inflação piores, e da reação política à decisão. Os ativos se recuperaram com o alívio externo e a promessa de um pronunciamento fiscal de Lula no domingo, mas o Caged fraco reforçou o risco de estagflação. No Congresso, a maioridade penal foi para a Câmara, e o governo publicou a MP do Imposto Seletivo.", "temas": [{"n": "Destaques", "r": "O Copom pausou em 13,75% e elevou as projeções de inflação, e a política reagiu com críticas de aliados de Lula. O mercado ganhou fôlego com o petróleo em queda e a expectativa de anúncio fiscal, mas o Caged de setembro decepcionou. A MP do Imposto Seletivo saiu, e a maioridade penal mudou de Casa.", "i": [["≈20h00 (04/11)", "v", "BC mantém Selic em 13,75% e interrompe ciclo de corte de juros após cinco reuniões", "Decisão ratificou expectativa do mercado com piora de projeções após eleição.", "v:/financas/noticia/2026/11/04/bc-mantem-selic-em-1375percent-ao-ano-e-interrompe-sequencia-de-cinco-cortes.ghtml"], ["≈05h55", "v", "Com 121 mil vagas, Caged tem o pior setembro desde 2020", "Resultado abaixo da expectativa mostra enfraquecimento da atividade e do mercado de trabalho.", "v:/brasil/noticia/2026/11/05/com-121-mil-vagas-caged-tem-o-pior-setembro-desde-2020.ghtml"], ["≈05h10", "v", "Na TV, Lula reforçará responsabilidade fiscal", "Em pronunciamento no domingo, presidente também dirá que manterá políticas sociais.", "v:/politica/noticia/2026/11/05/na-tv-lula-reforcara-responsabilidade-fiscal.ghtml"], ["22h53 (04/11)", "e", "Governo publica MP do ‘imposto do pecado’, que terá transição em 2027; veja produtos e alíquotas", "—", "e:/economia/governo-lula-publica-mp-do-imposto-do-pecado-que-tera-transicao-em-2027-veja-produtos-atingidos/"], ["18h12 (04/11)", "p", "Alcolumbre deixa maioridade penal para a Câmara após acordo com Motta", "Presidente do Senado aguardará a conclusão da comissão especial na Câmara.", "p:/poder-congresso/alcolumbre-deixa-maioridade-penal-para-a-camara-apos-acordo-com-motta/"]]}, {"n": "Política e Congresso", "r": "A maioridade penal saiu da pauta do Senado: Alcolumbre e Motta acertaram que a Câmara vota primeiro, e o relator Mendonça Filho admite negociar o alcance e quer votar até o fim do mês. O PL fala em Senado “submetido à Câmara”. Randolfe questiona o voto remoto de Flávio Bolsonaro, que discursa hoje no CPAC em Mar-a-Lago. A campanha pelo comando do Senado ganhou farpas entre Alcolumbre e Marinho, e Alcolumbre rebateu a oposição sobre as urnas. No Executivo, o PT sonda partidos para o Lula 4, Edinho Silva recebe a missão de renovar o partido, Fonteles sofre fogo amigo para a Fazenda e circulam nomes para o futuro Ministério da Segurança. No Rio, Paes pede a cassação da chapa de Douglas Ruas.", "i": [["≈04h00", "og", "Relator admite negociar crimes abrangidos pela redução da maioridade penal e defende prisão separada para adolescentes", "Mendonça Filho quer votar a proposta até o fim de novembro.", "og:/politica/noticia/2026/11/05/relator-admite-negociar-crimes-abrangidos-pela-reducao-da-maioridade-penal-e-defende-prisao-separada-para-adolescentes.ghtml"], ["21h25 (04/11)", "p", "PL critica manobra por maioridade penal: “Senado submetido à Câmara”", "Carlos Portinho diz que envio do tema à Câmara quebra acordo com o governo.", "p:/poder-congresso/pl-critica-manobra-por-maioridade-penal-senado-submetido-a-camara/"], ["19h50 (04/11)", "e", "Oposição critica Lul resso impõe ‘derrota moral’ a Trump, mas não é freio à agenda para Brasil e América Latina", "<span class=\"flag\">Divergência</span> O Globo vê pouco impacto na política externa, concentrada no Executivo; Planalto e Folha apostam em pressão maior sobre tarifas.", "og:/mundo/noticia/2026/11/05/perda-do-congresso-impoe-derrota-moral-a-trump-mas-nao-e-freio-a-agenda-para-brasil-e-america-latina.ghtml"], ["22h51 (04/11)", "vj", "Por que a derrota de Trump nas eleições pode atingir a família Bolsonaro", "—", "vj:/mundo/por-que-a-derrota-de-trump-nas-eleicoes-pode-atingir-a-familia-bolsonaro/"], ["20h18 (04/11)", "f", "Aumento do consumo de energia de Itaipu pelo Paraguai deve pressionar preços no Brasil, diz Itaú BBA", "Pico às 18h nos dois países aperta a oferta.", "f:/mercado/2026/11/aumento-do-consumo-de-energia-de-itaipu-pelo-paraguai-deve-pressionar-precos-no-brasil-diz-itau-bba.shtml"]]}, {"n": "Agenda", "r": "Hoje: produção industrial de setembro às 9h (consenso de −0,2% m/m e −1,7% a/a, Investing; IBGE) e PMI de serviços às 10h. Lula faz a primeira reunião do conselho de minerais críticos e uma live com André Janones. Na sexta, o IBGE divulga dados do Sistema de Contas Nacionais, a FGV publica o IVAR e sai a balança comercial de outubro. No domingo, o pronunciamento de Lula na TV. Na próxima semana, IPC-S e IGP-DI (09/11), ata do Copom (10/11), PMS (11/11) e IPCA (12/11).", "i": [["—", "Investing", "05/11 · 09h00 · Produção industrial (set)", "Consenso de −0,2% m/m e −1,7% a/a; anterior, −0,6% m/m.", "https://br.investing.com/economic-calendar/"], ["—", "Investing", "05/11 · 10h00 · PMI de serviços S&P Global (out)", "Anterior: 49,2; composto, 47,4.", "https://br.investing.com/economic-calendar/"], ["—", "p", "05/11 · Conselho de minerais críticos", "Primeira reunião do colegiado vinculado ao Planalto.", "p:/poder-governo/lula-faz-a-1a-reuniao-do-conselho-de-minerais-criticos-na-5a-feira/"], ["—", "ibge", "06/11 · Sistema de Contas Nacionais", "Próximas divulgações do IBGE.", "https://agenciadenoticias.ibge.gov.br/"], ["—", "Investing", "06/11 · 15h00 · Balança comercial (out)", "Anterior: US$ 7,74 bi.", "https://br.investing.com/economic-calendar/"], ["—", "v", "08/11 · Pronunciamento de Lula na TV", "Responsabilidade fiscal e manutenção das políticas sociais.", "v:/politica/noticia/2026/11/05/na-tv-lula-reforcara-responsabilidade-fiscal.ghtml"], ["—", "fgv", "09/11 · IPC-S e IGP-DI (out)", "Próximas divulgações do FGV IBRE.", "fgv:/"]]}]}, {"id": "intl", "nome": "Internacional", "cls": "sec-in", "resumo": "O noticiário internacional seguiu dominado pelo rescaldo das midterms: Trump admitiu a derrota, ameaça vetar a agenda democrata e vê o partido rachar, com Vance culpando a guerra no Irã. O petróleo despencou com a aposta num fim do conflito, enquanto Rússia e Houthis complicam o quadro no Golfo. Na Europa, a França se prepara para uma greve geral e a inflação mantém o BCE no rumo de nova alta; na Ásia, Joshua Wong foi condenado a mais dez anos e a China endureceu na frente comercial.", "temas": [{"n": "Guerra e Conflitos", "r": "A derrota eleitoral deixa Trump diante de uma escolha entre acordo e escalada no Irã (Reuters), com parte do governo defendendo dobrar a aposta militar (WSJ). O mercado apostou no fim do conflito, e o petróleo despencou. No Golfo, a Coreia do Sul anunciou missão naval para manter Ormuz aberto, o FT revela que a Rússia ampliou o apoio militar a Teerã com lançadores de mísseis, e os Houthis pediram US$ 51 bilhões à Arábia Saudita para fazer a paz (WSJ). Encomendas bilionárias complicam o fim da ajuda militar a Israel. Na Ucrânia, a Rússia voltou a atacar alvos logísticos, Zelensky espera mais ajuda dos EUA, e dois altos funcionários da segurança foram afastados por corrupção. A Coreia do Norte testou um míssil antiaéreo.", "i": [["—", "r", "Beaten at home, Trump faces stark choice on Iran: deal or escalation", "Derrotado em casa, Trump enfrenta escolha no Irã: acordo ou escalada (04/11).", "r:/wo  eleições (04/11).", "r:/world/zelenskiy-hopes-us-election-outcome-will-generate-more-help-ukraine-2026-11-04/"], ["≈02h00", "og", "Dois altos funcionários da segurança da Ucrânia são destituídos por caso de corrupção", "—", "og:/mundo/noticia/2026/11/05/dois-altos-funcionarios-da-seguranca-da-ucrania-sao-destituidos-por-caso-de-corrupcao.ghtml"], ["—", "r", "North Korea says it tested air-defence missile, staged cruise missile drill", "Coreia do Norte testa míssil antiaéreo e faz exercício com mísseis de cruzeiro (04/11).", "r:/world/asia-pacific/north-korea-test-fires-new-air-defence-missile-system-kcna-reports-2026-11-04/"]]}, {"n": "EUA", "r": "Trump admitiu a derrota, se eximiu de culpa e prometeu usar o veto, enquanto exibia o novo salão de festas da Casa Branca. Os democratas prometem investigações e ganham influência sobre o comércio, mas não têm votos para derrubar vetos (Reuters). O Partido Republicano entrou em guerra interna: Vance culpou a guerra no Irã, DeSantis falou em “evento de extinção”, e Mike Johnson deixará a liderança. Poder360 diz que ele não disputará a liderança da minoria; Veja e Metrópoles falam em renúncia ao cargo (divergência). A mídia de Murdoch esfria com Trump (FT), Alito não vai se aposentar já (NYT), e a corrida de 2028 começou. Nos dados, ADP de 86 mil (consenso de 67 mil) e ISM de serviços de 54,5 (consenso de 54,8).", "i": [["—", "r", "Democrats vow to rein in Trump as he shows off White House ballroom", "Democratas prometem conter Trump enquanto ele exibe o salão de festas da Casa Branca (05/11).", "r:/legal/government/democrats-vow-rein-trump-he-shows-off-white-house-ballroom-2026-11-05/"], ["≈05h10", "v", "Trump admite derrota de seu partido, se exime de culpa e acena com poder de veto", "Presidente lembrou que o veto é “inabalável”.", "v:/impresso/noticia/2026/11/05/trump-admite-derrota-de-seu-partido-se-exime-de-culpa-e-acena-com-poder-de-veto.ghtml"], ["—", "r", "Democrats gain sway over trade but face Trump veto wall", " f", "Em 1ª aparição após derrota histórica de seu partido, Trump quis falar de lustres", "—", "f:/mundo/2026/11/em-1a-aparicao-apos-derrota-historica-de-seu-partido-trump-quis-falar-de-lustres.shtml"], ["—", "Bloomberg", "The 2028 Contenders Rising and Falling After Democrats' Big Night", "Quem sobe e quem cai na corrida de 2028 (04/11).", "https://www.bloomberg.com/news/features/2026-11-04/2028-presidential-winners-and-losers-after-democrats-win-big-in-midterms"], ["—", "ft", "Democratic wave keeps US wealth taxes alive despite California loss", "Onda democrata mantém viva a taxação de fortunas, apesar da derrota da Proposição 40 na Califórnia.", "ft:c701ac0d-0ef4-426f-a629-e38ed29d5260"]]}, {"n": "Europa", "r": "A inflação de outubro (4,0%) mantém o BCE no rumo de mais uma alta, e o FT mapeia os favoritos à sucessão de Lagarde, que fala hoje às 15h. A França enfrenta nova onda de protestos e prepara-se para uma greve geral. Hackers atacaram sistemas na França, de bancos de sangue a um banco (Crédit Mutuel Arkéa, ≈R$ 615 milhões) e freezers de supermercados. A Ucrânia ficou atrás da Moldávia no calendário de adesão à UE, a Espanha vai elevar o salário mínimo em 5,3% antes da eleição, e as bolsas europeias renovam recordes. Hoje, o BoE decide às 9h (consenso de alta de 3,75% para 4,00%).", "i": [["—", "ft", "October inflation in the Eurozone keeps ECB on course for another tightening", "Inflação de outubro mantém o BCE no rumo de novo aperto.", "ft:a3da6c3a-4ab3-413c-bbeb-490d7cde34dc"], ["—", "ft", "The views of the frontrunners to succeed Lagarde at the ECB", "As posições dos favoritos à sucessão de Lagarde.", "ft:cd2c9cef-1ad6-4aa5-ab3f-bffdf7175593"], ["—", "ft", "Ukraine falls behind Moldova on path to EU membership", "Ucrânia fica atrás da Moldávia na adesão à UE.", "ft:6ccf470f-176f-436f-baa7-e5ac6b4cf20f"], ["05h18", "m", "Banco francês perde cerca de R$ 615 milhões em ataque hacker", "Crédit Mutuel Arkéa diz que ativos de clientes não foram afetados.", "m:/mundo/banco-frances-sofre-ataque-hacker-e-perde-cerca-de-r-615-milhoes"], ["—", "WSJ", "Hackers Crank the Heat on Europe’s Supermarket Freezers to Above 120 Degrees", "Hackers elevam a temperatura de freezers de supermercados europeus.", "https://www.wsj.com/tech/cybersecurity/hackers-crank-the-heat-on-europes-supermarket-freezers-to-above-120-degrees-73597a8a"], ["16h25 (04/11)", "p", "Hackers invadem sistemas de bancos de sangue na França", "Estoques não foram comprometidos.", "p:/poder-internacional/hackers-invadem-sistemas-de-bancos-de-sangue-na-franca/"], ["—", "Bloomberg", "Spain to Increase Minimum Wage by 5.3% Ahead of Key Election", "Espanha elevará o salário mínimo em 5,3% antes de eleição (05/11).", "https://www.bloomberg.com/news/articles/2026-11-05/spain-to-increase-minimum-wage-by-5-3-ahead-of-key-election"], ["—", "Bloomberg", "European Stocks Hit Fresh Record as AI Unwind Boosts Region", "Bolsas europeias renovam recorde com a saída da IA (05/11).", "https://www.bloomberg.com/news/articles/2026-11-05/european-stocks-hit-fresh-record-as-ai-unwind-boosts-region"]]}, {"n": "China", "r": "Joshua Wong foi condenado a mais dez anos de prisão em Hong Kong com base na lei de segurança nacional. Na frente comercial, Pequim condiciona compras agrícolas dos EUA a cortes recíprocos de tarifas, o vice-premiê rebateu críticas na feira de importação, e a China bloqueou a compra da divisão de robótica da ABB pela SoftBank (US$ 5,4 bi). O governo reforça a defesa da bolsa para reavivar o boom de IA. A Reuters vê ganho de curto prazo para a China com o revés de Trump, e Taiwan espera manter o apoio em armas.", "i": [["—", "r", "Hong Kong court sentences activist Joshua Wong to 10 years on national security charge", "Joshua Wong condenado a 10 anos com base na lei de segurança nacional (05/11).", "r:/world/hong-kong-court-sentences-activist-joshua-wong-10-years-national-security-charge-2026-11-05/"], ["—", "r", "China says US farm purchases hinge on tariff-cut deal", " bi-no-4-tri-com-expansao-por-data-centers/"], ["—", "ft", "Microsoft rejects multibillion-dollar AI deal with UK’s Nscale", "Microsoft recusa ampliar contrato de IA com a Nscale antes do IPO.", "ft:668e6ef8-88a1-4bef-8664-8f495baf09f8"], ["—", "ft", "‘The money didn’t work’: Big Tech’s $600mn midterm campaign falls flat", "Campanha de US$ 600 mi das big techs nas midterms fracassa.", "ft:3e65138f-068f-465f-a1ae-a9c61ea1afc4"]]}, {"n": "Saúde", "r": "A Pague Menos teve receita abaixo do consenso, mas compensou no Ebitda e no lucro. Nos EUA, a CVS anunciou o desmembramento da rede de drogarias, e a ação caiu 12%.", "i": [["19h03 (04/11)", "bj", "Pague Menos decepciona na receita, mas compensa no EBITDA e lucro", "—", "bj:/pague-menos-decepciona-na-receita-mas-compensa-no-ebitda-e-lucro"], ["16h15 (04/11)", "bj", "CVS anuncia spinoff de drogarias. Ação desaba 12%", "—", "bj:/cvs-anuncia-spinoff-de-drogarias-acao-desaba-12"]]}, {"n": "Automotivo", "r": "A venda de veículos novos cresceu 1,87% em outubro (Fenabrave), mas o déficit comercial de automóveis saltou 835% com a invasão chinesa e a perda da Argentina. Lá fora, a Toyota disparou 17% com a demanda por híbridos (FT).", "i": [["≈21h00 (04/11)", "v", "Venda de veículos novos cresce 1,87% em outubro, aponta Fenabrave", "Alta de 16,14% no acumulado do ano.", "v:/empresas/noticia/2026/11/04/venda-de-veiculos-novos-cresce-187percent-em-outubro-aponta-fenabrave.ghtml"], ["≈05h10", "v", "Déficit de automóveis cresce 835% com invasão chinesa e perda argentina", "Saldo negativo de US$ 5,5 bi de janeiro a setembro.", "v:/brasil/noticia/2026/11/05/deficit-de-automoveis-cresce-835-com-invasao-chinesa-e-perda-argentina.ghtml"], ["05h00", "c", "Montadoras da China avançam globalmente e preparam novas cartadas", "—", "c:/blogs/ciro-dias-reis/economia/money/macroeconomia/montadoras-da-china-avancam-globalmente-e-preparam-novas-cartadas/"]]}, {"n": "Infraestrutura, Transporte & Logística", "r": "A Mills lucrou R$ 130 milhões (+94,5%) e a Simpar reverteu o prejuízo. A hidrovia do São Francisco passa para a Bahia, a chinesa CCCC quer tratar de leilões com o governo, e a Embraer busca expansão na Índia. A CNI aponta o transporte como principal gargalo da indústria, e a Maersk cai com projeção abaixo do esperado.", "i": [["≈22h00 (04/11)", "v", "Mills lucra R$ 130 milhões no 3º trimestre", "Alta de 94,5% sobre o ano anterior.", "v:/empresas/noticia/2026/11/04/mills-lucra-r-130-milhoes-no-3o-trimestre.ghtml"], ["≈21h00 (04/11)", "v", "Simpar reverte prejuízo e lucra R$ 35,2 milhões no 3º trimestre", "—", "v:/empresas/noticia/2026/11/04/simpar-reverte-prejuzo-e-lucra-r-352-milhes-no-3-trimestre.ghtml"], ["22h58 (04/11)", "p", "Governo federal transfere hidrovia do São Francisco para a Bahia", "R$ 300 milhões em aportes federais em nove anos.", "p:/poder-infra/governo-federal-transfere-hidrovia-do-sao-francisco-para-a-bahia/"], ["21h36 (04/11)", "p", "Empresa chinesa quer audiência com ministro para tratar de leilões", "Reunião com a CCCC será marcada nas próximas semanas.", "p:/poder-infra/empresa-chinesa-quer-audiencia-com-ministro-para-tratar-de-leiloes/"], ["23h00 (04/11)", "fc", "Embraer busca expansão na Índia com venda de avião comercial e produção de aeronave militar", "—", "fc:/negocios/2026/11/embraer-busca-expansao-na-india-com-venda-de-aviao-comercial-e-producao-de-aeronave-militar.shtml"], ["06h00", "m", "CNI: transporte é principal gargalo para 75% dos empresários industriais", "91% dizem que os custos logísticos subiram na última década.", "m:/brasil/cni-transporte-e-principal-gargalo-para-75-dos-empresarios-industriais"], ["—", "Bloomberg", "Maersk Slides as Upgraded Guidance Is Lower Than Anticipated", "Maersk cai com revisão de projeção abaixo do esperado (05/11).", "https://www.bloomberg.com/news/articles/2026-11-05/maersk-slides-as-upgraded-guidance-is-lower-than-anticipated"]]}, {"n": "Construção & Imobiliário", "r": "A Dexco reverteu o lucro e teve prejuízo, com o fechamento de /* ---------- render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={tab:'geral',q:'',v:'',col:false};
try{const t=localStorage.getItem('pn_theme');if(t)document.documentElement.dataset.theme=t;const tb=localStorage.getItem('pn_tab');state.col=!!localStorage.getItem('pn_col');if(tb)state.tab=tb}catch(e){}

function card(it,sec,tema){
  const [h,v,t,d,u]=it;
  const est=h.startsWith('≈')||h==='—';
  return `<article class="card" data-v="${v}" data-s="${esc((t+' '+d.replace(/<[^>]+>/g,'')).toLowerCase())}">
  <a class="ct" href="${esc(U(u))}" target="_blank" rel="noopener">${esc(t)}</a>
  ${d?`<div class="cd">${d}</div>`:''}
  <div class="cm"><span class="tag">${esc(S(v))}</span><span class="${est?'est':''}">${esc(h)}</span></div></article>`;
}
function countAll(){let n=0;DATA.secoes.forEach(s=>s.temas.forEach(t=>n+=t.i.length));return n}
function srcLinks(arr){return arr.map(([v,u])=>`<a href="${esc(U(u))}" target="_blank" rel="noopener">${esc(S(v))}</a>`).join('')}

function agendaDestaques(){
  return `<ul class="agdest">${DATA.agenda.destaques.map(([f,t])=>`<li><span class="fl">${f}</span>${esc(t)}</li>`).join('')}</ul><p class="note agnx">${esc(DATA.agenda.proxima)}</p>`;
}
function agendaGrid(){
  const D=DATA.agenda.dias;
  const cell=(p,d)=>p.ev.filter(e=>e[0].startsWith(d)).map(([dd,h,imp,n,at,co,an])=>{
    const v=at?`<b>${esc(at)}</b>${co?` <span class="vs">vs ${esc(co)}</span>`:''}`:(co||an?`<span class="vs">${co?'cons. '+esc(co):''}${co&&an?' · ':''}${an?'ant. '+esc(an):''}</span>`:'');
    return `<div class="mx${imp>=3?' hi':''}"><span class="mxt">${imp>=3?'<span class="imp"></span>':''}${h&&h!=='—'?`<span class="mxh">${esc(h)}</span> `:''}${esc(n)}</span>${v?`<span class="mxv">${v}</span>`:''}</div>`}).join('');
  return `<div class="tbl"><table class="mtx"><thead><tr><th class="pc"></th>${D.map(([d,n])=>`<th>${d} <span>${n}</span></th>`).join('')}</tr></thead><tbody>${DATA.agenda.paises.map(p=>`<tr><th class="pc" title="${esc(p.n)}"><span class="fl">${p.f}</span><span class="pn">(${esc(p.c)})</span></th>${D.map(([d])=>`<td>${cell(p,d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note aglg"><span class="imp"></span> alta importância · em negrito, o resultado divulgado (vs consenso) · horários em BRT; “≈” = estimado · fontes: Investing.com, FGV, BCB, Tesouro e imprensa</p>`;
}
function loadH2C(){return window.html2canvas?Promise.resolve():new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('Não foi possível carregar o gerador de imagem (verifique a conexão).'));document.head.appendChild(sc)})}
async function dlPNG(btn){
  const old=btn.textContent;btn.textContent='Gerando…';btn.disabled=true;
  const box=document.createElement('div');box.className='pngbox';
  const g=document.createElement('div');g.innerHTML=agendaGrid();box.appendChild(g.querySelector('table.mtx'));
  document.body.appendChild(box);
  try{await loadH2C();const bg=getComputedStyle(document.body).backgroundColor;
    const c=await html2canvas(box.firstElementChild,{scale:2,backgroundColor:getComputedStyle(document.querySelector('.panel')||document.body).backgroundColor||'#fff',useCORS:true,logging:false});
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='calendario_semana_'+DATA.agenda.semana.replace(/[^0-9a-z]+/gi,'_')+'.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert(e.message)}finally{box.remove();btn.textContent=old;btn.disabled=false}
}
function renderGeral(){
  return `<section class="panel summary sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><p class="kicker">Resumo global do noticiário · ${esc(DATA.meta.edicao)}</p><h2>O dia em perspectiva</h2><div class="gsec">${DATA.geral.map(g=>`<div class="gblk"><h3>${esc(g.h)}</h3><p>${esc(g.p)}</p></div>`).join('')}</div></section>
  <div class="grid2">
  <section class="panel"><p class="kicker">Top 10 do dia</p><ol class="top10">${DATA.top10.map(x=>`<li><div><a class="t10t" href="${esc(U(x.s[0][1]))}" target="_blank" rel="noopener">${esc(x.t)} ↗</a><div class="t10d">${esc(x.d)}</div><div class="why"><b>Por que importa:</b> ${esc(x.w)}</div><div class="src">${srcLinks(x.s)}</div></div></li>`).join('')}</ol></section>
  <section class="panel"><div class="agtop"><div><p class="kicker">Calendário da semana · ${esc(DATA.agenda.semana)}</p><h2>Destaques</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}<p class="note" style="margin-top:8px">Calendário completo por país na aba “Agenda da Semana”.</p></section>
  </div>
  <section class="panel"><p class="kicker">Log de coleta</p><ul class="log">${DATA.log.map(([s,f,t])=>`<li><span class="${s==='ok'?'okc':'wc'}">${s==='ok'?'✓':'!'}</span> <b>${esc(f)}</b> — ${esc(t)}</li>`).join('')}</ul></section>`;
}
function renderSec(s){
  const nav=s.temas.map((t,k)=>`<a href="#${s.id}-${k}">${esc(t.n)}<b>${t.i.length}</b></a>`).join('');
  const body=s.temas.map((t,k)=>`<section class="panel theme" id="${s.id}-${k}"><div class="th"><h3>${esc(t.n)}${t.pm?` <span class="note">· País do Momento — ${esc(t.pm)}</span>`:''}</h3><span class="cnt"><span class="vis">${t.i.length}</span> notícias</span></div><div class="items">${t.i.map(it=>card(it)).join('')}</div><p class="empty hidden">Nenhuma notícia corresponde ao filtro.</p></section>`).join('');
  return `<div class="${s.cls}"><section class="panel sumbox"><button class="tog" type="button" aria-label="Minimizar ou expandir resumo"></button><div class="sechead"><p class="kicker">Resumo da sessão por classificação</p><h2>${esc(s.nome)}</h2></div><p class="intro">${esc(s.resumo)}</p><div class="tsums">${s.temas.map((t,k)=>`<p><a href="#${s.id}-${k}"><b>${esc(t.n)}${t.pm?' ('+esc(t.pm)+')':''}.</b></a> ${esc(t.r)}</p>`).join('')}</div></section><div class="themes-nav">${nav}</div>${body}</div>`;
}
function renderAgenda(){return `<section class="panel"><div class="agtop"><div><p class="kicker">Agenda da Semana</p><h2>${esc(DATA.agenda.semana)}</h2></div><button class="dl" type="button" onclick="dlPNG(this)">⬇ Baixar calendário (PNG)</button></div>${agendaDestaques()}</section><section class="panel">${agendaGrid()}</section>`}

function tabs(){
  const t=[['geral','Visão Geral',''],...DATA.secoes.map(s=>[s.id,s.nome,s.temas.reduce((a,b)=>a+b.i.length,0)]),['agenda','Agenda da Semana','']];
  $('#tabs').innerHTML=t.map(([id,n,c])=>`<button data-t="${id}" class="${state.tab===id?'on':''}">${esc(n)}${c!==''?`<span class="n">${c}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;try{localStorage.setItem('pn_tab',state.tab)}catch(e){}render();window.scrollTo(0,0)});
}
function render(){
  tabs();
  const app=$('#app');
  if(state.tab==='geral')app.innerHTML=renderGeral();
  else if(state.tab==='agenda')app.innerHTML=renderAgenda();
  else app.innerHTML=renderSec(DATA.secoes.find(s=>s.id===state.tab));
  filter();
  applyCollapse();
  document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{state.col=!state.col;try{localStorage.setItem('pn_col',state.col?'1':'')}catch(e){}applyCollapse()});
}
function applyCollapse(){document.querySelectorAll('.sumbox').forEach(p=>p.classList.toggle('collapsed',!!state.col));document.querySelectorAll('.tog').forEach(b=>b.textContent=state.col?'＋ Expandir resumo':'－ Minimizar resumo')}
function filter(){
  const q=state.q.trim().toLowerCase(),v=state.v;
  if((q||v)&&(state.tab==='geral'||state.tab==='agenda')){
    // global search: show results across sections
    const res=[];DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>{const txt=(it[2]+' '+it[3].replace(/<[^>]+>/g,'')).toLowerCase();if((!q||txt.includes(q))&&(!v||S(it[1])===v))res.push([s.nome+' · '+t.n,it])})));
    $('#app').innerHTML=`<section class="panel"><p class="kicker">Resultados da busca</p><h2>${res.length} notícia(s)</h2><div class="items">${res.map(([w,it])=>card(it).replace('<div class="cm">',`<div class="cm"><span class="note">${esc(w)}</span>`)).join('')||'<p class="empty">Nada encontrado.</p>'}</div></section>`;
    return;
  }
  document.querySelectorAll('.theme').forEach(th=>{let n=0;th.querySelectorAll('.card').forEach(c=>{const ok=(!q||c.dataset.s.includes(q))&&(!v||S(c.dataset.v)===v);c.classList.toggle('hidden',!ok);if(ok)n++});const vis=th.querySelector('.vis');if(vis)vis.textContent=n;th.querySelector('.empty').classList.toggle('hidden',n>0)});
}
function init(){
  $('#meta').textContent=`${DATA.meta.edicao} · Janela: ${DATA.meta.janela} · ${countAll()} notícias classificadas`;
  const vs=new Set();DATA.secoes.forEach(s=>s.temas.forEach(t=>t.i.forEach(it=>vs.add(S(it[1])))));
  $('#fv').innerHTML+= [...vs].sort().map(v=>`<option>${esc(v)}</option>`).join('');
  $('#q').oninput=e=>{state.q=e.target.value;if(state.tab==='geral'||state.tab==='agenda'){if(!state.q&&!state.v)render();else filter()}else filter()};
  $('#fv').onchange=e=>{state.v=e.target.value;if((state.tab==='geral'||state.tab==='agenda')&&!state.q&&!state.v)render();else filter()};
  $('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pn_theme',n)}catch(e){}};
  render();
}
init();
</script>
